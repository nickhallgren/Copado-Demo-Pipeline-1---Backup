        <div>
            1. The objective of this Standard is to specify Disclosure Requirements which will enable users of <b>sustainability statements</b> to understand:
			<ol class="slds-list--ordered">
				<li>how the undertaking affects climate change, in terms of material positive and negative actual and potential impacts; </li>
				<li>the undertaking’s past, current, and future mitigation efforts in line with the Paris Agreement (or an updated international agreement on climate change) and limiting global warming to 1.5°C;</li>
				<li>the plans and capacity of the undertaking to adapt its strategy business model(s) and in line with the transition to a sustainable economy and to contribute to limiting global warming to 1.5°C;</li>
				<li>any other <b>actions</b> taken by the undertaking, and the result of such actions to prevent, mitigate or remediate actual or potential negative impacts, and to address <b>risks</b> and <b>opportunities</b>;</li>
				<li>the nature, type and extent of the undertaking’s material risks and opportunities arising from the undertaking’s impacts and <b>dependencies</b> on climate change, and how the undertaking manages them; and </li>
				<li>the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of risks and opportunities arising from the undertaking’s impacts and dependencies on climate change.</li>
			</ol>
			<br>
			2. The Disclosure Requirements of this Standard take into account the requirements of related EU legislation and regulation (i.e., EU Climate Law<span class="tooltip-wrap"><sup>30</sup>&nbsp;
                <div class="tooltip-left">
				Regulation (EU) 2021/1119 of the European Parliament and of the Council of 30 June 2021 establishing the framework for achieving climate neutrality and amending Regulations (EC) No 401/2009 and (EU) 2018/1999 (‘European Climate Law’) (OJ L 243, 9.7.2021, p. 1). 
                </div> 
            </span>, Climate Benchmark Standards Regulation<span class="tooltip-wrap"><sup>31</sup>&nbsp;
                <div class="tooltip-content">
				Commission Delegated Regulation (EU) 2020/1818 of 17 July 2020 supplementing Regulation (EU) 2016/1011 of the European Parliament and of the Council as regards minimum standards for EU Climate Transition Benchmarks and EU Parisaligned Benchmarks (OJ L 406, 3.12.2020, p. 17). 
                </div> 
            </span>, Sustainable Finance Disclosure Regulation (SFDR)<span class="tooltip-wrap"><sup>32</sup>&nbsp;
                <div class="tooltip-content">

                </div> 
            </span>, EU Taxonomy<span class="tooltip-wrap"><sup>33</sup>&nbsp;
                <div class="tooltip-content">

                </div> 
            </span>).<br><br>
			3. This Standard covers Disclosure Requirements related to the following <b>sustainability matters</b>: “<b>Climate change mitigation</b>”, “<b>Climate change adaptation</b>” It also covers energy-related matters, to the extent that they are relevant to climate change. <br><br>
			4. <b>Climate change mitigation</b> relates to the undertaking’s endeavours to the general process of limiting the increase in the global average temperature to 1,5 °C above pre-industrial levels in line with the Paris Agreement. This Standard covers disclosure requirements related but not limited to the seven <b>Greenhouse gases</b> (GHG) carbon dioxide (CO2), methane (CH4), nitrous oxide (N2O), hydrofluorocarbons (HFCs), perfluorocarbons (PFCs), sulphur hexafluoride (SF6) and nitrogen trifluoride (NF3). It also covers Disclosure Requirements on how the undertaking addresses its GHG <b>emissions</b> as well as the associated <b>transition risks</b>.<br><br>
			5. <b>Climate change adaptation</b> relates to the undertaking’s process of adjustment to actual and expected climate change.<br><br>
			6. This Standard covers Disclosure Requirements regarding climate-related hazards that can lead to physical climate risks for the undertaking and its adaptation solutions to reduce these risks. It also covers <b>transition risks</b> arising from the needed adaptation to climate-related hazards.<br><br>
			7. The Disclosure Requirements related to “Energy” cover all types of energy production and consumption.<br><br>

            </div> 
    </a><br>
        53. The undertaking shall disclose its GHG <b>emissions</b> intensity (total GHG emissions per net revenue).<br><br>

        54. The disclosure on GHG intensity required by paragraph 53 shall provide the total GHG <b>emissions</b> in metric tonnes of CO2eq (required by paragraph 44(d)) per net revenue.<br><br>

        55. The undertaking shall disclose the reconciliation to the relevant line item or notes in the financial statements of the net revenue amounts (the denominator in the calculation of the GHG emissions intensity required by paragraph 53).<br><br>

    <details>
        <summary> E1-7 </summary>
    <div id='divE1-7'>
        56. <b>The undertaking shall disclose:</b>
		<ol class="slds-list--ordered">
        <li><b>GHG removals and storage in metric tonnes of CO2eq resulting from projects it may have developed in its own operations, or contributed to in its upstream and downstream value chain; and</b></li>
        <li>the amount of GHG emission reductions or removals from climate change mitigation projects outside its value chain it has financed or intends to finance through any purchase of carbon credits.</li>
		</ol>
		<br>

        57. The objective of this Disclosure Requirement is:
		<ol class="slds-list--ordered">
        <li>to provide an understanding of the undertaking’s <b>actions</b> to permanently remove or actively support the removal of GHG from the atmosphere, potentially for achieving <b>net-zero targets</b> (as stated in paragraph 60).</li>
        <li>to provide an understanding of the extent and quality of <b>carbon credits</b> the undertaking has purchased or intends to purchase from the voluntary market, potentially for supporting its GHG neutrality claims (as stated in paragraph 61).</li>
		</ol>
		<br><br>

        58. The disclosure on <b>GHG removals and storage</b> required by paragraph 56(a) shall include, if applicable:
		<ol class="slds-list--ordered">
        <li>the total amount of GHG removals and storage in metric tonnes of CO2eq disaggregated and separately disclosed for the amount related to the undertaking’s own operations and its  upstream and donwstream value chain, and broken down by removal activity; and </li>
        <li>the calculation assumptions, methodologies and frameworks applied by the undertaking.</li>
		</ol>
		<br>


        59. The disclosure on <b>carbon credits</b> required by paragraph 56(b) shall include, if applicable:
		<ol class="slds-list--ordered">
        <li>the total amount of carbon credits outside the undertaking’s <b>value chain</b> in metric tonnes of CO2eq that are verified against recognised quality standards and cancelled in the reporting period; and</li>
        <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq planned to be cancelled in the future and whether they are based on existing contractual agreements or not.</li>
		</ol>
		<br>

        60. In the case where the undertaking discloses a <b>net-zero target</b> in addition to the gross <b>GHG emission reduction targets</b> in accordance Disclosure Requirement E1-4, paragraph 32, it shall explain the scope, methodologies and frameworks applied and how the residual GHG <b>emissions</b> (after approximately 90-95% of GHG emission reduction with the possibility for justified sectoral variations in line with a recognised sectoral decarbonisation pathway) are intended to be neutralised by GHG removals in its own operations and upstream and donwstream value chain.<br><br>

        61. In the case where the undertaking may have made public claims of GHG neutrality that involve the use of <b>carbon credits</b>, it shall explain:
			<ol class="slds-list--ordered">
			<li>whether and how these claims are accompanied by GHG <b>emission reduction targets</b> as required by Disclosure requirement ESRS E1-4;</li>
			<li>whether and how these claims and the reliance on carbon credits neither impede nor reduce the achievement of its GHG emission reduction targets<span class="tooltip-wrap"><sup>47</sup>&nbsp;
                <div class="tooltip-left">
				  This information is aligned with Regulation (EU) 2021/1119 of the European Parliament and of the Council (EU Climate Law), Article 2 (1). 
                </div> 
            </span>, or, if applicable, its net zero target; and</li>
			<li>the credibility and integrity of the carbon credits used, including by reference to recognised quality standards.</li>
			</ol>
		<br><br>
    </div>
    </details>

    <details>

        62. <b>The undertaking shall disclose whether it applies internal carbon pricing schemes, and if so, how these support its decision making and incentivise the implementation of climate-related policies and targets</b>.<br><br>

        63. The information required in 62 shall include:
		<ol class="slds-list--ordered">
        <li>the type of internal carbon pricing scheme, for example, the shadow prices applied for CapEX or research and development (R&D) investment decision making, internal carbon fees or internal carbon funds;</li>
        <li>the specific scope of application of the carbon pricing schemes (activities, geographies, entities, etc.);</li>
        <li>the carbon prices applied according to the type of scheme and critical assumptions made to determine the prices, including the source of the applied carbon prices and why these are deemed relevant for their chosen application. The undertaking may disclose the calculation methodology of the carbon prices including the extent to which these have been set using scientific guidance and how their future development is related to science-based carbon pricing trajectories; and</li>
        <li>the current year approximate gross GHG emission volumes by Scopes 1, 2 and, where applicable, Scope 3 in metric tonnes of CO2eq covered by these schemes, as well as their share of the undertaking’s overall GHG <b>emissions</b> for each respective Scope.</li>
		</ol>
		<br>
    </div>
    </details>
    
    <details>
        <summary> E1-9 </summary>
    <div id='divE1-9'>
        64. <b>The undertaking shall disclose its</b>:
		<ol class="slds-list--ordered">
        <li><b>anticipated financial effects from material physical risks</b>;</li>
        <li><b>anticipated financial effects from material transition risks; and</b></li>
        <li><b>potential to pursue material climate-related opportunities.</b></li>
		</ol><br>

        65. The information required by 64 differs from and is in addition to the information on the current <b>financial effects</b> required under ESRS 2 SBM-3 para 48(d). The objective of this Disclosure Requirement related to:
		<ol class="slds-list--ordered">
        <li><b>anticipated financial effects</b> due to material <b>physical risks</b> and <b>transition risks</b> is to provide an understanding of how these risks have (or could reasonably be expected to have) a material influence on the undertaking’s financial position, financial performance and cash flows, over the short-, medium- and long- term. The results of <b>scenario analysis</b> used to conduct resilience analysis as required under paragraphs AR 10 to AR 13 should inform the assessment of anticipated financial effects from material physical and transition risks.</li>
        <li>potential to pursue material climate-related <b>opportunities</b> is to enable an understanding of how the undertaking may financially benefit from material climaterelated opportunities. This disclosure is complementary to the key performance indicators to be disclosed in accordance with Commission Delegated Regulation (EU) 2021/2178.</li>
		</ol>
		<br>

        
        66. The disclosure of <b>anticipated financial effects</b> from material <b>physical risks</b> required by paragraph 64(a) shall include&nbsp;<a class="tooltip-wrap"><sup>48</sup>&nbsp;
            <div class="tooltip-content">
                This information is aligned with the Commission Delegated Regulation (EU) 2020/1818 (Climate Benchmark Regulation).
            </div> 
            </a>:
		<ol class="slds-list--ordered">
        <li>the monetary amount and proportion (percentage) of assets at material physical risk over the short-, medium- and long-term before considering <b>climate change adaptation actions</b>; with the monetary amounts of these assets disaggregated by acute and chronic physical risk <span class="tooltip-wrap"><sup>49</sup> &nbsp;
            <div class="tooltip-content">
			This disclosure requirement is consistent with the requirements included in Commission Implementing Regulation (EU) 2022/2453 - Template 5: Banking book - Climate change physical risk: Exposures subject to physical risk.
            </div> 
        </span>;</li>
        <li>the proportion of assets at material physical risk addressed by the <b>climate change adaptation actions</b>; </li>
        <li>the location of significant assets at material physical risk<span class="tooltip-wrap"><sup>50</sup>
            <div class="tooltip-content">
			This disclosure requirement is consistent with the requirements included in Commission Implementing Regulation (EU) 2022/2453 - Template 5: Banking book - Climate change physical risk: Exposures subject to physical risk.
            </div> 
        </span>; and</li>
        <li>the monetary amount and proportion (percentage) of net revenue from its business activities at material physical risk over the short-, medium- and long-term.</li>
		</ol>
		<br>

        67. The disclosure of <b>anticipated financial effects</b> from material transition risk required by paragraph 64(b) shall include:
		<ol class="slds-list--ordered">
        <li>the monetary amount and proportion (percentage) of assets at material transition risk over the short-, medium- and long-term before considering <b>climate mitigation actions</b>; </li>
        <li>the proportion of assets at material transition risk addressed by the <b>climate change mitigation actions</b>;</li>
        <li>a breakdown of the carrying value of the undertaking’s real estate assets by energy-efficiency classes<span class="tooltip-wrap"><sup>51</sup>
            <div class="tooltip-content">
			This disclosure requirement is consistent with the requirements included in Commission Implementing Regulation (EU) 2022/2453- Template 2: Banking book - Climate change transition risk: Loans collateralised by immovable property - Energy efficiency of the collateral.
            </div> 
        </span>;</li>
        <li>liabilities that may have to be recognised in financial statements over the short-, medium- and long-term; and</li>
        <li>the monetary amount and proportion (percentage) of net revenue from its business activities at material transition risk over the short-, medium- and long-term including, where relevant, the net revenue from the undertaking’s customers operating in coal, oil and gas-related activities.</li>
		</ol>
		<br>
        
        68. The undertaking shall disclose reconciliations to the relevant line items or notes in the financial statements of the following:
		<ol class="slds-list--ordered">
        <li>significant amounts of the assets and net revenue at material physical risk (as required by paragraph 66).</li>
        <li>significant amounts of the assets, liabilities, and net revenue at material transition risk (as required by paragraph 67).</li>
		<br>
		</ol>

        69. For the disclosure of potential to pursue climate-related <b>opportunities</b> required by 64(c), the undertaking shall consider&nbsp;<a class="tooltip-wrap"><sup>52</sup>
            <div class="tooltip-content">
                This information is aligned with Commission Delegated Regulation (EU) 2020/1818 (Climate Benchmark Regulation).
            </div> 
        </a>:
		<ol class="slds-list--ordered">
        <li>its expected cost savings from <b>climate change mitigation</b> and adaptation <b>actions</b>; and</li>
        <li>the potential market size or expected changes to net revenue from low-carbon products and services or adaptation solutions to which the undertaking has or may have access.</li>
		</ol>
		<br>   

        70. A quantification of the <b>financial effects</b> that arise from <b>opportunities</b> is not required if such a disclosure does not meet the qualitative characteristics of useful information included under ESRS 1 Appendix B Qualitative characteristics of information.<br><br>
