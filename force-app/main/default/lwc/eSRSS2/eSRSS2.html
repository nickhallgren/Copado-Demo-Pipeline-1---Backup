        <summary>Objective</summary>
        <div>
       1. The objective of this Standard is to specify disclosure requirements which will enable <b>users</b> of the <b>sustainability statement</b> to understand material <b>impacts</b> on <b>value chain workers</b> connected with the undertaking’s own operations and value chain, including through its products or services, as well as through its business relationships, and its related material risks and opportunities, including:
       <ol class="slds-list--ordered">
            <li> how the undertaking affects workers in its value chain, in terms of material positive and negative actual or potential impacts;</li>
            <li> any <b>actions</b> taken, and the result of such actions, to prevent, mitigate or remediate actual or potential negative impacts, and to address risks and opportunities;</li>
            <li> the nature, type and extent of the undertaking’s material risks and opportunities including those related to its impacts and <b>dependencies</b> on workers in the value chain, and how the undertaking manages them; and</li>
            <li> the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of material risks and opportunities, including those arising from the undertaking’s impacts and dependencies on workers in the value chain.</li>
        </ol>
		<br>
		2. In order to meet the objective, this Standard requires an explanation of the general approach the undertaking takes to identify and manage any material actual and potential <b>impacts</b> on <b>value chain</b> workers in relation to:
        <ol class="slds-list--ordered">
        <li> working conditions (for example, secure employment, working time, <b>adequate wage</b>, <b>social dialogue</b>, freedom of association, including the existence of work councils, <b>collective bargaining</b>, <b>work-life balance</b> and health and safety);</li>
		<li> <b>equal treatment</b> and <b>opportunities</b> for all (for example, gender equality and equal <b>pay</b> for work of equal value, <b>training</b> and skills <b>development</b>, the employment and inclusion of <b>persons with disabilities</b>, measures against violence and <b>harassment</b> in the workplace, and diversity);</li>
        <li> other work-related rights (for example, <b>child labour</b>, <b>forced labour</b>, adequate housing, water and sanitation and privacy).</li>
        </ol>
		<br>
		3. This Standard also requires an explanation of how such impacts, as well as the undertaking’s <b>dependencies</b> on <b>value chain workers</b>, can create material risks or opportunities for the undertaking.For example, negative impacts on value chain workers may disrupt the undertaking’s operations (through customers refusing to buy its products or state agencies impounding its goods) and harm its reputation. Conversely, respect for workers’ rights and active support programmes (for example through financial literacy initiatives) can bring business opportunities, such as more reliable supply or widening of the future <b>consumer</b> base.<br><br>
		4. This Standard covers all workers in the undertaking’s upstream and downstream <b>value chain</b> who are or can be materially impacted by the undertaking, including impacts that are connected with the undertaking’s own operations and value chain, including through its productsor services, as well as through its business relationships. This includes all workers who are not included in the scope of “<b>own workforce</b>” (“own workforce” includes <b>employees</b>, individual contractors, i.e., self- employed workers, and workers provided by third party undertakings primarily engaged in ‘employment activities’). <b>Own workforce</b> is covered in ESRS S1 Own workforce. See AR 3 for examples of what is included in the scope of this Standard.
		<br><br>

		20. <b>The undertaking shall disclose its general processes for engaging with value chain workers and their representatives about actual and potential impacts on them.</b><br><br>
        21. The objective of this Disclosure Requirement is to enable an understanding of whether and how the undertaking engages, as part of its ongoing due diligence process, with <b>value chain workers</b> and their legitimate representatives, or with <b>credible proxies</b>, about material actual and potential positive and/or negative impacts that do or are likely to affect them, and whether and how perspectives of value chain workers are taken into account in the decision-making processes of the undertaking.<br><br>

        <li>the stage(s) at which engagement occurs, the type of engagement, and the frequency of the engagement;</li>
        <li>the function and the most senior role within the undertaking that has operational responsibility for ensuring that this engagement happens, and that the results inform the undertaking’s approach;</li>

		</ol>

		AR 10. If the policies are limited to the undertaking’s <b>own workforce</b> and do not cover workers in upstream and downstream entities and relationships, they shall be disclosed under ESRS S1 and not in relation to this requirement.<br><br>
        AR 11. If the disclosures under ESRS S1 include information relevant for workers in the value chain, a reference to this can be made here; disclosures on the remaining elements shall then be fulfilled under this Disclosure Requirement.<br><br>
        AR 12. The undertaking may disclose explanations of significant changes to the policies adopted during the reporting year (e.g., new expectations for <b>suppliers</b>, new or additional approaches to due diligence and remedy).<br><br>
        AR 13. The policy may take the form of a stand-alone policy regarding <b>value chain</b> workers or be included in a broader document such as a code of ethics or a general sustainability policy that has already been disclosed by the undertaking as part of another ESRS. In those cases, the undertakingshall provide an accurate cross-reference to identify the aspects of the policy that satisfy the requirements of this Disclosure Requirement.<br><br>
        AR 14. When disclosing the alignment of its policies with the UN Guiding Principles on Business and Human Rights, the undertaking shall consider that the Guiding Principles refer to the International Bill of Rights, which consist of the Universal Declaration of Human Rights and the two Covenants that implement it, as well as the International Labour Organisation’s Declaration on Fundamental Rights and Principles at Work and the core conventions that underpin it, and may disclose its alignment with these instruments.<br><br>
        AR 15. When disclosing how external-facing policies are embedded, the undertaking may, for example, consider internal policies of responsible sourcing, and alignment with other policies relevant to <b>value chain</b> workers, for example, regarding <b>forced labour</b>. With regard to <b>supplier</b> codes of conduct that the undertaking may have, the summary shall indicate whether they include provisions addressing the safety of workers, precarious work (for example, the use of workers on short-term or limited hours contracts, workers employed via third parties, sub-contracting to third parties or use of informal workers), human trafficking, the use of forced labour or <b>child labour</b>, and whether such provisions are fully in line with applicable ILO standards.<br><br>
        AR 16. The undertaking may provide an illustration of the types of communication of its policies to those individuals, group of individuals or entities for whom they are relevant, either because they are expected to implement them (for example, the undertaking’s <b>employees</b>, contractors and <b>suppliers</b>), or because they have a direct interest in their implementation (for example, own workers, investors). It may disclose communication tools and channels (for example, flyers, newsletters, dedicated websites, social media, face to face interactions, workers’ representatives), aimed at ensuring that the <b>policy</b> is accessible and that different audiences understand its implications. The undertaking may also explain how it identifies and removes potential barriers for dissemination, such as through translation into relevant languages or the use of graphic depictions.<br><br>

		AR 21. In fulfilling the requirements set out by Disclosure Requirement ESRS S2-3, the undertaking may beguided by the content of the UN Guiding Principles on Business and Human Rights and the OECD Guidelines for Multinational Enterprises focused on <b>remediation</b> and <b>grievance mechanisms</b>.<br><br>
        AR 22. Channels for raising concerns or needs include <b>grievance mechanisms</b>, hotlines, trade unions (where workers are unionised), dialogue processes or other means through which <b>value chain</b> workers or their <b>legitimate representatives</b> can raise concerns about impacts or explain needs that they would like the undertaking to address. This could include both channels provided by the undertaking directly and channels provided by the entities where the value chain workers are working, in addition to any other mechanisms the undertaking may use to gain insight into the management of impacts on workers, such as compliance audits. Where the undertaking is relying solely on information about the existence of such channels provided by its <b>business relationships</b> to answer this requirement, it may state that.<br><br>
        AR 23. To provide greater insight into the information covered in Disclosure Requirement ESRS S2-3, the undertaking may explain whether and how <b>value chain</b> workers that may be affected areable to access channels at the level of the undertaking they are employed by, or contracted to work for, in relation to each material impact.<br><br>
        AR 24. Third party mechanisms could include those operated by the government, NGOs, industry associations and other collaborative initiatives. The undertaking may disclose whether these are accessible to all workers who may be potentially or actually materially impacted by the undertaking, or individuals or organisations acting on their behalf or who are otherwise in a position to be aware of negative impacts.<br><br>
        AR 25. In relation to the protection of individuals that use the mechanisms against the retaliation, the undertaking may describe whether it treats grievances confidentially and with respect to the rights ofprivacy and data protection; and whether the mechanisms allow for workers to use them anonymously (for example, through representation by a third party).<br><br>
        AR 26. In disclosing whether and how the undertaking knows that <b>value chain</b> workers are aware of and trust any of these channels, the undertaking may provide relevant and reliable data about the effectiveness of these channels from the perspective of value chain workers themselves. Examples of sources of information are surveys of workers that have used such channels and their levels of satisfaction with the process and outcomes.<br><br>
        AR 27. In describing the effectiveness of channels for <b>value chain</b> workers to raise concerns, the undertaking may be guided by the following questions, based on the “effectiveness criteria for non-judicial <b>grievance mechanisms</b>”, as laid out in the UN Guiding Principles on Business and Human Rights, in particular Principle 31. The below considerations may be applied to individual channels or to a collective system of channels:
		<ol class="slds-list--ordered">
           <li> do the channels hold legitimacy by providing appropriate accountability for their fair conduct and building stakeholder trust?</li>
           <li> are the channels known and accessible to <b>stakeholders</b>?</li>
           <li> do the channels have clear and known procedures, with indicative timeframes?</li>
           <li> do the channels ensure reasonable access for <b>stakeholders</b> to sources of information,advice and expertise?</li>
           <li> do the channels offer transparency by providing sufficient information both to complainants and, where applicable, to meet any public interest?</li>
           <li> do outcomes achieved through the channels accord with internationally recognised human rights?</li>
           <li> does the undertaking identify insights from the channels that support continuous learning in both improving the channels and preventing future impacts?</li>
           <li> does the undertaking focus on dialogue with complainants as the means to reach agreed solutions, rather than seeking to unilaterally determine the outcome?</li>
		</ol>

		AR 28. It may take time to understand negative impacts and how the undertaking may be involved with themthrough its value chain, as well as to identify appropriate responses and put them into practice. Therefore, the undertaking shall consider:
		<ol class="slds-list--ordered">
           <li> its general and specific approaches to addressing material negative impacts;</li>
           <li> its initiatives aimed at contributing to additional material positive impacts;</li>
           <li> how far it has progressed in its efforts during the reporting period; and</li>
           <li> its aims for continued improvement.</li>
		</ol>
		<br>
        AR 29. Appropriate action can vary according to whether the undertaking causes or contributes to a material impact or whether the material impact is directly linked to its own operations, products or services through a business relationship.<br><br>
        AR 30. Given that material negative impacts affecting <b>value chain</b> workers that have occurred during the reporting period may also be linked to entities or operations outside its direct control, the undertaking may disclose whether and how it seeks to use its leverage in its <b>business relationships</b> to manage those impacts. This may include using commercial <b>leverage</b> (for example, enforcing contractual requirements with business relationships or implementing incentives), other forms of leverage within the relationship (such as providing <b>training</b> or capacity-building on workers’ rights to entities with which the undertaking has a business relationships) or collaborative leverage with peers or other actors (such as initiatives aimed at responsible recruitment or ensuring workers receive an <b>adequate wage</b>)<br><br>
        AR 31. When the undertaking discloses its participation in an industry or multi-stakeholder initiative as part of its <b>actions</b> to address material negative impacts, the undertaking may disclose how the initiative, and its own involvement, is aiming to address the material impact concerned. It may disclose under ESRS S2-5 the relevant <b>targets</b> set by the initiative and progress towards them.<br><br>
        AR 32. When disclosing whether and how the undertaking considers actual and potential impacts on <b>value chain</b> workers in decisions to terminate <b>business relationships</b> and whether and how it seeks to address any negative impacts that may result from termination, the undertaking may include examples.<br><br>
        AR 33. In disclosing how it tracks the effectiveness of its <b>actions</b> to manage material impacts during the reporting period, the undertaking may disclose any lessons learned from the previous and current reporting periods.<br><br>
        AR 34. Processes used to track the effectiveness of <b>actions</b> can include internal or external auditing or verification, court proceedings and/or related court decisions, impact assessments, measurement systems, stakeholder feedback, <b>grievance mechanisms</b>, external performance ratings, and benchmarking.<br><br>
        AR 35. Reporting on effectiveness is aimed at enabling the understanding of the links between <b>actions</b> taken by the undertaking and the effective management of impacts. For example, to show the effectiveness of its <b>actions</b> to support its <b>suppliers</b> with improving their working conditions, the undertaking may disclose survey feedback from the suppliers’ workers showing that working conditions have improved since the time the undertaking began working with those suppliers. Additional information that the undertaking may provide includes data showing a decrease in the number of <b>incidents</b> identified through for instance, independent audits.<br><br>
        AR 36. With regard to initiatives or processes the undertaking has in place that are based on affected workers’ needs and with regard to progress in the implementation of such initiatives or processes, the undertaking may disclose:
		<ol class="slds-list--ordered">
           <li> information about whether and how <b>value chain</b> workers and <b>legitimate representatives</b> or their <b>credible proxies</b> play a role in decisions regarding the design and implementation of these programmes or processes; and</li>
           <li> information about the intended or achieved positive outcomes for value chain workers ofthese initiatives or processes</li>
		</ol>
		<br>
        AR 37. The undertaking may disclose whether any initiatives or processes whose primary aim is to deliver positive impacts for <b>value chain</b> workers are designed also to support the achievement of one or more of the UN Sustainable Development Goals (SDGs). For example, through a commitment to advance UN SDG 8 to “promote sustained, inclusive and sustainable economic growth, full and productive employment and decent work for all” the undertaking may be providing capacity-building to smallholders in its <b>supply chain</b>, resulting in increases in their income; or it may be supporting <b>training</b> to increase the proportion of women able to take delivery jobs in its downstream value chain.<br><br>
        AR 38. When disclosing the intended or achieved positive outcomes of its <b>actions</b> for <b>value chain</b> workers adistinction is to be made between evidence of certain activities having occurred (e.g., that x numberof workers have received financial literacy <b>training</b>) from evidence of actual outcomes for workers (e.g., that x workers report that they are able to better manage their household budgets so as to meet their savings goals).<br><br>
        AR 39. When disclosing whether initiatives or processes also play a role in mitigating material negative impacts, the undertaking may e.g., consider programmes that aim to advance women workers’ financial literacy that have resulted in more women being promoted as well as in reports of reduced sexual <b>harassment</b> in the workplace.<br><br>
        AR 40. When disclosing the material risks and opportunities related to the undertaking’s impacts or <b>dependencies</b> on <b>value chain</b> workers, the undertaking may consider the following:
		<ol class="slds-list--ordered">
           <li> risks related to the undertaking’s impacts on value chain workers may include the reputational or legal exposure where value chain workers are found to be subject to <b>forced labour</b> or <b>child labour</b>;</li>
           <li> risks related to the undertaking’s dependencies on value chain workers may include disruption of business operations where a pandemic closes significant parts of its <b>supply chain</b> or distribution network;</li>
           <li> opportunities related to the undertaking’s impacts on value chain workers may include market differentiation and greater customer appeal from guaranteeing decent <b>pay</b> and conditions for non-employee workers; and</li>
           <li> business opportunities related to the undertaking’s dependencies on value chain workers might include the achievement of a future sustainable supply of a commodity by ensuring smallholder farmers earn enough to persuade future generations to keep farming that crop.</li>
		</ol>
		<br>
        AR 41. When disclosing whether <b>dependencies</b> turn into risks, the undertaking shall consider external developments.<br><br>
        AR 42. When disclosing policies, <b>actions</b> and resources and <b>targets</b> related to the management of material <b>risks</b> and <b>opportunities</b>, in cases where risks and opportunities arise from a material <b>impact</b>, the undertaking may cross-reference its disclosures on policies, action and resources and targets in relation to that impact.<br><br>
        AR 43. The undertaking shall consider whether and how its process(es) to manage material risks related to <b>value chain</b> workers are integrated into its existing risk management process(es).<br><br>
        AR 44. When disclosing the resources allocated to the management of material impacts, the undertaking may disclose which internal functions are involved in managing the impacts and what types of actionthey take to address negative and advance positive impacts.<br><br>
		</div>
        </details>
		
		<details>
            <summary> S2-5 </summary>
        <div id='divS2-5AR'>
		AR 45. When disclosing information about targets in accordance with paragraph <a class="tooltip-wrap">39&nbsp;
            <div class="tooltip-content">
            <b>The undertaking shall disclose the time-bound and outcome-oriented targets it may have set related to:</b>
		<ol class="slds-list--ordered">
        <li> <b>reducing negative impacts on value chain workers; and/or</b></li>
        <li> <b>advancing positive impacts on value chain workers; and/or</b></li>
        <li> <b>managing material risks and opportunities related to value chain workers.</b></li>
		</ol>             
            </div> 
        </a>, the undertaking may disclose:
		<ol class="slds-list--ordered">
           <li> the intended outcomes to be achieved in the lives of <b>value chain</b> workers, being as specific as possible;</li>
           <li> the stability of the targets over time in terms of definitions and methodologies to enable comparability over time;</li>
           <li> the standards or commitments on which the targets are based (for instance codes of conduct, sourcing policies, global frameworks or industry codes)</li>
		</ol>
		<br>
        AR 46. <b>Targets</b> related to material <b>risks</b> and <b>opportunities</b> may be the same as or distinct from targets related to material <b>impacts</b>. For example, a target to reach living <b>wages</b> for <b>supply chain</b> workers could both reduce impacts on those workers and reduce associated risks in terms of the quality and reliability of supply.<br><br>
        AR 47. The undertaking may also distinguish between short-, medium- and long-term <b>targets</b> covering the same <b>policy</b> commitment. For example, the undertaking may have a long-term target to achieve an 80% reduction in health and safety <b>incidents</b> affecting the workers of a given <b>supplier</b> by 2030 and a near-term target to reduce their <b>overtime</b> hours of delivery drivers by x% while maintaining their income by 2024.<br><br>
        AR 48. When modifying or replacing a <b>target</b> in the reporting period, the undertaking may explain the change by cross-referencing it to significant changes in the <b>business model</b> or to broader changes in theaccepted standard or legislation from which the target is derived to provide contextual information, as per ESRS 2 BP-2 Disclosures in relation to specific circumstances.<br><br>
		</div>
