        <summary>Objective</summary>
        <div>
            1. The objective of this Standard is to specify disclosure requirements which will enable <b>users</b> of the <b>sustainability statement</b> to understand the undertaking’s material <b>impacts</b> on its <b>own workforce</b>, as well as related material <b>risks</b> and <b>opportunities</b>, including:
                <ol class="slds-list--ordered">
	                <li> how the undertaking affects its <b>own workforce,</b> in terms of material positive and negative actual or potential impacts; </li>
	                <li> any <b>actions</b> taken, and the result of such actions, to prevent, mitigate or remediate actual or potential negative impacts, and to address risks and opportunities;</li>
	                <li>the nature, type and extent of the undertaking’s material risks and opportunities related to its impacts and <b>dependencies</b> on its own workforce, and how the undertaking manages them; and</li>
	                <li> the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of material risks and opportunities arising from the undertaking’s impacts and dependencies on its own workforce.</li>
                </ol>
                <br>
             2. In order to meet the objective, this Standard also requires an explanation of the general approach the undertaking takes to identify and manage any material actual and potential <b>impacts</b> on its <b>own workforce</b> in relation to the following social, including human rights, factors or matters:
                <ol class="slds-list--ordered">
		            <li> working conditions, including:</li>
		                <ol class="slds-is-nested">
		                	<li> secure employment;</li>
			                <li> working time; </li>
			                <li> <b>adequate wages;</b> </li>
			                <li> <b>social dialogue;</b></li>
			                <li> freedom of association, the existence of works councils and the information, consultation and participation rights of workers;</li>
			                <li> <b>collective bargaining</b>, including the rate of the undertaking’s workforce covered by collectiveagreements;</li>
			                <li> work-life balance; and</li>
			                <li> health and safety.</li>
		                </ol>
		            <li> <b>equal treatment</b> and <b>opportunities</b> for all, including: </li>
		                <ol class="slds-is-nested">
			                <li> gender equality and equal <b>pay</b> for work of equal value;</li>
			                <li> <b>training</b> and skills <b>development;</b></li>
			                <li> employment and inclusion of <b>persons with disabilities</b>; </li>
			                <li> measures against violence and <b>harassment</b> in the workplace; and</li>
			                <li> diversity.</li>
		                </ol>
		            <li>other work-related rights, including:</li>
		                <ol class="slds-is-nested">
			                <li> child labour; </li>
			                <li> <b>forced labour</b>;</li>
			                <li> adequate housing; and</li>
			                <li> privacy.</li>
		                </ol>
                </ol>
                <br>
            3. This Standard also requires an explanation of how such <b>impacts</b>, as well as the undertaking’s <b>dependencies</b> on its <b>own workforce</b>, can create material <b>risks</b> or <b>opportunities</b> for the undertaking. For example, on the matter of equal opportunities, <b>discrimination</b> in hiring and promotion against women can reduce the undertaking’s access to qualified labour and harm its reputation. Conversely, policies to increase the representation of women in the workforce and in upper levels of management can have positive effects, such as increasing the pool of qualified labour and improving the undertaking’s reputation.<br><br>
            4. This Standard covers an undertaking’s <b>own workforce</b>, which is understood to include both people who are in an employment relationship with the undertaking (“<b>employees</b>”) and <b>non-employees</b> who are either people with contracts with the undertaking to supply labour (“self-employed people”) or people provided by undertakings primarily engaged in “employment activities” (NACE Code N78). See Application Requirement 3 for examples of whofalls under own workforce. The information required to be disclosed with regard to non-employees shall not affect their status pursuant to applicable labour law.<br><br>
            5. This Standard does not cover workers in the undertaking’s upstream or downstream <b>value chain</b>; these categories of workers are covered in ESRS S2 Workers in the value chain.<br><br>
            6. The Standard requires undertakings to describe their <b>own workforce</b>, including key characteristics of the <b>employees</b> and <b>non-employee</b> that are part of it. This description provides <b>users</b> with an understanding of the structure of the undertaking’s <b>own workforce</b> and helps to contextualise information provided through other disclosures.<br><br>
            7. The objective of the Standard is also to enable <b>users</b> to understand the extent to which the undertaking aligns or complies with international and European human rights instruments and conventions, including the International Bill of Human Rights, the UN Guiding Principles onBusiness and Human Rights and the OECD Guidelines for Multinational Enterprises, the International Labour Organization’s Declaration on Fundamental Principles and Rights at Workand ILO fundamental conventions, the UN Convention on Persons with Disabilities, the European Convention of Human Rights, the revised European Social Charter, the Charter of Fundamental Rights of the European Union, the EU <b>policy</b> priorities as set out by the European Pillar of Social Rights, and Union legislation, including the EU labour law acquis.<br><br>
        </div>
    </details>

		25. <b>The undertaking shall disclose its general processes for engaging with people in its own workforce and workers' representatives about actual and potential impacts on its own workforce</b>.<br><br>
        26. The objective of this Disclosure Requirement is to enable an understanding of how the undertaking engages, as part of its ongoing due diligence process, with people in its <b>own workforce</b> and <b>workers' representatives</b> about material, actual and potential, positive and/or negative <b>impacts</b> that do or are likely to affect them, and whether and how perspectives of its own workforces are taken into account in the decision-making processes of the undertaking.<br><br>
        27. The undertaking shall disclose whether and how the perspectives of its <b>own workforce</b> inform its decisions or activities aimed at managing the actual and potential <b>impacts</b> on its own workforce. This shall include, where relevant, an explanation of:
		<ol class="slds-list--ordered">
        <li> whether engagement occurs directly with the undertaking’s own workers or workers' representatives;</li>
        <li> the stage(s) at which engagement occurs, the type of engagement and frequency of the engagement;</li>
        <li> the function and the most senior role within the undertaking that has operational responsibility for ensuring that this engagement happens and that the results inform the undertaking’s approach;</li>
        <li> where applicable, a Global Framework Agreement or other agreements that the undertaking has with <b>workers' representatives</b> related to the respect of human rights of its <b>own workforce</b>, including an explanation of how the agreement enables the undertaking to gain insight into the perspectives of its own workforce; and</li>
        <li> where applicable, how the undertaking assesses the effectiveness of its engagement with its own workforce, including, where relevant, any agreements or outcomes that result.</li>
		</ol>
		<br>
        28. Where applicable, the undertaking shall disclose the steps it takes to gain insight into the perspectives of people in its <b>own workforce</b> who may be particularly vulnerable to impacts and/or marginalised (for example, women, migrants, people with disabilities).<br><br>
        29. If the undertaking cannot disclose the above required information because it has not adopted ageneral process to engage with its <b>own workforce</b>, it shall disclose this to be the case. It may disclose a timeframe in which it aims to have such a process in place.<br><br>
		</div>
		</details>

		30. <b>The undertaking shall describe the processes it has in place to provide for or cooperatein the remediation of negative impacts on people in its own workforce that the undertaking is connected with, as well as channels available to its own workforce to raise concerns and have them addressed.</b><br><br>
        31. The objective of this Disclosure Requirement is to enable an understanding of the formal means by which the undertaking’s <b>own workforce</b> can make their concerns and needs known directly to the undertaking and/or through which the undertaking supports the availability of such channels (for example, <b>grievance mechanisms</b>) in the workplace, and how follow up is carried out withthe people concerned regarding the issues raised and the effectiveness of these channels.<br><br>
        32. The undertaking shall describe the processes in place to cover the matters defined within paragraph 2 of the Objective section by disclosing the following information:
		<ol class="slds-list--ordered">
        <li> its general approach to and processes for providing or contributing to remedy where it has caused or contributed to a material negative <b>impact</b> on people in its <b>own workforce</b>, including whether and how the undertaking assesses that the <b>remedy</b> provided is effective;</li>
        <li> any specific channels it has in place for its own workforce to raise their concerns or needs directly with the undertaking and have them addressed, including whether these are established by the undertaking itself and/or through participation in third-party mechanisms;</li>
        <li> whether or not the undertaking has a grievance/complaints handling mechanism related to employee matters<span class="tooltip-wrap"><sup>101</sup>

            </div> 
		</span>;and</li>
        <li> the processes through which the undertaking supports the availability of suchchannels in the workplace of its own workforce; and</li>
        <li> how it tracks and monitors issues raised and addressed, and, how it ensures the effectiveness of the channels, including through the involvement of <b>stakeholders</b> who are intended <b>users</b>.</li>
		</ol>
		<br>
        33. The undertaking shall disclose whether and how it assesses that people in its <b>own workforce</b> are aware of, and trust, these structures or processes as a way to raise their concerns or needs and have them addressed. In addition, the undertaking shall disclose whether it has policies in place regarding the protection of individuals that use them, including workers’ representatives, against retaliation. If such information has been disclosed in accordance with ESRS G1-1, the undertaking may refer to that information. <br><br>
        34. If the undertaking cannot disclose the above required information because it has not adopted a channel for raising concerns and/or does not support the availability of such a channel in the workplace for its own workforce, it shall disclose this to be the case. It may disclose a timeframe in which it aims to have such a channel in place.<br><br>

        <div id='divS1-4'>
		35. <b>The undertaking shall disclose how it takes action to address material negative and positive impacts, and to manage material risks and pursue material opportunities related to its own workforce, and the effectiveness of those actions.</b><br><br>
        36. The objective of this Disclosure Requirement is twofold. Firstly, it is to enable an understanding of any <b>actions</b> and initiatives through which the undertaking seeks to:
		<ol class="slds-list--ordered">
        <li> to prevent, mitigate and remediate negative material <b>impacts</b> on its <b>own workforce</b>; and/or</li>
        <li> to achieve positive material impacts for its own workforce. Secondly, it is to enable an understanding of the ways in which the undertaking is addressing the material <b>risks</b> and pursuing the material <b>opportunities</b> related to its own workforce.</li>
		</ol>
		<br>
        37. The undertaking shall provide a summarised description of the action plans and resources to manage its material <b>impacts, risks</b>, and <b>opportunities</b> related to its <b>own workforce</b> in accordance with ESRS 2 MDR-A Actions and resources in relation to material sustainability matters.<br><br>
        38. In relation to the material <b>impacts</b> related to its <b>own workforce</b>, the undertaking shall describe:
		<ol class="slds-list--ordered">
        <li> <b>actions</b> taken, planned or underway to prevent or mitigate material negative impacts on its own workforce;</li>
        <li> whether and how it has taken action to provide or enable <b>remedy</b> in relation to an actual material impact;</li>
        <li> any additional actions or initiatives it has in place with the primary purpose of delivering positive impacts for its own workforce; and</li>
        <li> how it tracks and assesses the effectiveness of these actions and initiatives in delivering outcomes for its own workforce.</li>
		</ol>
		<br>
        39. In relation to paragraph 36, the undertaking shall describe the processes through which it identifies what action is needed and appropriate in response to a particular actual or potential negative <b>impact</b> on its <b>own workforce</b>.<br>
		<br>
        40. In relation to material <b>risks</b> and <b>opportunities</b>, the undertaking shall describe:
		<ol class="slds-list--ordered">
        <li> what action is planned or underway to mitigate material risks for the undertaking arising from its impacts and <b>dependencies</b> on its <b>own workforce</b> and how it tracks effectiveness in practice; and</li>
        <li> what action is planned or underway to pursue material opportunities for the undertaking in relation to its own workforce.</li>
		</ol>
		<br>
        41. The undertaking shall disclose whether and how it ensures that its own practices do not cause or contribute to material negative impacts on <b>own workforce</b>, including, where relevant, its practices in relation to procurement, sales and data use. This may include disclosing what approach is taken when tensions arise between the prevention or mitigation of material negative impacts and other business pressures.<br><br>
        42. When disclosing the information required under paragraph 40, the undertaking shall consider ESRS 2 MDR-T Tracking effectiveness of policies and actions through targets if it evaluates the effectiveness of an action by setting a target.<br><br>
        43. The undertaking shall disclose what resources are allocated to the management of its material impacts, with information that allows <b>users</b> to gain an understanding of how the material impacts are managed.<br><br>
		</div>
		</details>

		44. <b>The undertaking shall disclose the time-bound and outcome-oriented targets it may have set related to:</b>
		<ol class="slds-list--ordered">
        <li> <b>reducing negative impacts on its own workforce; and/or</b></li>
        <li> <b>advancing positive impacts on its own workforce; and/or</b></li>
        <li> <b>managing material risks and opportunities related to its own workforce.</b></li>
		</ol>
		<br>
        45. The objective of this Disclosure Requirement is to enable an understanding of the extent to which the undertaking is using outcome-oriented <b>targets</b> to drive and measure its progress in addressing its material negative <b>impacts</b> and/or advancing positive impacts on its <b>own workforce</b>, and/or in managing material <b>risks</b> and <b>opportunities</b> related to its own workforce.<br><br>
        46. The summarised description of the <b>targets</b> set to manage its material <b>impacts, risks</b> and <b>opportunities</b> related to the undertaking’s <b>own workforce</b> shall contain the information requirements defined in ESRS 2 MDR-T.<br><br>
        47. The undertaking shall disclose the process for setting the <b>targets</b>, including whether and how the undertaking engaged directly with its <b>own workforce</b> or <b>workers’ representatives</b> in:
		<ol class="slds-list--ordered">
        <li> setting any such targets;</li>
        <li> tracking the undertaking’s performance against them; and</li>
        <li> identifying any lessons or improvements as a result of the undertaking’s performance.</li>
		</ol>
		<br>
		</div>

		48. <b>The undertaking shall describe key characteristics of employees in its own workforce.</b><br><br>
        49. The objective of this Disclosure Requirement is to provide insight into the undertaking’s approach to employment, including the scope and nature of <b>impacts</b> arising from its employment practices, to provide contextual information that aids an understanding of the information reported in other disclosures, and to serve as the basis for calculation for quantitative <b>metrics</b> to be disclosed under other disclosure requirements in this Standard.<br><br>
		
        50. In addition to the information required by paragraph 40(a)iii of ESRS 2 General Disclosures, the undertaking shall disclose:

		<ol class="slds-list--ordered">
        <li> the total number of <b>employees</b> by head count, and breakdowns by gender and by country for countries in which the undertaking has 50 or more employees representing at least 10% of its total number of employees;</li>
        <li> the total number by head count or full time equivalent (FTE) of:</li>
		<ol class="slds-is-nested">
          <li> permanent employees, and breakdown by gender;</li>
          <li> temporary employees, and breakdown by gender; and</li>
          <li> non-guaranteed hours employees, and breakdown by gender.</li>
		</ol>
        <li> the total number of employees who have left the undertaking during the reporting period and the rate of employee turnover in the reporting period.</li>
        <li> a description of the methodologies and assumptions used to compile the data, including whether the numbers are reported:</li>
		<ol class="slds-is-nested">
          <li> in head count or full-time equivalent (FTE) (including an explanation of how FTE is defined); and</li>
          <li> at the end of the reporting period, as an average across the reporting period, or using another methodology.</li>
		</ol>
        <li> where applicable, a provision of contextual information necessary to understand the data (for example, to understand fluctuations in number of employees during the reporting period); and</li>
        <li> a cross-reference of the information reported under (a) above to the most representative number in the financial statements.</li>
		</ol>
		<br>

		51. For the information specified in point (b) of paragraph 50, the undertaking may in addition disclose the breakdown by region.<br><br>
        52. The undertaking may disclose by head count or full time equivalent (FTE) the following information:
        <ol class="slds-list--ordered">
        <li>full-time <b>employees</b>, and breakdowns by gender and by region; and</li>
        <li> part-time employees, and breakdowns by gender and by region</li>
		<br>    
        </ol>
		</div>

		53. <b>The undertaking shall describe key characteristics of non-employees in its own workforce.</b><br><br>
        54. The objective of this Disclosure Requirement is to provide insight into the undertaking’s approach to employment, including the scope and nature of <b>impacts</b> arising from its employment practices, to provide contextual information that aids the understanding of the information reported in other disclosures, and to serve as the basis for calculation for quantitative <b>metrics</b> to be disclosed under other disclosure requirements in this Standard. It also allows an understanding of how much the undertaking relies on <b>non-employees</b> as part of its workforce.<br><br>
        55. The disclosure required by paragraph 53 shall include:
		<ol class="slds-list--ordered">
        <li> a disclosure of the total number of <b>non-employees</b> in the undertaking’s <b>own workforce</b>, i.e., either people with contracts with the undertaking to supply labour (“self-employed people”) or people provided by undertakings primarily engaged in “employment activities” (NACE Code N78).</li>
        <li> an explanation of the methodologies and assumptions used to compile the data, including whether the number of non-employees is reported:</li>
        <ol class="slds-is-nested">
         <li> in headcount or full-time equivalent (FTE) (including a definition of how FTE is defined); and</li>
         <li> at the end of the reporting period, as an average across the reporting period, or using another methodology.</li>
        </ol>
        <li> where applicable, a provision of contextual information necessary to understand the data (for example, significant fluctuations in the number of non-employees in the undertaking’s <b>own workforce</b> during the reporting period and between the current and the previous reporting period)</li>
		</ol>
		<br>
		
        56. For the information specified in point (a) of paragraph 55, the undertaking may disclose the most common types of <b>non-employees</b> (for example, self-employed people, people provided by undertakings primarily engaged in employment activities, and other types relevant to the undertaking), their relationship with the undertaking, and the type of work that they perform.<br><br>
        57. Where data is not available, the undertaking shall estimate the numberand state that it has done so. When the undertaking performs estimates, it shall describe the basis of preparation of this estimation.<br><br>
		</div>

        <div id='divS1-8'>
		58. <b>The undertaking shall disclose information on the extent to which the working conditions and terms of employment of its employees are determined or influencedby collective bargaining agreements and on the extent to which its employees are represented in social dialogue in the European Economic Area (EEA) at the establishment and European level.</b><br><br>
        59. The objective of this Disclosure Requirement is to enable an understanding of the coverage of <b>collective bargaining</b> agreements and <b>social dialogue</b> for the undertaking’s own <b>employees.</b><br><br>
        60. The undertaking shall disclose:
		<ol class="slds-list--ordered">
        <li> the percentage of its total <b>employees</b> covered by <b>collective bargaining</b> agreements;</li>
        <li> in the EEA, whether it has one or more collective <b>bargaining agreements</b> and, if so, the overall percentage of its <b>employees</b> covered by such agreement(s) for each country in which it has significant employment, defined as at least 50 employees by head count representing at least 10% of its total number of employees; and</li>
        <li> outside the EEA, the percentage of its own employees covered by collective bargaining agreements by region.</li>
		</ol>
		<br>
        61. For <b>employees</b> not covered by <b>collective bargaining</b> agreements, the undertaking may disclose whether it determines their working conditions and terms of employment based on collective bargaining agreements that cover its other employees or based on collective bargaining agreements from other undertakings.<br><br>
        62. The undertaking may disclose the extent to which the working conditions and terms of employment of <b>non-employees</b> in its <b>own workforce</b> are determined or influenced by <b>collective bargaining</b> agreements, including an estimate of the coverage rate.<br><br>
        63. The undertaking shall disclose the following information in relationto <b>social dialogue</b>:
		<ol class="slds-list--ordered">
        <li> the global <b>percentage</b> of employees covered by workers’ representatives, reported at the country level for each EEA country in which the undertaking has significant employment; and</li>
        <li> the existence of any agreement with its employees for representation by a European Works Council (EWC), a Societas Europaea (SE) Works Council, or a Societas Cooperativa Europaea (SCE) Works Council.</li>
		</ol>
		<br>

		64. <b>The undertaking shall disclose the gender distribution at top management and the age distribution amongst its employees.</b><br><br>
        65. The objective of this Disclosure Requirement is to enable an understanding of gender diversity at top management level and the age distribution of its <b>employees</b>.<br><br>
        66. The undertaking shall disclose:
		<ol class="slds-list--ordered">
        <li> the gender distribution in number and percentage at top management level amongst its employees; and</li>
        <li> the distribution of <b>employees</b> by age group: under 30 years old; 30-50 years old; over 50 years old.</li>

		AR 10. The undertaking shall consider whether explanations of significant changes to the policies adopted during the reporting year (for example, new expectations for foreign subsidiaries, new or additional approaches to due diligence and remedy) provide contextual information for users and may disclose such explanations. This includes policies and commitments of the undertaking to prevent or mitigate the <b>risks</b> and negative <b>impacts</b> on people in its <b>own workforce</b> of reducing carbon <b>emissions</b> and transitioning to greener and climate-neutral operations as well as to provide <b>opportunities</b> for the workforce such as job creation and upskilling, including explicitcommitments to a ‘just transition’.<br><br>		
        AR 11. The <b>policy</b> may take the form of a stand-alone policy regarding the undertaking’s own workforce or be included in a broader document such as a code of ethics or a general sustainability policy that has alreadybeen disclosed by the undertaking as part of another ESRS. In those cases, the undertaking shall provide an accurate cross-reference to identify the aspects of the policy that satisfy the requirements of this Disclosure Requirement.<br><br>
        AR 12. When disclosing the alignment of its policies with the UN Guiding Principles on Business and Human Rights, the undertaking shall consider that the Guiding Principles refer to the International Bill of Human Rights, which consist of the Universal Declaration of Human Rights and the two Covenants that implement it, as well as the International Labour Organisation’s Declaration on Fundamental Rights and Principles at Work and the core conventions that underpin it, and may report on alignment with these instruments.<br><br>
        AR 13. When explaining how external-facing policies are embedded, the undertaking may, for  example, consider internal policies of responsible sourcing, and alignment with other policies relevant to own workers, for example, regarding forced labour. With regard to supplier codes of conduct that the undertaking may have, it shall indicate whether they include provisions addressing the safety of workers, precarious work (i.e., use of workers on short-term or limited hours contracts, workers employed via third parties, sub-contracting to third parties or use of informal workers), human trafficking, the use of forced labour or child labour, and whether such provisions are fully in line with applicable ILO standards.<br><br>
        AR 14. The undertaking may provide an illustration of the types of communication of its policies to those individuals, group of individuals or entities for whom they are relevant, either because they are expected to implement them (for example, the undertaking’s <b>employees</b>, contractors and <b>suppliers</b>), or because they have a direct interest in their implementation (for example, people in its <b>own workforce</b>, investors). It may disclose communication tools and channels (for example, flyers, newsletters, dedicated websites, social media, face to face interactions, workers’ representatives), aimed at ensuring that the <b>policy</b> is accessible and that different audiences understand its implications. The undertaking may also explain how it identifies and removes potential barriers for dissemination, such as through translation into relevant languages or the use of graphic depictions.<br><br>
        AR 15. <b>Discrimination</b> in employment and occupation occurs when someone is treated differently or less favourably because of characteristics that are not related to merit or the inherentrequirements of the job. These characteristics are commonly defined in national laws. Besides the grounds mentioned in the Disclosure Requirement, the undertaking shall consider other grounds for discrimination prohibited under national legislation.<br><br>
        AR 16. <b>Discrimination</b> can arise in a variety of work-related activities. These include access to employment, particular occupations, <b>training</b> and vocational guidance and social security. Moreover, it can occur with respect to the terms and conditions of employment, such as:recruitment, remuneration, hours of work and rest, paid holidays, maternity protection, security of tenure, job assignments, performance assessment and advancement, training opportunities, promotion prospects, occupational safety and health, termination of employment. The undertaking may address these areas specifically when disclosing its policies and underlying procedures to fulfil the disclosure requirement.<br><br>
        AR 17. The undertaking may disclose whether it:
		<ol class="slds-list--ordered">
           <li> has policies and procedures which make qualifications, skills and experience the basis for the recruitment, placement, <b>training</b> and advancement at all levels, while accounting for the fact that some individuals may have more difficulty than others to acquire such qualifications, skills and experience;</li>
           <li> assigns responsibility at top management level for <b>equal treatment</b> and <b>opportunities</b> in employment, issue clear company-wide policies and procedures to guide equal employment practices, and link advancement to desired performance in this area;</li>
           <li> provides staff training on non-<b>discrimination</b> policies and practices, with a particular focus onmiddle and upper management to raise awareness and address resolution strategies for preventing and addressing systemic and incidental discrimination; </li>
           <li> makes adjustments to the physical environment to ensure health and safety for workers, customers and other visitors with disabilities; </li>
           <li> evaluates whether job requirements have been defined in a way that could systematically disadvantage certain groups;</li>
           <li> keeps up-to-date records on recruitment, training and promotion that provide a transparent view of opportunities for <b>employees</b> and their progression within the undertaking;</li>
           <li> puts in place grievance procedures to address complaints, handle appeals and provide recourse for employees (especially in the context of negotiations and collective agreements) when discrimination is identified, and is alert to formal structures and informal cultural issues that can prevent employees from raising concerns and grievances; and</li>
           <li> has programs to promote access to skills <b>development</b>.</li>
		</ol>

		AR 27. In fulfilling the requirements set out by the disclosure criteria of Disclosure Requirement ESRS S1-3, the undertaking may be guided by the content of the UN Guiding Principles on Business and Human Rights and the OECD Due Diligence Guidance for Responsible Business Conduct focused on <b>remediation</b> and <b>grievance mechanisms</b>.<br><br>
        AR 28. Channels for raising concerns or needs include <b>grievance mechanisms</b>, hotlines, trade unions(where people in the workforce are unionised), works councils, dialogue processes or other means through which the undertaking’s <b>own workforce</b> or <b>workers’ representatives</b> can raise concerns about <b>impacts</b> or explain needs that they would like the undertaking to address. This could include both channels provided by the undertaking directly and channels provided by the entities where their own workforce is working, in addition to any other mechanisms an undertaking may use to gain insight into the management of impacts on its own workforce, such as compliance audits. Where the undertaking is relying solely on information about the existenceof such channels provided by its <b>business relationships</b> to answer this requirement, it may state that.<br><br>
        AR 29. Third party mechanisms could include those operated by the government, NGOs, industry associations and other collaborative initiatives. The undertaking may disclose whether these are accessible to all of its <b>own workforce</b> (or <b>workers’ representatives</b> or,in their absence, individuals or organisations acting on their behalf or who are otherwise in a position to be aware of negative <b>impacts</b>).<br><br>
        AR 30. The undertaking shall consider whether and how people in its <b>own workforce</b> that may be affected and their <b>workers' representatives</b> are able to access channels at the level of the undertaking they are employed by, or contracted to work for, in relation to each material <b>impact</b>. Relevant channels may include hotlines, trade unions (where people in the workforce are unionised) or works councils, or other <b>grievance mechanisms</b> operated by the relevant undertaking or by a third party.<br><br>
        AR 31. In explaining whether and how the undertaking knows that people in its own workforce are aware of and trustany of these channels, the undertaking may provide relevant and reliable data about the effectiveness of these channels from the perspective of the people concerned. Examples of sources of information are surveys of people in the undertaking’s workforce that have used such channels and their levelsof satisfaction with the process and outcomes.<br><br>
        AR 32. In describing the effectiveness of channels for its <b>own workforce</b> and <b>workers’ representatives</b> to raise concerns, the undertaking may be guided by the following questions, based on the “effectiveness criteria for non-judicial <b>grievance mechanisms</b>”, as laid out in the UN Guiding Principles on Business and Human Rights, in particular principle 31. The considerations below may be applied to individual channels or to a collective system of channels:
		<ol class="slds-list--ordered">
           <li> do the channels have legitimacy by providing appropriate accountability for their fair conduct and building stakeholder trust?</li>
           <li> are the channels known and accessible to <b>stakeholders</b>?</li>
           <li> do the channels have clear and known procedures, with indicative timeframes?</li>
           <li> do the channels ensure reasonable access for <b>stakeholders</b> to sources of information, advice and expertise?</li>
           <li> do the channels offer transparency by providing sufficient information both to complainants and, where applicable, to meet any public interest?</li>
           <li> do outcomes achieved through the channels accord with internationally recognised human rights?</li>
           <li> does the undertaking identify insights from the channels that support continuous learning in both improving the channels and preventing future impacts?</li>
           <li> does the undertaking focus on dialogue with complainants as the means to reach agreed solutions, rather than seeking to unilaterally determine the outcome?</li>
		 </ol>
		 <br><br>  
		</div>
        </details>
		
		<details>
            <summary> S1-4 </summary>
        <div id='divS1-4AR'>
		AR 33. It may take time to understand negative <b>impacts</b> and how the undertaking may be involved with them through its <b>own workforce</b>, as well as to identify appropriate responses and put them into practice). Therefore, the undertaking may disclose:
		<ol class="slds-list--ordered">
           <li> its general and specific approaches to addressing material negative impacts;</li>
           <li> its initiatives aimed at contributing to additional material positive impacts;</li>
           <li> how far it has progressed in its efforts during the reporting period; and</li>
           <li> its aims for continued improvement.</li>
		</ol>
		<br>
        AR 34. Appropriate action can vary according to whether the undertaking causes or contributes to a material <b>impact</b>, or whether it is involved because the impact is directly linked to its operations, products or services by a business relationship.<br><br>
        AR 35. Given that material negative <b>impacts</b> affecting its <b>own workforce</b> that have occurred during the reporting period may also be connected with other entities or operations outside its direct control, the undertaking may disclose whether and how it seeks to use its leverage in its business relationships to manage those impacts. This may include using commercial <b>leverage</b> (for example, enforcing contractual requirements with <b>business relationships</b> or implementing incentives), other forms of leverage within the relationship (such as providing <b>training</b> or capacity-building on workers’ rights to entities with which the undertaking has a business relationship) or collaborative leverage with peers or other actors (such as initiatives aimed at responsible recruitment or ensuring workers receive an <b>adequate wage</b>).<br><br>
        AR 36. When the undertaking discloses its participation in an industry or multi-stakeholder initiative as part of its <b>actions</b> to address material negative impacts, the undertaking may disclose how the initiative, and its own involvement, is aiming to address the material impact concerned. It may report under ESRS S1-5 the relevant <b>targets</b> set by the initiative and progress towards them.<br><br>
        AR 37. When disclosing whether and how the undertaking considers actual and potential impacts on its <b>own workforce</b> in decisions to terminate <b>business relationships</b> and whether and how it seeks to address any negative impacts that may result from termination, the undertaking may include examples.<br><br>
        AR 38. Processes used to track the effectiveness of <b>actions</b> can include internal or external auditing or verification, court proceedings and/or related court decisions, impact assessments, measurement systems, stakeholder feedback, <b>grievance mechanisms</b>, external performanceratings, and benchmarking.<br><br>
        AR 39. Reporting on effectiveness is aimed at enabling the understanding of the links between actions taken by an undertaking and the effective management of impacts. Additional information that the undertaking may provide includes data showing a decrease in the number of <b>incidents</b> identified.<br><br>
        AR 40. With regard to initiatives or processes whose primary aim is to deliver positive impacts for people in the undertaking’s <b>own workforce</b> that are based on their needs, and with regard to progress in the implementation of such initiatives or processes, the undertaking may disclose:
		<ol class="slds-list--ordered">
           <li> information about whether and how people in its own workforce and <b>workers’ representatives</b> play a role in decisions regarding the design and implementation of these programmes or processes; and</li>
           <li> information about the intended or achieved positive outcomes for the undertaking’s own workforce of these programmes or processes.</li>
		</ol>
		<br>
        AR 41. The undertaking may explain whether any such initiatives are designed also to support the achievement of one or more Sustainable Development Goals. For example, an undertaking committing to SDG 8 to “promote sustained, inclusive and sustainable economic growth, full and productive employment and decent work for all” may be actively working towards eliminating <b>forced labour</b> or compulsory labour or supporting higher levels of productivity on activities in developing countries through technological upgrades and <b>training</b> of local labour, which can benefit both the specific people in its <b>own workforce</b> targeted by the <b>actions</b>, and also their local communities.<br><br>
        AR 42. When disclosing the intended or achieved positive outcomes of its <b>actions</b> for the undertaking’s <b>own workforce</b>, a distinction is to be made between evidence of certain activities having occurred (for example, that x number of people have received financial literacy <b>training</b>) from evidence ofactual outcomes for the people concerned (for example, that x people report that they are able to better manage their pay and their household budgets).<br><br>
        AR 43. If the undertaking has taken measures to mitigate negative <b>impacts</b> on its <b>own workforce</b> that arise from the transition to a greener, climate-neutral economy, such as <b>training</b> and reskilling, employment guarantees, and in the case of downscaling or mass dismissal, measures such as job counselling, coaching, intra-company placements and early retirement plans, the undertaking shall disclose those measures. This includes measures to comply with prevailing regulation. The undertaking may highlight present and/or expected external developments that influence whether <b>dependencies</b> turn into <b>risks</b>. This includes consideration of impacts that may arise from the transition to greener and climate-neutral operations.<br><br>
        AR 44. When disclosing the material <b>risks</b> and <b>opportunities</b> related to its <b>impacts</b> or <b>dependencies</b> on its <b>own workforce</b>, the undertaking may consider the following:
		<ol class="slds-list--ordered">
           <li> risks related to the undertaking’s impacts on its own workforce may include the reputational or legal exposure where people in the undertaking’s workforce are found to be subject to <b>forced labour</b> or <b>child labour</b>;</li>
           <li> risks related to the undertaking’s dependencies on its own workforce may include disruption of business operations where significant employee turnover or lack of skills/<b>training development</b> threaten the undertaking’s business; and</li>
           <li> opportunities related to the undertaking’s impacts on its own workforce may include market differentiation and greater customer appeal from guaranteeing decent <b>pay</b> and conditions for non-employees.</li>
		</ol>
		<br>
        AR 45. When explaining whether <b>dependencies</b> turn into <b>risks</b>, the undertaking shall consider external developments.<br><br>
        AR 46. When disclosing <b>policies</b>, <b>actions</b> and resources and <b>targets</b> related to the management of material <b>risks</b> and <b>opportunities</b>, in cases where risks and opportunities arise from a material <b>impact</b>, the undertaking may cross-reference its disclosures on policies, actions and resourcesand targets in relation to that impact.<br><br>
        AR 47. The undertaking shall consider whether and how its process(es) to manage material <b>risks</b> related to <b>own workforce</b> are integrated into its existing risk management process(es).<br><br>
        AR 48. When disclosing the resources allocated to the management of material impacts, the undertaking may explain which internal functions are involved in managing the impacts and what types of action they take to address negative and advance positive impacts.<br><br>
		</div>
        </details>

		AR 49. When disclosing information about <b>targets</b> in accordance with paragraph &nbsp;<a class="tooltip-wrap">46
            <div class="tooltip-content">
             The summarised description of the <b>targets</b> set to manage its material <b>impacts, risks</b> and <b>opportunities</b> related to the undertaking’s <b>own workforce</b> shall contain the information requirements defined in ESRS 2 MDR-T.
            </div> 
        </a>, the undertaking may disclose:
		 <ol class="slds-list--ordered">
            <li> the intended outcomes to be achieved in the lives of a certain number of people in its <b>own workforce</b>;</li>
            <li> the stability of the <b>targets</b> over time in terms of definitions and methodologies to enable comparability over time; and/or</li>
            <li> the standards or commitments which the targets are based on (for instance codes of conduct, sourcing policies, global frameworks, or industry codes).</li>
                </ol>
		<br>
        AR 50. <b>Targets</b> related to <b>risks</b> and <b>opportunities</b> may be the same as or distinct from targets related to <b>impacts</b>. For example, a target to reach <b>adequate wages</b> for <b>non-employees</b> could both reduce impacts on those people and reduce associated risks in terms of the quality and reliability of their output.<br><br>
        AR 51. The undertaking may also distinguish between short-, medium- and long-term <b>targets</b> covering the same <b>policy</b> commitment. For example, the undertaking may have a long-term target to achieve an 80% reduction in health and safety <b>incidents</b> affecting its delivery drivers by 2030 and a near-term target to reduce the <b>overtime</b> hours of delivery drivers by x% while maintaining their income by 2024.<br><br>
        AR 52. When modifying or replacing a <b>target</b> in the reporting period, the undertaking may explain the change by cross-referencing it to significant changes in the <b>business model</b> or to broader changes in the accepted standard or legislation from which the target is derived to provide contextual information as per ESRS 2 BP-2 Disclosures in relation to specific circumstances.<br><br>
		</div>

        AR 56. The definitions of permanent, temporary, non-guaranteed hours, full-time, and part-time <b>employees</b> differ between countries. If the undertaking has employees in more than one country, it shall use the definitions as per the national laws of the countries where the employees are based to calculate country-level data. The country-level data shall then be added up to calculate total numbers, disregarding differences in national legal definitions. Non-guaranteed hours employees are employed by the undertaking without a guarantee of a minimum or fixed number of working hours. The employee may need to make themselves available for work as required, but the undertaking is not contractually obliged to offer the employee a minimum or fixed number of working hours per day, week, or month. Casual employees, employees with zero-hour contracts, and on-call employees are examples that fall under this category.<br><br>
        AR 57. Disclosing the number of <b>employees</b> at the end of the reporting period provides information for that point in time, without capturing fluctuations during the reporting period. Disclosing these numbers in averages across the reporting period takes into account fluctuations during the reporting period.<br><br>
        AR 58. Quantitative data, such as the number of temporary or part-time <b>employees</b>, is unlikely to be sufficient on its own. For example, a high proportion of temporary or part-time employees could indicate a lack of employment security for employees, but it could equally signal workplace flexibility when offered as a voluntary choice. For this reason, the undertaking is required to disclose contextual information to help information users interpret the data. The undertaking can explain the reasons for temporary employment. An example of such a reason is the recruitment of employees to undertake work on a temporary or seasonal project or event. Another example is the standard practice of offering a temporary contract (for example, six months) to new employees before an offer of permanent employment is made. The undertaking may also explain the reasons for non-guaranteed hours employment.<br><br>
        AR 59. For the own employee turnover calculation, the undertaking shall calculate the aggregate of the number of <b>employees</b> who leave voluntarily or due to dismissal, retirement, or death in service. The undertaking shall use this number for the numerator of the employee turnover rate and may determine the denominator used to calculate this rate and describe its methodology.<br><br>
        AR 60. Where data is not available for detailed information, the undertaking shall use an estimation of the employee number or ratios, in accordance with ESRS 1, and clearly identify where the use of estimates has taken place.<br><br>

        <div id='divS1-7AR'>
		AR 61. This Disclosure Requirement provides insight into the undertaking’s approach to employment, as well as the scope and nature of impacts arising from its employment practices. It also provides contextual information that aids an understanding of the information reported in otherdisclosures. This disclosure covers both individual contractors supplying labour to the undertaking (“self-employed people”) and workers provided by undertakings primarily engaged in “employment activities” (NACE Code N78). If all the people performing work for the undertaking are <b>employees</b> and the undertaking does not have any people in its workforce who are not employees, this Disclosure Requirement is not material for the undertaking; notwithstanding,the undertaking may state this fact when disclosing the information required by Disclosure Requirement S1-6 as contextual information as this information can be relevant for the <b>users</b> of the <b>Sustainability Statement</b>.<br><br>
        AR 62. Examples of contractors (self-employed people) in the undertaking’s <b>own workforce</b> include: contractors hired by the undertaking to perform work that would otherwise be carried out by an employee; contractors hired by the undertaking to perform work in a public area (for example, on a road, on the street); and contractors hired by the undertaking to deliver the work/service directly at the workplace of a client of the organization. Examples of people employed by a third party engaged in ‘employment activities’ whose work is under the direction of the undertaking include: people who perform the same work that <b>employees</b> carry out, such as people whofill in for employees who are temporarily absent (due to illness, holiday, parental leave, etc.); people performing regular work at the same <b>site</b> as employees; and workers who are dispatched temporarily from another EU member state to work for the undertaking (‘posted workers’). Examples of <b>value chain workers</b> (and thus of workers not in the undertaking’s own workforce and reported under the scope of ESRS S2) include: workers for a <b>supplier</b> contracted by the undertaking who work on the supplier’s premises using the supplier’s work methods; workersfor a ‘downstream’ entity which purchases goods or services from the undertaking; and workers of an equipment supplier to the undertaking who, at one or more of the undertaking’s workplaces, perform regular maintenance on the supplier’s equipment (for example, photocopier) as stipulated in the contract between the equipment supplier and the undertaking.<br><br>
        AR 63. If the undertaking cannot report exact figures, it shall use estimates according to the provisions in ESRS 1 to disclose the number of people in its <b>own workforce</b> who are not employees to the nearest ten or, where the number of people in its own workforce who are not <b>employees</b> is greater than 1,000, to the nearest 100, and explain this. In addition, it shall clearly identify the information that derives from actual data and estimates.<br><br>
        AR 64. Disclosing the number of people in the undertaking’s <b>own workforce</b> who are not <b>employees</b> at the end of the reporting period provides information for that point in time without capturing fluctuations during the reporting period. Disclosing this number as an average across the reporting period considers fluctuations during the reporting period and can provide more insightful and relevantinformation for <b>users</b>.<br><br>
        AR 65. The information disclosed by the undertaking allows <b>users</b> to understand how the number of <b>non-employees</b> in the undertaking’s <b>own workforce</b> varies during the reporting period or compared to the previous reporting period (i.e., whether the numbers have increased or decreased). The undertaking may also disclose the reasons for the fluctuations. For example, an increase in the number of non-employees during the reporting period could be due to a seasonal event. Conversely, a decrease in the number of non-employees compared to the previous reporting period could be due to the completion of a temporary project. If the undertaking discloses fluctuations, it shall also explain the criteria used to determine which fluctuations it discloses. If there are no significant fluctuations in the number of non-employees during the reporting period or between the currentand previous reporting period, the undertaking may disclose this information.<br><br>
		</div>
        </details>
		
		<details>
            <summary> S1-8 </summary>
        <div id='divS1-8AR'>Collective bargaining coverage<br>
        AR 66. The percentage of <b>employees</b> covered by <b>collective bargaining</b> agreements is calculated using the following formula:<br><br>
               𝑁𝑢𝑚𝑏𝑒𝑟 𝑜𝑓 𝑒𝑚𝑝𝑙𝑜𝑦𝑒𝑒𝑠 𝑐𝑜𝑣𝑒𝑟𝑒𝑑 𝑏𝑦 𝑐𝑜𝑙𝑙𝑒𝑐𝑡𝑖𝑣𝑒 𝑏𝑎𝑟𝑔𝑎𝑖𝑛𝑖𝑛𝑔 𝑎𝑔𝑟𝑒𝑒𝑚𝑒𝑛𝑡𝑠 / 𝑁𝑢𝑚𝑏𝑒𝑟 𝑜𝑓 𝑒𝑚𝑝𝑙𝑜𝑦𝑒𝑒𝑠 𝑥 100<br><br>
        AR 67. The <b>employees</b> in the undertaking’s <b>own workforce</b> covered by <b>collective bargaining</b> agreements are those individuals to whom the undertaking is obliged to apply the agreement.This means that if none of the employees arecovered by a collective bargaining agreement, the percentage reported is zero. An employee in the undertaking’s own workforce covered by more than one collective bargaining agreement only needs to be counted once.<br><br>
        AR 68. This requirement is not aimed at obtaining the percentage of <b>employees</b> represented by a works council or belonging to trade unions, which can be different. The percentage of employees covered by collective bargaining agreements can be higher than the percentage of unionised employees when the <b>collective bargaining</b> agreements apply to both union and non-union members. Alternatively, the percentage of employees covered by collective bargaining agreements can be lower than the percentage of unionised employees. This may be the case when there are no collective bargaining agreements available or when the collective bargaining agreements do not cover all unionised employees.<br><br>
        Social Dialogue<br><br>
        AR 69. For calculating the information required by paragraph 63(a), the undertaking shall identify in which European Economic Area (EEA) countries it has significant employment (i.e., at least 50 employees representing at least 10% of its total employees). For these countries it shall report the percentage of <b>employees</b> in that countrywhich are employed in establishments in which employees are represented by <b>workers’ representatives</b>. Establishment is defined as any place of operations where the undertaking carries out a non-transitory economic activity with human means and goods. Examples include: a factory, a branch of a retail chain, or an undertaking’s headquarters. For countries in which there is only one establishment the percentage reportedshall be either 100% or 0%.<br><br>

		AR 71. In preparing the disclosure on gender at top management, the undertaking shall use the definition of top management as one and two levels below the administrative and supervisory bodies unless this concept has already been defined with the undertaking’s operations and differs from the previous description. If this is the case, the undertaking can use its own definition for top management and disclose that fact and its own definition.<br><br>

            <summary> S1-10 </summary>
        <div id='divS1-10AR'>
		AR 72. The lowest <b>wage</b> shall be calculated for the lowest <b>pay</b> category, excluding interns and apprentices. This is to be based on the basic wage plus any fixed additional payments that are guaranteed to all <b>employees</b>. The lowest wage shall be considered separately for each country in which the undertaking has operations, except outside the EEA when the relevant adequate or minimum wage is defined at a sub national level.<br><br>
        AR 73. The <b>adequate wage</b> benchmark used for comparison with the lowest wage shall not be lower than:
		<ol class="slds-list--ordered">
           <li> in the EEA: the minimum wage set in accordance with Directive (EU) 2022/2041 of the European Parliament and of the Council<span class="tooltip-wrap"><sup>110</sup>&nbsp;
            <div class="tooltip-content">
			Directive (EU) 2022/2041 of the European Parliament and of the Council of 19 October 2022 on adequate minimum wages in the European Union (OJ L 275, 25.10.2022, p. 33).
            </div> 
		</span> on adequate minimum wages in the European Union. In the period until Directive (EU) 2022/2041 enters into application, where there is no applicable minimum <b>wage</b> determined by legislation or collective bargaining in an EEA country, the undertaking shall use an <b>adequate wage</b> benchmark that is either not lower than the minimum wage in a neighboring country with a similar socio-economic status or not lower than a commonly-referenced international norm such as 60% of the country's median wage and 50% of the gross average wage.
        </li>
           <li> outside of the EEA:</li>
             <ol class="slds-is-nested">
              <li> the wage level established in any existing international, national or sub-national legislation, official norms or collective agreements, based on an assessment of a wage level needed for a decent standard of living;</li>
              <li>if none of the instruments identified in (i) exist, any national or sub-national minimum wage established by legislation or <b>collective bargaining</b>; or </li>
              <li>if none of the instruments identified in (i) or (ii) exist, any benchmark that meets the criteria set out by the Sustainable Trade Initiative (IDH) (‘Roadmap on Living Wages - A Platform to Secure Living Wages in Supply Chains’), including applicable benchmarks aligned with the Anker methodology, or provided by the Wage Indicator Foundation or Fair Wage Network, provided the primacy of collective bargaining for the establishment of terms and conditions of employment is ensured.</li>
		     </ol>
		</ol>
		<br>
        AR 74. Directive (EU) 2022/2041 on adequate minimum <b>wages</b> in the European Union references both indicative reference values commonly used at international level such as 60 % of the gross median wage and 50 % of the gross average wage, and/or indicative reference values used at national level. Data for the indicative values of 60% of the national median gross wage or 50% of the national average gross wage can be obtained from the European Labour Force Survey.<br><br>

		AR 77. A regular performance review is defined as a review based on criteria known to the employee and his or her superior undertaken with the knowledge of the employee at least once per year. The review can include an evaluation by the worker’s direct superior, peers, or a wider range of <b>employees</b>. The review can also involve the human resources department. In order to disclose the information required by paragraph&nbsp;<a class="tooltip-wrap">83(a)

        </a>, the undertaking shall use the employee headcount figures provided in Disclosure Requirement ESRS S1-6 in the denominator to calculate the:
		<ol class="slds-list--ordered">
           <li> number/proportion of performance reviews per employee; and</li>
           <li> number of reviews in proportion to the agreed number of reviews by the management.</li>
		</ol>
		<br>

            </div> 
        </a>, the undertaking shall perform the following calculation: total number of <b>training</b> hours offered to and completed by <b>employees</b> per gender category divided by the total number of employees per gender category. For the total training average and the average by gender, the head count figures for total employment and employment by gender reported in Disclosure Requirement ESRS S1-6 shall be used.<br><br>
        AR 79. Employee categories are a breakdown of <b>employees</b> by level (such as senior management, middle management) or function (such as technical, administrative, production). This information is derived from the undertaking’s own human resources system. In categorising the workforce, the undertaking shall define reasonable and meaningful employee categories which enable <b>users</b> of the information to understand different performance measures between the categories. The undertaking may present a category for executive and non-executive employees.<br><br>

            the percentage of people in its <b>own workforce</b> who are covered by the undertaking’s health and safetymanagement system based on legal requirements and/or recognised standards or guidelines;

        AR 81. With regard to paragraph&nbsp;<a class="tooltip-wrap">90
            <div class="tooltip-content">
                In addition, the undertaking may include the following additional information on the health and safety coverage: the percentage of its own workers covered by a health and safety management system which is based on legal requirements and/or recognised standards or guidelines and which has been internally audited and/or audited or certified by an external party.
            </div> 
        </a>, when the undertaking’s health and safety management system, or certain parts there of, has been subject to an internal audit or external certification, the undertaking may state this fact, or absence thereof, and the underlying standards for such audits/certifications, as applicable.<br><br>
        AR 82. Fatalities may be reported separately for those resulting from <b>work-related injuries</b> and those resulting from <b>work-related ill health</b>.<br><br>
        Guidance on “work-related”<br><br>
        AR 83. <b>Work-related injuries</b> and <b>work-related ill health</b> arise from exposure to hazards at work. Notwithstanding, other types of <b>incidents</b> can occur that are not connected with the work itself.For example, the following incidents are generally not considered to be work-related, unless otherwise specified in applicable national legislation:
		<ol class="slds-list--ordered">
           <li> a person in the workforce suffers a heart attack while at work that it is not connected with work;</li>
           <li> a person in the workforce driving to or from work is injured in a car accident (when driving is not partof the work and where the transport has not been organised by the undertaking); and</li>
           <li> a person in the workforce with epilepsy has a seizure at work that is not connected with work.</li>
		</ol>
		<br>
        AR 84. With regard to travelling for work purposes, injuries and ill health that occur while a person is travelling are work-related if, at the time of the injury or ill health, the person was engaged in work activities “in the interest of the employer”. Examples of such activities include travelling to and from customer contacts; conducting job tasks; and entertaining or being entertained to transact, discuss, or promote business (at the direction of the employer). If the undertaking isresponsible for the transport commuting, <b>incidents</b> occurred while commuting are considered to be work-related. Nonetheless, incidents which arise during travel, outside of the undertaking’s responsibility (i.e., regular commuting to and from  work), may be reported separately provided that the undertaking has such data available across the undertaking.<br><br>
        AR 85. With regard to working from home, injuries and ill health that occur when working from home are work-related, if the injury or ill health occurs while the person is performing work from home; and the injury or ill health is directly related to the performance of work rather than thegeneral home environment or setting.<br><br>
        AR 86. With regard to mental illness, it is considered to be work-related, if it has been notified voluntarily by the person concerned and it is supported by an opinion from a licensed healthcare professional with appropriate <b>training</b> and experience; and if such opinion states that the illness is work-related.<br><br>
        AR 87. Health issues resulting, for example, from smoking, drug and alcohol abuse, physical inactivity, unhealthy diets, and psychosocial factors unrelated to work are not considered work-related.<br><br>
        AR 88. Occupational diseases are not considered <b>work-related injuries</b> but are covered under <b>work-related ill health</b>.<br><br>
        Guidance on computing the rate of work-related injuries<br><br>
        AR 89. In computing the rate of work-related injuries, the undertaking shall divide the respective number of cases by the number of total hours worked by people in its <b>own workforce</b> and multiplied by 1,000,000. Thereby, these rates represent the number of respective cases per one million hours worked. A rate based on 1,000,000 hours worked indicates the number of work-related injuries per 500 full time people in the workforce over a 1-year timeframe. For comparability purposes a rate based on 1,000,000 hours worked shall be used also for undertakings with less than 500 people in the workforce.<br><br>
        AR 90. If the undertaking cannot directly calculate the number of hours worked, it may estimate this on the basis of normal or standard hours of work, taking into account entitlements to periods of paid leave of absence from work (for example, paid vacations, paid sick leave, public holidays) and explain this in its disclosures.<br><br>
        AR 91. An undertaking shall include fatalities as a result of work-related injury in the calculation of the number and rate of recordable work-related injuries.<br><br>
        Guidance on recordable work-related ill health<br><br>
        AR 92. Work-related ill health can include acute, recurring, and chronic health problems caused or aggravated by work conditions or practices. These include musculoskeletal disorders, skin and respiratory diseases, malignant cancers, diseases caused by physical agents (for example, noise-induced hearing loss, vibration-caused diseases), and mental illnesses (for example, anxiety, post-traumatic stress disorder). For the purpose of the required disclosures, the undertaking shall, at a minimum, include in its disclosure those cases outlined in the ILO List of Occupational Diseases.<br><br>
        AR 93. In the context of this Standard, work-related musculoskeletal disorders are covered under work-related ill health (and not injuries).<br><br>
        AR 94. The cases to be disclosed in paragraph&nbsp;<a class="tooltip-wrap">88 (d)&nbsp;
            <div class="tooltip-content">
            with regard to the undertaking’s employees, the number of cases of <b>recordable work-related ill health</b>, subject to legal restrictions on the collection of data; and
            </div> 
        </a>relate to cases of work-related ill health notified to the undertaking or identified by the undertaking through medical surveillance, during the reporting period. The undertaking might be notified of cases of work-related ill health through reports by affected people, compensation agencies, or healthcare professionals. The disclosure may include cases of work-related ill health that were detected during the reportingperiod among people who were formerly in the undertaking’s workforce.<br><br>
        Guidance on the number of days lost<br><br>
        AR 95. The undertaking shall count the number of days lost such that the first full day and last day of absence shall be included. Calendar days should be considered for the calculation, thus days on which the affected individual is not scheduled for work (for example, weekends, public holidays) will count as lost days.<br><br>
		</div>

		AR 96. Family-related leave include maternity leave, paternity leave, parental leave, and carers’ leave that is available under national law or collective agreements. For the purpose of this Standard, these concepts are defined as:
		<ol class="slds-list--ordered">
           <li> maternity leave (also called pregnancy leave): employment-protected leave of absence for employed women directly around the time of childbirth (or, in some countries, adoption);</li>
           <li> paternity leave: leave from work for fathers or, where and in so far as recognised by national law, for equivalent second parents, on the occasion of the birth or adoption of a child for the purposes of providing care;</li>
           <li> parental leave: leave from work for parents on the grounds of the birth or adoption of a child to take care of that child, as defined by each Member State;</li>
           <li> carers’ leave from work: leave for workers to provide personal care or support to a relative, or a person who lives in the same household, in need of significant care or support for a serious medical reason, as defined by each Member State.</li>
		</ol>

        Total remuneration Ratio<br><br>
		
        AR 101. When compiling the information required by paragraph&nbsp;<a class="tooltip-wrap">97 (b)
            <div class="tooltip-content">
            the <b>annual total remuneration</b> ratio of the highest paid individual to the median annual total remuneration for all <b>employees</b> (excluding the highest-paid individual); and

		<ol class="slds-list--ordered">

           <li> consider, depending on the undertaking’s remuneration policies, all of the following:</li>
		   <ol class="slds-is-nested">

        <li> the number of severe human rights incidents connected to the undertaking’s workforce in the reporting period, including an indication of how many of these are cases of non-respect of the UN Guiding Principles on Business and Human Rights, ILO Declaration on Fundamental Principles and Rights at Work or OECD Guidelines for Multinational Enterprises. If no such incidents have occurred, the undertaking shall state this<sup>107</sup>; and </li>

            </div> 
        </a>,the undertaking may disclose the status of <b>incidents</b> and/or complaints and actions taken with reference to the following:
		<ol class="slds-list--ordered">
           <li> incidents reviewed by the undertaking;</li>
           <li> remediation plans being implemented;</li>
           <li> remediation plans that have been implemented, with results reviewed through routine internal management review processes; and</li>

        AR 104. If the undertaking compiles the information described in AR 105, it shall consider the following:
		<ol class="slds-list--ordered">
           <li> an <b>incident</b> is no longer subject to action if it is resolved, the case is completed, or no further action is required by the undertaking. For example, an incident for which no further action is required can include cases that are withdrawn or where the underlying circumstances that led to the incident no longer exist;</li>
           <li> remedial action is directed toward the alleged harasser and the alleged victim. Remedial action toward the victim may include offering to pay his/her expenses for counselling sessions, offering the victim some paid time off, offering to reinstate sick/vacation days if the victim has incurred any expenses due to the <b>harassment</b> (such as having used sick or vacation days); and</li>
           <li> remedial action toward the harasser may include giving the harasser a verbal and/or written warning, mandating anti-harassment counselling or sending the harasser to an appropriate seminar, harassment awareness and prevention <b>training</b>. A suspension without <b>pay</b> may also be an option. If the harasser has been disciplined earlier but his/her harassment does not cease, then more serious discipline may be required.</li>

        AR 105. Severe human rights <b>incidents</b> include instances of lawsuits, formal complaints through the undertaking or third-party complaint mechanisms, serious allegations in public reports or the media, where these are connected to the undertaking’s <b>own workforce</b>, and the fact of the incidents is not disputed by the undertaking, as well as any other severe impacts of which the undertaking is aware.<br><br>
        AR 106. In addition to the information required by paragraph&nbsp;<a class="tooltip-wrap-wide">104&nbsp;
