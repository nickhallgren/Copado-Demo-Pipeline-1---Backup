    <details>
        <summary>Objective</summary>
             <div>
                1. The objective of this Standard is to specify disclosure requirements which will enable <b>users</b> of the <b>sustainability statement</b> to understand material impacts on <b>affected communities</b> connected with the undertaking’s own operations and value chain, including through its products or services, as well as through its <b>business relationships</b>, and its related material risks and opportunities, including:
            <ol class="slds-list--ordered">
             <li> how the undertaking affects communities, in areas where impacts are most likely to be present and severe, in terms of material positive and negative actual or potential impacts;</li>
             <li> any <b>actions</b> taken, and the result of such actions, to prevent, mitigate or remediate actual or potential negative impacts, and to address risks and opportunities;</li>
             <li> the nature, type and extent of the undertaking’s material risks and opportunities related to its impacts and <b>dependencies</b> on <b>affected communities</b>, and how the undertaking manages them; and</li>
             <li> the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of material risks and opportunities arising from the undertaking’s impacts and dependencies on affected communities.</li>
              </ol><br>
            2. In order to meet the objective, this Standard requires an explanation of the general approach the undertaking takes to identify and manage any material actual and potential impacts on <b>affected communities</b> in relation to:
             <ol class="slds-list--ordered">
                <li> communities’ economic, social and cultural rights (for example, adequate housing, adequatefood, water and sanitation, land-related and security-related impacts);</li>
                <li> communities’ civil and political rights (for example, freedom of expression, freedom of assembly, impacts on human rights defenders); and</li>
                <li> particular rights of <b>indigenous peoples</b> (for example, free, prior and informed consent, self-determination, cultural rights).</li>
                </ol>
               <br> 
            3. This Standard also requires an explanation of how such impacts, as well as the undertaking’s <b>dependencies</b> on affected communities, can create material risks or opportunities for the undertaking.For example, negative relationships with <b>affected communities</b> may disrupt the undertaking’s own operations or harm its reputation, while constructive relationships can bring business benefits, such as stable and conflict-free operations and a greater ease of recruiting locally.<br><br>
        </div>
     </details>

        14. The disclosure required by paragraph 12 shall contain the information on the undertaking’s policies to manage its material impacts, risks and opportunities related to <b>affected communities</b> in accordance with ESRS 2 MDR-P Policies adopted to manage material sustainability matters. In addition, the undertaking shall specify if such policies cover specific affected communities or all affected communities.<br><br>
        15. The undertaking shall disclose any particular <b>policy</b> provisions for preventing and addressing impacts on <b>indigenous peoples</b>.<br><br>

		19. <b>The undertaking shall disclose its general processes for engaging with affected communities and their representatives about actual and potential impacts on them</b>.<br><br>
        20. The objective of this Disclosure Requirement is to enable an understanding of whether and how the undertaking engages, as part of its ongoing due diligence process, with affected communities, their legitimate representatives, or with <b>credible proxies</b>, about material actual and potential positive and/or negative impacts that do or are likely to affect them, and whether and how perspectives of <b>affected communities</b> are taken into account in the decision-making processes of theundertaking.<br><br>
        21. The undertaking shall disclose whether and how the perspectives of <b>affected communities</b> inform its decisions or activities aimed at managing actual and potential impacts on communities. This shall include, where relevant, an explanation of:
        <ol class="slds-list--ordered">
            <li> whether engagement occurs with affected communities or their <b>legitimate representatives</b> directly, or with <b>credible proxies</b> that have insight into their situation;</li>
            <li> the stage(s) at which engagement occurs, the type of engagement, and the frequency of the engagement;</li>
            <li> the function and the most senior role within the undertaking that has operational responsibility for ensuring this engagement happens, and that the results inform the undertaking’s approach;</li>
            <li> where applicable, how the undertaking assesses the effectiveness of its engagement with affected communities, including, where relevant, any agreements or outcomes that result.</li>
         </ol><br>

		25. <b>The undertaking shall describe the processes it has in place to provide for or cooperate in the remediation of negative impacts on affected communities that the undertaking is connected with, as well as channels available to affected communities to raise concerns and have them addressed</b>.<br><br>
        26. The objective of this Disclosure Requirement is to enable an understanding of the formal means by which <b>affected communities</b> can make their concerns and needs known directly to the undertaking, and/or through which the undertaking supports the availability of such channels (for example,<b>grievance mechanisms</b>) by its business relationships, how follow up is performed with these communities regarding the issues raised, and the effectiveness of these channels.<br><br>
        27. The undertaking shall describe:
        <ol class="slds-list--ordered">
            <li> its general approach to and processes for providing or contributing to <b>remedy</b> where it has identified that it has caused or contributed to a material negative <b>impact</b> on affected communities, including whether and how the undertaking assesses that the remedy provided is effective;</li>
            <li> any specific channels it has in place for <b>affected communities</b> to raise their concerns or needs directly with the undertaking and have them addressed, including whether these are established by the undertaking itself and/or through participation in third-party mechanisms;</li>
            <li> its processes through which the undertaking supports the availability of such channels by its business relationships; and</li>
            <li> how it tracks and monitors issues raised and addressed, and how it ensures the effectiveness of the channels, including through involvement of <b>stakeholders</b> who are the intended <b>users</b> of those channels.</li></ol><br>

        29. If the undertaking cannot disclose the above required information because it has not adopted a channel for raising concerns and/or does not support the availability of such a channel by its business relationships, it shall disclose this to be the case. It may disclose a time frame in which it aims to have such a channel or processes in place.<br><br>

		AR 9. The description shall include the key information necessary to ensure a faithful representation of the policies in relation to <b>affected communities</b> and, therefore, the undertaking shall consider explanations of significant changes to the policies adopted during the reporting year (for example, new or additional approaches to engagement, due diligence and remedy).<br><br>
        AR 10. When disclosing the alignment of its policies with the UN Guiding Principles on Business and Human Rights, the undertaking shall consider that the Guiding Principles refer to the International Bill of Rights, which consists of the Universal Declaration of Human Rights and the two Covenants that implement it, as well as the UN Declaration on the Rights of Indigenous Peoples, the International Labour Organisation’s Convention concerning Indigenous and Tribal Peoples (ILO No. 169) and the core conventions that underpin it, and may disclose its alignment with these instruments.<br><br>
        AR 11. The undertaking may provide an illustration of the types of communication of its policies to those individuals, group of individuals or entities for whom they are relevant, either because they are expected to implement them (for example, the undertaking’s <b>employees</b>, contractors and <b>suppliers</b>), or because they have a direct interest in their implementation (for example, own workers, investors). It may disclose communication tools and channels (for example, flyers, newsletters, dedicated websites, social media, face to face interactions, workers’ representatives), aimed at ensuring that the <b>policy</b> is accessible and that different audiences understand its implications. The undertaking may also explain how it identifies and removes potential barriers for dissemination, such as through translation into relevant languages or the use of graphic depictions.<br><br>
        AR 12. When disclosing severe human rights issues and <b>incidents</b> connected to affected communities, the undertaking shall consider any legal disputes related to land rights and to the <b>free, prior and informed consent</b> of <b>indigenous peoples</b>.<br><br>

		AR 13. Explanations of how the undertaking takes into account and ensures respect of the right of indigenous peoples to <b>free, prior and informed consent</b> may include information about processes to consult with indigenous peoples to obtain such consent. The undertaking shall consider how the consultation includes a good faith negotiation with affected <b>indigenous peoples</b> to obtain their free, prior and informed consent where the undertaking affects the lands, territories or resources that indigenous peoples customarily own, occupy or otherwise use; or relocates them from land or territories subject to traditional ownership or under customary use or occupation; or affects or exploits their cultural, intellectual, religious and spiritual property.<br><br>
        AR 14. When describing which function or role has operational responsibility for such engagement and/or ultimate accountability, the undertaking may disclose whether this is a dedicated role or function or part of a broader role or function, and whether any capacity building activities have been offered to support the staff to undertake engagement. If it cannot identify such a position orfunction, it may state that this is the case. This disclosure could also be fulfilled by making reference to information disclosed according to ESRS 2 GOV-1 The role of the administrative, management and supervisory bodies.<br><br>
        AR 15. When preparing the disclosures described in paragraph 20 b) and c) the following illustrations may be considered:

            </ol><br>
        AR 16. To illustrate how the perspectives of communities have informed specific decisions or activities of the undertaking, the undertaking may provide examples from the current reporting period.<br><br>

		AR 17. In fulfilling the requirements set out by Disclosure Requirement ESRS S3-3, the undertaking may be guided by the content of the UN Guiding Principles on Business and Human Rights and the OECD Guidelines for Multinational Enterprises focused on <b>remediation</b> and <b>grievance mechanisms</b>.<br><br>
        AR 18. Channels for raising concerns or needs, include <b>grievance mechanisms</b>, hotlines, dialogue processes or other means through which <b>affected communities</b> or their <b>legitimate representatives</b> can raise concerns about impacts or explain needs that they would like the undertaking to address.This could include channels provided by the undertaking directly, in addition to any other mechanisms the undertaking may use to gain insight into the management of impacts on communities, such as compliance audits. Where the undertaking is relying solely on information about the existence of such channels provided by its <b>business relationships</b> to answer this requirement, it may state that.<br><br>
        AR 19. To provide greater insight into the information covered in ESRS S3-3, the undertaking may explain whether and how communities that may be affected are able to access channels at the level of the undertaking they are affected by, in relation to each material impact. Relevant insights include information on whether <b>affected communities</b> can access channels in a language they understand, and whether they have been consulted in the design of such channels.<br><br>
        AR 20. Third party mechanisms could include those operated by the government, NGOs, industry associations and other collaborative initiatives. The undertaking may disclose whether these are accessible to all <b>affected communities</b> who may be potentially or actually materially impacted by the undertaking, or individuals or organisations acting on their behalf or who are otherwise in a position to be aware of negative impacts.<br><br>
        AR 21. In relation to the protection of individuals that use the mechanisms against retaliation, the undertaking may describe whether it treats grievances confidentially and with respect to the rights of privacy and data protection; and whether to the mechanisms can be used anonymously (forexample, through representation by a third party).<br><br>
        AR 22. When disclosing processes related to providing and enabling <b>remedy</b> for <b>indigenous peoples</b>, relevant information includes whether and how the undertaking has considered their customs, traditions, rules and legal systems.<br><br>
        AR 23. In disclosing whether and how the undertaking knows that <b>affected communities</b> are aware of and trust any of these channels, the undertaking may provide relevant and reliable data about the effectiveness of these channels from the perspective of affected communities themselves. Examples of sources of information are surveys of community members that have used such channels and their levels of satisfaction with the process and outcomes.<br><br>
        AR 24. In describing the effectiveness of channels for <b>affected communities</b> to raise concerns, the undertaking may be guided by the following questions, based on the “effectiveness criteria for non- judicial <b>grievance mechanisms</b>”, as laid out in the UN Guiding Principles on Business and Human Rights, in particular Principle 31. The below considerations may be applied on an individual channel basis or for the collectivesystem of channels:
        <ol class="slds-list--ordered">
            <li>do the channels hold legitimacy by providing appropriate accountability for their fair conduct and building stakeholder trust?</li>
            <li>are the channels known and accessible to stakeholders?</li>
            <li>do the channels have clear and known procedures, set timeframes and clarity on the processes?</li>
            <li>do the channels ensure reasonable access to sources of information, advice and expertise?</li>
            <li>do the channels offer transparency by providing sufficient information both to complainants and, where applicable, to meet any public interest at stake?</li>
            <li>do the outcomes achieved through the channels accord with internationally recognised human rights?</li>
            <li>does the undertaking identify insights from the channels that support continuous learningin both improving the channels and preventing future impacts?</li>
            <li>does the undertaking focus on dialogue with complainants as the means to reach agreed solutions, rather than seeking to unilaterally determine the outcome?</li>
        For more information, see Principle 31 of the UN Guiding Principles on Business and Human Rights.</li></ol><br>

        <div id='divS3-4AR'>
		AR 25.  It may take time to understand negative impacts and how the undertaking may be involved with them through its value chain, as well as to identify appropriate responses and put them into practice. Therefore, the undertaking shall consider:<br>
        <ol class="slds-list--ordered">
            <li>its general and specific approaches to addressing material negative impacts;</li>
            <li>its social investment or other <b>development</b> programmes aimed at contributing to additional material positive impacts;</li>
            <li>how far it has progressed in its efforts during the reporting period; and</li>
            <li>its aims for continued improvement</li></ol><br>
        AR 26. Appropriate action can vary according to whether the undertaking causes or contributes to a material impact, or whether the material impact is directly linked to its own operations, products or services through a business relationship.<br><br>
        AR 27. Given that material negative impacts affecting communities that have occurred during the reporting period may also be linked to entities or operations outside its direct control, the undertaking may disclose whether and how it seeks to use its leverage in its business <b>relationships</b> to manage those impacts. This may include using commercial <b>leverage</b> (for example, enforcing contractual requirements with business relationships or implementing incentives), other forms of leverage within the relationship (such as providing <b>training</b> or capacity-building on the rights of indigenous peoples to entities with which the undertaking has a business relationships) or collaborative leverage with peers or other actors (such as initiatives aimed at minimising security-related impacts on communities or participating in company-community partnerships).<br><br>
        AR 28. Impacts on communities may stem from environmental matters which are disclosed by the undertaking under the ESRS E1 to E5. Examples include:
        <ol class="slds-list--ordered">
            <li>ESRS E1 Climate Change: The implementation of <b>climate change mitigation</b> plans may require the undertaking to invest in <b>renewable energy</b> projects that may affect the lands, territories and <b>natural resources</b> of <b>indigenous peoples</b>. If the undertaking does not consult with the affected indigenous peoples , it could negatively impact the affected communities’ right to <b>free, prior and informed consent</b>;</li>
            <li>ESRS E2 Pollution: The undertaking may negatively impact <b>affected communities</b> by failing to protect them from <b>pollution</b> from a particular production facility that causes them health-related issues;</li>
            <li>ESRS E3 Water and marine sources: The undertaking may negatively impact the access to clean drinking water of communities when withdrawing water in water stressed areas;</li>
            <li>ESRS E4 Biodiversity and ecosystems: The undertaking may negatively affect the livelihood of local farmers through operations that contaminate <b>soil</b>. Additional examples include the sealing of land through building new infrastructure, which can eradicate plant species that are critical for, for example, local <b>biodiversity</b> or to filter water for communities; or the introduction of <b>invasive species</b> (whether plants or animals)that can impact <b>ecosystems</b> and cause subsequent harm;</li>
            <li>ESRS E5 Resource use and circular economy: The undertaking may negatively impact the lives of communities by affecting their health through the mismanagement of <b>hazardous waste</b>. Where the connection between environmental impacts and local communities is addressed in the disclosures within the Disclosure Requirements ESRS E1-E5, the undertaking may cross-referenceto those and clearly identify such disclosures.</li>
            </ol><br>
        AR 29. When the undertaking discloses its participation in an industry or multi-stakeholder initiative as part of its <b>actions</b> to address material negative impacts, the undertaking may disclose how the initiative, and its own involvement, is aiming to address the material impact concerned. It may disclose under ESRS S3-5 the relevant <b>targets</b> set by the initiative and progress towards them.<br><br>
        AR 30. When disclosing whether and how the undertaking considers actual and potential impacts on <b>affected communities</b> in decisions to terminate <b>business relationships</b> and whether and how it seeks to address any negative impacts that may result from termination, the undertaking may include examples.<br><br>
        AR 31. In disclosing how it tracks the effectiveness of <b>actions</b> to manage material impacts during the reporting period, the undertaking may disclose any lessons learned from the previous and current reporting periods.<br><br>
        AR 32. Processes used to track the effectiveness of <b>actions</b> can include internal or external auditing or verification, court proceedings and/or related court decisions, impact assessments, measurement systems, stakeholder feedback, <b>grievance mechanisms</b>, external performance ratings, and benchmarking.<br><br>
        AR 33. Reporting on effectiveness is aimed at enabling the understanding of the links between <b>actions</b> taken by an undertaking and the effective management of impacts.<br><br>
        AR 34. With regard to initiatives or processes whose primary aim is to deliver positive impacts for affected communities that are based on affected communities’ needs, and with regard to progress in the implementation of such initiatives or processes, the undertaking may disclose:
        <ol class="slds-list--ordered">
            <li>information about whether and how <b>affected communities</b> and <b>legitimate representatives</b> or their <b>credible proxies</b> play a role in decisions regarding the design and implementation of these investments or programmes; and</li>
            <li>information about the intended or achieved positive outcomes for <b>affected communities</b> ofthese investments or programmes.</li>
            <li>an explanation of the approximate scope of <b>affected communities</b> covered by the described social investment or <b>development</b> programmes, and, where applicable, the rationale for why selected communities were chosen for a given social investment or development programme's implementation.</li></ol><br>
        AR 35. The undertaking may disclose whether any initiatives or processes whose primary aim is to deliver positive impacts for <b>affected communities</b> are designed also to support the achievement of one or more of the UN Sustainable Development Goals (SDGs). For example, through a commitment to advance UN SDG 5 to “achieve gender equality and empower all women and girls” the undertakingmay be taking thoughtful measures to include women in the consultation process with an affected community to meet standards of effective <b>stakeholder engagement</b>, which can help empower the women in the process itself, but potentially also in their daily lives.<br><br>
        AR 36. When disclosing the intended or achieved positive outcomes of its <b>actions</b> for <b>affected communities</b> a distinction is to be made between evidence of certain activities having occurred (for example, that x number of women community members have been provided with <b>training</b> on how to become local <b>suppliers</b> to the undertaking) from evidence of actual outcomes for affected communities (for example, that x women community members have set up small businesses and have had their contracts with the undertaking renewed year-on-year).<br><br>
        AR 37. When disclosing whether initiatives or processes also play a role in mitigating material negative impacts, the undertaking may for example consider programmes that aim to improve local infrastructure surrounding an undertaking’s operations, such as improvements in roads leading to a reduction in the number of severe traffic accidents involving community members..<br><br>
        AR 38. When disclosing the material risks and opportunities related to the undertaking’s impacts or <b>dependencies</b> on affected communities, the undertaking may consider the following:
        <ol class="slds-list--ordered">
            <li>risks related to the undertaking’s impacts on <b>affected communities</b> may include the reputational or legal exposure, as well as operational risks, where affected communities protest against resettlements or the loss of access to lands, leading to costly delays, boycotts, or lawsuits;</li>
            <li>risks related to the undertaking’s dependencies on <b>affected communities</b> may include disruption of business operations where <b>indigenous peoples</b> decide to withdraw their consent to a project on their lands, forcing the undertaking to significantly modify or abandon the project;</li>
            <li>business opportunities related to the undertaking’s impacts on <b>affected communities</b> may include more easily financing projects and being a partner of choice for communities, governments and other businesses; and</li>
            <li>opportunities related to the undertaking’s dependencies on <b>affected communities</b> may include the development of positive relationships between the undertaking and indigenous peoples that enable existing projects to expand with strong support.</li></ol><br>
        AR 39. In disclosing the information in AR 41, the undertaking may consider explanations of risks and opportunities stemming from environmental impacts or <b>dependencies</b> (please refer to AR 31 for further details), including related human rights (or social) impacts. Examples include reputational risks stemming from the impact on the health of communities of unmanaged polluting <b>discharges</b>; or the <b>financial effects</b> of protests that may disrupt or interrupt an undertaking’s activities, for example,in response to operations in water stressed areas that may impact the lives of affected communities.<br><br>
        AR 40. When disclosing whether <b>dependencies</b> turn into risks, the undertaking shall consider external developments.<br><br>
        AR 41. When disclosing policies, action and resources and <b>targets</b> related to the management of material risks and opportunities, in cases where risks and opportunities arise from a material impact, the undertaking may cross-reference its disclosures on policies, actions and resources and targets in relation to that impact.<br><br>
        AR 42. The undertaking shall consider whether and how its processes to manage material risks related to <b>affected communities</b> are integrated into its existing risk management processes.<br><br>
        AR 43. When disclosing the resources allocated to the management of material impacts, the undertaking may disclose which internal functions are involved in managing the impacts and what types of action they take to address negative and advance positive impacts.<br><br>

		AR 44. When disclosing information about <b>targets</b> in accordance with paragraph <a class="tooltip-wrap">38
            <div class="tooltip-content">
             The undertaking shall disclose:
                The undertaking shall disclose what resources are allocated to the management of its material impacts, with information that enables <b>users</b> to gain an understanding of how the material impacts are managed.

        </a>, the undertaking may disclose:
        <ol class="slds-list--ordered">
            <li>the intended outcomes to be achieved in the lives of affected communities, being as specific as possible;</li>
            <li>the stability of the <b>targets</b> over time in terms of definitions and methodologies to enable comparability over time;</li>
            <li>the standards or commitments which the targets are based on (for instance codes of conduct, sourcing policies, global frameworks or industry codes).</li>
            <li>references to standards or commitments which the targets are based on are to be clearly defined in the reporting (for instance code of conducts, sourcing policies, global frameworks or industry codes).</li></ol><br>
        AR 45. <b>Targets</b> related to material <b>risks</b> and <b>opportunities</b> may be the same as or distinct from targets related to material impacts. For example, a target to fully restore livelihoods of <b>affected communities</b> following resettlement could both reduce impacts on those communities and reduce associated risks such as community protests.<br><br>
        AR 46. The undertaking may also distinguish between short-, medium- and long-term <b>targets</b> covering the same <b>policy</b> commitment. For example, the undertaking may have as a main objective to employ community members at a local mining <b>site</b>, with the long-term goal of staffing 100% locally by 2025,and with the short-term objective of adding x percent of local <b>employees</b> every year up and until 2025.<br><br>
        AR 47. When modifying or replacing a target in the reporting period, the undertaking may explain the change by linking it to significant changes in the business model or to broader changes in the accepted standard or legislation from which the target is derived to provide contextual information as per ESRS 2 BP-2 Disclosures in relation to specific circumstances.<br><br>
