        <summary>Objective</summary>
             <div>
                1. The objective of this Standard is to specify disclosure requirements which will <b>enable</b> users of the <b>sustainability statement</b> to understand material <b>impacts</b> on <b>consumers</b> and <b>end-users</b> connected with the undertaking’s own operations and <b>value chain</b>, including through its products or services, as well as through its <b>business relationships</b>, and its related material <b>risks</b> and <b>opportunities</b>, including:
             <ol class="slds-list--ordered">
             <li>how the undertaking affects the consumers and/or end-users of its products and/or services (referred to in this Standard as “consumers and end-users”), in terms of material positiveand negative actual or potential impacts;</li>
             <li>any <b>actions</b> taken, and the result of such actions, to prevent, mitigate or remediate actual or potential negative impacts, and to address risks and opportunities;</li>
             <li>the nature, type and extent of the undertaking’s material risks and opportunities related to its impacts and <b>dependencies</b> on consumers and end-users, and how the undertaking manages such risks and opportunities; and</li>
             <li>the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of material risks and opportunities arising from the undertaking’s impacts and dependencies on consumers and/or end-users.</li>
              </ol><br>
            2. In order to meet the objective, this Standard requires an explanation of the general approach the undertaking takes to identify and manage any material actual and potential <b>impacts</b> on the <b>consumers</b> and/or <b>end-users</b> related to its products and/or services in relation to:
             <ol class="slds-list--ordered">
                <li>information-related impacts on consumers and/or end-users (for example, privacy, freedom of expression and access to (quality) information;</li>
                <li>personal safety of consumers and/or end-users (for example, health and safety, security of aperson and protection of children);</li>
                <li>social inclusion of consumers and/or end-users (for example, non-<b>discrimination</b>, access to products and services and responsible marketing practices).</li>
                </ol>
               <br> 
            3. This Standard also requires an explanation of how such impacts, as well as the undertaking’s <b>dependencies</b> on <b>consumers</b> and/or <b>end-users</b>, can create material <b>risks</b> or <b>opportunities</b> for the undertaking. For example, negative impacts on the reputation of the undertaking’s products and/or services can be detrimental to its business performance, while trust in products and/or services can bring business benefits, such as increased sales or widening of the future consumer base.<br><br>
            4. The unlawful use or misuse of the undertaking’s products and services by <b>consumers</b> and <b>end-users</b> fall outside the scope of this standard. <br><br>
        </div>

		18. <b>The undertaking shall disclose its general processes for engaging with consumers and end-users and their representatives about actual and potential impacts on them</b>.<br><br>

		AR 9. The description shall include the key information necessary to ensure a faithful representation of the policies in relation to <b>consumers</b> and <b>end-users</b>, and therefore, the undertaking shall consider explanations of significant changes to the policies adopted during the reporting year (for example, new expectations for business customers, new or additional approaches to due diligence and remedy).<br><br>

        AR 11. In disclosing its alignment of its policies with the UN Guiding Principles on Business and Human Rights, the undertaking shall consider that the Guiding Principles refer to the International Bill of Human Rights, which consists of the Universal Declaration of Human Rights and the two Covenantsthat implement it, and may disclose its alignment with these instruments.<br><br>

		AR 18. In fulfilling the requirements set out by the disclosure criteria of ESRS S4-3, the undertaking may beguided by the content of the UN Guiding Principles on Business and Human Rights and the OECD Guidelines for Multinational Enterprises focused on <b>remediation</b> and <b>grievance mechanisms</b>.<br><br>
        AR 19. Channels for raising concerns or needs, include <b>grievance mechanisms</b>, hotlines, dialogue processes or other means through which <b>consumers</b> and/or <b>end-users</b> or their <b>legitimate representatives</b> can raise concerns about impacts or explain needs that they would like the undertaking to address. This could include channels provided by the undertaking directly and is to be disclosed in addition to any other mechanisms the undertaking may use to gaininsight into the management of impacts on consumers and/or end-users, such as compliance audits. Where the undertaking is relying solely on information about the existence of such channels provided by its <b>business relationships</b> to answer this requirement, it may state that.<br><br>

        AR 21. Third party mechanisms could include those operated by the government, NGOs, industry associations and other collaborative initiatives. With regard to the scope of these mechanisms, the undertaking may disclose whether these are accessible to all <b>consumers</b> and/or <b>end-users</b> who may be potentially or actually materially impacted by the undertaking, or individuals or organisations acting on their behalf or who are otherwise in a position to be aware of negative impacts, and throughwhich consumers and/or end-users (or individuals or organisations acting on their behalf or who areotherwise in a position to be aware of negative impacts), can raise complaints or concerns related to the undertaking’s own activities.<br><br>
        AR 22. In relation to the protection of individuals that use the mechanisms against the retaliation, the undertaking may describe whether it treats grievances confidentially and with respect to the rights of privacy and data protection; and whether they allow for <b>consumer</b> and/or <b>end-users</b> to use them anonymously (for example, through representation by a third party).<br><br>
        AR 23. In disclosing whether and how the undertaking knows that <b>consumers</b> and/or <b>end-users</b> are aware of and trust any of these channels, the undertaking may provide relevant and reliable data about theeffectiveness of these channels from the perspective of consumers and/or end-users themselves. Examples of sources of information are surveys of consumers and/or end-users that have used suchchannels and their levels of satisfaction with the process and outcomes. To illustrate the usage level of such channels, the undertaking may disclose the number of complaints received from consumersand/or end-users during the reporting period.<br><br>
        AR 24. In describing the effectiveness of channels for <b>consumers</b> and/or <b>end-users</b> to raise concerns, the undertaking may be guided by the following questions, based on the “effectiveness criteria for nonjudicial <b>grievance mechanisms</b>”, as laid out in the UN Guiding Principles on Business and Human Rights. The below considerations may be applied on an individual channel basis or for the collectivesystem of channels:
        <ol class="slds-list--ordered">
            <li>do the channels hold legitimacy by providing appropriate accountability for their fair conduct and building stakeholder trust?</li>
            <li>are the channels known and accessible to <b>stakeholders</b>?</li>
            <li>do the channels have known procedures, set timeframes and clarity on the processes?</li>
            <li>do the channels ensure reasonable access to sources of information, advice and expertise?</li>
            <li>do the channels offer transparency by providing sufficient information both to complainantsand where applicable, to meet any public interest at stake?</li>
            <li>do the outcomes achieved from the channels accord with internationally recognised human rights?</li>
            <li>does the undertaking identify insights from the channels that support continuous learningin both improving the channels and preventing future impacts?</li>

        <div id='divS4-4AR'>
		AR 25. It may take time to understand negative impacts and how the undertaking may be involved with themthrough its downstream value chain, as well as to identify appropriate responses and put them into practice). Therefore, the undertaking shall consider:
        <ol class="slds-list--ordered">
            <li>Its general and specific approaches to addressing material negative impacts;</li>
            <li>its initiatives aimed at contributing to additional material positive impacts;</li>
            <li>how far it has progressed in its efforts during the reporting period; and</li>
            <li>its aims for continued improvement.</li></ol><br>
        AR 26. Appropriate action can vary according to whether the undertaking causes or contributes to a material impact, or whether the material impact is directly linked to its own operations, products or services through a business relationship.<br><br>
        AR 27. Given that material negative impacts affecting <b>consumers</b> and/or <b>end-users</b> that have occurred during the reporting period may also belinked to entities or operations outside its direct control, the undertaking may disclose whether and how it seeks to use leverage with relevant <b>business relationships</b> to manage those impacts. This may include using commercial <b>leverage</b> (for example, enforcing contractual requirements with business relationships or implementing incentives), other forms of leverage within the relationship (such as providing <b>training</b> or capacity-building on proper product use or sale practices to business relationships) or collaborative leverage with peers or other actors (such as initiatives aimed at responsible marketing or product safety).<br><br>
        AR 28. When the undertaking discloses its participation in an industry or multi-stakeholder initiative as part of its <b>actions</b> to address material negative impacts, the undertaking may disclose how the initiative, and its own involvement, is aiming to address the material impact concerned. It may disclose under ESRS S4-5 the relevant <b>targets</b> set by the initiative and progress towards them.<br><br>
        AR 29. When disclosing whether and how it considers actual and potential impacts on <b>consumers</b> and/or <b>end-users</b> in decisions to terminate <b>business relationships</b> and whether and how it seeks to addressany negative impacts that may result from termination, the undertaking may include examples.<br><br>
        AR 30. In disclosing how it tracks the effectiveness of <b>actions</b> to manage material impacts during the reporting period, the undertaking may disclose any lessons learned from the previous and current reporting periods.<br><br>
        AR 31. Processes used to track the effectiveness of <b>actions</b> can include internal or external auditing or verification, court proceedings and/or related court decisions, impact assessments, measurement systems, stakeholder feedback, <b>grievance mechanisms</b>, external performance ratings, and benchmarking.<br><br>
        AR 32. Reporting on effectiveness is aimed at enabling the understanding of the links between <b>actions</b> takenby the undertaking and the effective management of impacts.<br><br>
        AR 33. With regard to initiatives or processes the undertaking has in place that are based on affected <b>consumers</b> and/or <b>end-users’</b> needs and their level of implementation, the undertaking may disclose:
        <ol class="slds-list--ordered">
            <li>information about whether and how consumers and/or end-users and <b>legitimate representatives</b> or their <b>credible proxies</b> play a role in decisions regarding the design andimplementation of these programmes or processes; and</li>
            <li>information about the intended or achieved positive outcomes for consumers and/or end-users of these programmes or processes.</li></ol><br>
        AR 34. The undertaking may disclose whether any initiatives or processes whose primary aim is to deliver positive impacts for <b>consumers</b> and/or <b>end-users</b> are designed to also support the achievement of one or more of the UN Sustainable Development Goals (SDGs). For example, through a commitment to advance UN SDG 3 to “ensure healthy lives and promote well-being for all at all ages” the undertaking may be actively working to make its products less addictive and harmful to physical andpsychological health.<br><br>
        AR 35. When disclosing the intended positive outcomes of its <b>actions</b> for <b>consumers</b> and/or <b>end-users</b> a distinction is to be made between evidence of certain activities having occurred (for example, that xnumber of consumers have received information about healthy eating habits) from evidence of actual outcomes for consumers and/or end-users (for example, that x number of consumers have adopted healthier eating habits).<br><br>
        AR 36. When disclosing whether initiatives or processes also play a role in mitigating material negative impacts, the undertaking may, for example, consider programmes that aim to support heightened awareness of the risk of online scams, leading to a reduction in the number of cases of <b>end-users</b> experiencing breaches of data privacy.<br><br>
        AR 37. When disclosing the material risks and opportunities related to the undertaking’s impacts or <b>dependencies</b> on <b>consumers</b> and/or <b>end-users</b>, the undertaking may consider the following:
        <ol class="slds-list--ordered">
            <li>risks related to the undertaking’s impacts on consumers and/or end-users may include reputational or legal exposure where poorly designed or defective products result in injuries or deaths;</li>
            <li>risks related to the undertaking’s dependencies on consumers and/or end-users may include the loss of business continuity where an economic crisis makes consumers unable to afford certain products or services;</li>
            <li>business opportunities related to the undertaking’s impacts on consumers and/or end- users may include market differentiation and greater customer appeal from offering safe products or privacy-respecting services; and</li>
            <li>business opportunities related to the undertaking’s dependencies on consumers and/or end-users may include the achievement of a loyal future consumer base by ensuring, forexample, that LGBTQI people are respected and that the undertaking’s selling practices do not exclude such people from the products or services it offers.</li></ol><br>
        AR 38. When disclosing whether <b>dependencies</b> turn into risks, the undertaking shall consider external developments.<br><br>
        AR 39. When disclosing policies, action and resources and <b>targets</b> related to the management of material risks and opportunities, in cases where risks and opportunities arise from a material impact, the undertaking may cross-reference its disclosures on policies, action and resources and <b>targets</b> in relation to that impact.<br><br>
        AR 40. The undertaking shall consider the extent to which its processes to manage material risks related to <b>consumers</b> and/or <b>end-users</b> are integrated into its existing risk management processes and how.<br><br>
        AR 41. When disclosing the resources allocated to the management of material impacts, the undertaking may disclose which internal functions are involved in managing the impacts and what types of actionthey take to address negative and advance positive impacts<br><br>

        <div id='divS4-5AR'>
		AR 42. When disclosing <b>targets</b> in relation to <b>consumers</b> and/or <b>end-users</b>, the undertaking shall consider disclosing, where applicable:
        <ol class="slds-list--ordered">
            <li>the intended outcomes to be achieved in the lives of consumers and/or end-users, being as specific as possible;</li>
            <li>their stability over time in terms of definitions and methodologies to enable comparability; and/or</li>
            <li>references standards or commitments on which the <b>targets</b> are based are to be clearly defined in the reporting (for instance codes of conduct, sourcing policies, global frameworks or industry codes).</li></ol><br>
        AR 43. <b>Targets</b> related to material <b>risks</b> and <b>opportunities</b> may be the same as or distinct from targets tied to material <b>impacts</b>. For example, a target to ensure equal access to finance for underserved <b>consumers</b> could both reduce <b>discrimination</b> impacts on those consumers and enlarge the undertaking’s pool of customers.<br><br>
        AR 44. The undertaking may also distinguish between short, medium and long-term <b>targets</b> covering the same <b>policy</b> commitment. For example, the undertaking may have as a main objective to make its online services accessible to people with disabilities, with the long-term goal of having adapted 100% of its online services by 2025, and with the short-term objective of adding x number of accessible features every year up and until 2025.<br><br>
        AR 45. When modifying or replacing a target in the reporting period, the undertaking may explain the changeby cross-referencing it to significant changes in the business model or to broader changes in theaccepted standard or legislation from which the target is derived to provide contextual information as per ESRS 2 BP-2 Disclosures in relation to specific circumstances.<br><br>
