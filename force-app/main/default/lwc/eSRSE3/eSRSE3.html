    <details>
        <summary>Objective</summary>
        <div>
            1. The objective of this Standard is to specify Disclosure Requirements which will enable users of the <b>sustainability statement</b> to understand:
			<ol class="slds-list--ordered">
				<li>how the undertaking affects water and <b>marine resources</b>, in terms of material positive and negative actual or potential <b>impacts</b>;</li>
				<li>any <b>actions</b> taken, and the result of such actions to prevent or mitigate material actual or potential negative impacts and to protect water and marine resources, also with reference to reduction of <b>water consumption</b> and to address <b>risks</b> and <b>opportunities</b>;</li>
				<li>whether, how and to what extent the undertaking is contributing to the European Green Deal’s ambitions for fresh air, clean water, a healthy <b>soil</b> and <b>biodiversity</b> as well as to ensuring the sustainability of the <b>blue economy</b> and fisheries sectors, taking account of the following: Directive 2000/60/EC of the European Parliament and of the Council<a class="tooltip-wrap"><sup>68</sup>;
             <div class="tooltip-content">
			Directive 2000/60/EC of the European Parliament and of the Council of 23 October 2000 establishing a framework for Community action in the field of water policy (Water Framework Directive) (OJ L 327, 22.12.2000, p. 1).
            </div>
			</a> (EU Water Framework Directive), Directive 2008/56/EC of the European Parliament and of the Council<a class="tooltip-wrap"><sup>69</sup>;
             <div class="tooltip-content">
			 Directive 2008/56/EC of the European Parliament and of the Council of 17 June 2008 establishing a framework for community action in the field of marine environmental policy (Marine Strategy Framework Directive) (OJ L 164, 25.6.2008, p. 19).
            </div>
			</a> (EU Marine Strategy Framework Directive), Directive 2014/89/EU of the European Parliament and of the Council<a class="tooltip-wrap"><sup>70</sup>;
             <div class="tooltip-content">
			Directive 2014/89/EU of the European Parliament and of the Council of 23 July 2014 establishing a framework for maritime spatial planning (OJ L 257, 28.8.2014, p. 135). 
            </div>
			</a> (EU Maritime Spatial Planning Directive), the Sustainable Development Goals (in particular SDG 6 Clean water and sanitation and 14 Life below water), and respect of global environmental limits (e.g. <b>biosphere integrity</b>, ocean acidification, <b>freshwater</b> use, and biogeochemical flows <b>planetary boundaries</b>);</li>
	            <li>the plans and capacity of the undertaking to adapt its strategy and <b>business model</b> in line with the promotion of sustainable water use based on long-term protection of available water resources; protection of aquatic <b>ecosystems</b> and restoration of <b>freshwater</b> and marine <b>habitats</b>;</li>
				<li>the nature, type and extent of the undertaking’s material <b>risks</b> and <b>opportunities</b> arising from the undertaking’s <b>impacts</b> and <b>dependencies</b> on water and <b>marine resources</b>, and how the undertaking manages them; and</li>
				<li>the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of material risks and opportunities arising from undertaking’s impacts and <b>dependencies</b> on water and marine resources.</li>
			</ol>
			<br>
				
			2. This Standard sets outs Disclosure Requirements related to water and <b>marine resources</b>. With regard to "water", this standard covers <b>surface water</b> and <b>groundwater</b>. It includes disclosure requirements on <b>water consumption</b> in the undertaking’s activities, products and services, as well as related information on <b>water withdrawals</b> and <b>water discharges</b>.<br><br>
			
			3. With regard to “<b>marine resources</b>” this standard covers the extraction and use of such resources, and associated economic activities.<br><br>
        </div>
    </details>
    
    <details>
        <summary>Disclosure Requirements</summary>
    <div>
        <details>
            <summary> E3-1 </summary>
        <div id='divE3-1'>
        9. <b>The undertaking shall disclose its policies adopted to manage its material impacts, risks and opportunities related to water and marine resources.</b><span class="tooltip-wrap"><sup>72</sup>
            <div class="tooltip-left">
			  This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts as set out by indicator #7 in Table II of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosure rules on sustainable investments (“Investments in companies without water management policies”).
            </div> 
        </span>.<br><br>
        10. The objective of this Disclosure Requirement is to enable an understanding of the extent to which the undertaking has <b>policies</b> that address the identification, assessment, management and/or <b>remediation</b> of its material water and <b>marine resources</b>-related <b>impacts, risks</b> and <b>opportunities</b>.<br><br>
        11. The disclosure required by paragraph 9 shall contain the information on the <b>policies</b> the undertaking has in place to manage its material <b>impacts, risks</b> and <b>opportunities</b> related to water and <b>marine resources</b> in accordance with ESRS 2 MDR-P Policies adopted to manage material sustainability matters.<br><br>
        12. The undertaking shall indicate whether and how its <b>policies</b> address the following matters where material:
		<ol class="slds-list--ordered">
        <li>water management including:</li>
        <ol class="slds-is-nested">
            <li>the use and sourcing of water and <b>marine resources</b> in its own operations;</li>
            <li>water treatment as a step towards more sustainable sourcing of water; and</li>
            <li>the prevention and abatement of water <b>pollution</b> resulting from its activities.</li>
        </ol>
        <li>product and service design in view of addressing water-related issues and the preservation of marine resources; and</li>
        <li>commitment to reduce material <b>water consumption</b> in <b>areas at water risk</b> in its own operations and along the upstream and downstream <b>value chain</b>.</li>
		</ol>
		<br>
        13. If at least one of the <b>sites</b> of the undertaking is located in an area of high-water stress and it is not covered by a <b>policy</b>, the undertaking shall state this to be the case and provide reasons for not having adopted such a policy. The undertaking may disclose a timeframe in which it aims to adopt such a policy.<span class="tooltip-wrap"><sup>73</sup> &nbsp;
            <div class="tooltip-left">
            This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts as set out by indicator #8 in Table II of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosure rules on sustainable investments ( “Investments in companies without sustainable oceans/seas practices”).            </div> 
        </span><br><br>
        14. The undertaking shall specify whether it has adopted policies or practices related to sustainable oceans and seas<span class="tooltip-wrap"><sup>74</sup>
            <div class="tooltip-content-top">
            This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts as set out by indicator #12 in Table II of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosure rules on sustainable investments ( “Investments in companies without sustainable oceans/seas practices”).            </div> 
        </span>.<br><br>
		</div>
		</details>

        <details>
            <summary> E3-2 </summary>
        <div id='divE3-2'>
		
        15. <b>The undertaking shall disclose its water and marine resources-related actions and the resources allocated to their implementation.</b>.<br><br>
        16. The objective of this Disclosure Requirement is to enable an understanding of the key <b>actions</b> taken and planned to achieve the water and <b>marine resources</b>-related <b>policy</b> objectives and <b>targets</b>.<br><br>
        17. The description of the <b>actions</b> and resources shall follow the principles defined in ESRS 2 MDR-A Actions and resources in relation to material sustainability matters. In addition to ESRS 2 MDR-A, the undertaking may specify to which layer in the mitigation hierarchy an action and<br><br>
        18. Resources can be allocated to:
		<ol class="slds-list--ordered">
        <li>avoid the use of water and <b>marine resources</b>;</li>
        <li>reduce the use of water and marine resources such as through efficiency measures;</li>
        <li>reclaiming and reuse of water; or</li>
        <li>restoration and <b>regeneration</b> of aquatic ecosystem and water bodies.</li>
		</ol>
		<br>
        19. The undertaking shall specify <b>actions</b> and resources in relation to <b>areas at water risk</b>, including <b>areas of high-water stress</b>.<br><br>
        </div>
        </details>

		<details>
            <summary> E3-3 </summary>
        <div id='divE3-3'>
		
		20. <b>The undertaking shall disclose the water and marine resources-related targets it has set</b>.<br><br>
        21. The objective of this Disclosure Requirement is to enable an understanding of the targets the undertaking has adopted to support its water and marine resources-related policies and address its material water and marine resources-related impacts, risks and opportunities.<br><br>
        22. The description of the targets shall contain the information requirements defined in ESRS 2 MDR-T Tracking effectiveness of policies and actions through targets.<br><br>
        23. The disclosure required by paragraph 20 shall indicate whether and how its <b>targets</b> relate to:
		<ol class="slds-list--ordered">
        <li>the management of material <b>impacts, risks</b> and <b>opportunities</b> related to <b>areas at water risk</b>, including improvement of the water quality;</li>
        <li>the responsible management of <b>marine resources</b> impacts, risks and opportunities including the nature and quantity of marine resources-related commodities (such as gravels, deep-sea minerals, seafood) used by the undertaking; and</li>
        <li>the reduction of <b>water consumption</b>, including an explanation of how those targets relate to areas at water risk, including areas of high water-stress.</li>
		</ol>
		<br>
		
        24. In addition to ESRS 2 MDR-T, the undertaking shall specify whether <b>ecological thresholds</b> and entity-specific allocations were taken into consideration when setting <b>targets</b>. If so, the undertaking shall specify:
		<ol class="slds-list--ordered">
        <li>the ecological thresholds identified, and the methodology used to identify such thresholds;</li>
        <li>whether or not the thresholds are entity-specific and if so, how they were determined; and</li>
        <li>how responsibility for respecting identified ecological thresholds is allocated in the undertaking.</li>
		</ol>
		<br>
        25. The undertaking shall specify as part of the contextual information, whether the <b>targets</b> it has set and presented are mandatory (based on legislation) or voluntary.<br><br>
        </div>
        </details>

		<details>
            <summary> E3-4 </summary>
        <div id='divE3-4'>
		26. <b>The undertaking shall disclose information on its water consumption performance related to its material impacts, risks and opportunities</b>.<br><br>
        27. The objective of this Disclosure Requirement is to provide an understanding of the undertaking’s water consumption and any progress by the undertaking in relation to its <b>targets</b>.<br><br>
        28. The disclosure required by paragraph 26 relates to own operations and shall include:
		<ol class="slds-list--ordered">
        <li>total <b>water consumption</b> in m<sup>3</sup>;</li>
        <li>total water consumption in m<sup>3</sup> in areas at material water risk, including <b>areas of high-water stress</b>;</li>
        <li>total water recycled and reused in m<sup>3</sup>;<span class="tooltip-wrap"><sup>75</sup>
            <div class="tooltip-content-top">
            This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts as set out by indicator #6.2 in Table II of Annex I of Commission Delegated Regulation (EU) 2022/1288 regarding disclosure rules on sustainable investments (“Water usage and recycling”, 2. Weighted average percentage of water recycled and reused by investee companies).
            </div> 
        </span></li>
        <li>total water stored and changes in storage in m<sup>3</sup>; and</li>
        <li>any contextual information necessary regarding points (a) to (d), including the water basins’ water quality and quantity, how the data have been compiled, such as any standards, methodologies, and assumptions used, including whether the information is calculated, estimated, modelled, or sourced from direct measurements, and the approach taken for this, such as the use of any sector-specific factors.</li>
		</ol>
		<br>
		
        29. The undertaking shall provide information on its <b>water intensity</b>: total <b>water consumption</b> in its own operations in m3 per million EUR net revenue<span class="tooltip-wrap"><sup>76</sup>
            <div class="tooltip-left">
            This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts as set out by indicator #6.1 in Table II of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosure rules on sustainable investments (“Water usage and recycling”, 1. Average amount of water consumed by the investee companies (in cubic meters) per million EUR of revenue of investee companies).
            </div> 
        </span>
		<br>
		</div>
		</details>
		
		<details>
            <summary> E3-5 </summary>
        <div id='divE3-5'>
		30. <b>The undertaking shall disclose the anticipated financial effects of material water and marine resources-related risks and opportunities</b>.<br><br>
        31. The information required by paragraph 30 is in addition to the information on current financial effects on the entity’s financial position, financial performance and cash flows for the reporting period required under ESRS 2 SBM-3 para 48 (d).<br><br>
        32. The objective of this Disclosure Requirement is to provide an understanding of:
		<ol class="slds-list--ordered">
        <li><b>anticipated financial effects</b> due to material risks arising from water and <b>marine resources</b>-related impacts and <b>dependencies</b> and how these risks have (or could reasonably be expected to have) a material influence on the undertaking’s financial position, financial performance and cash flows, over the short-, medium- and long-term; and</li>
        <li><b>anticipated financial effects</b> due to material opportunities related to water and marine resources.</li>
		</ol>
        <br>

        <div id='divE3-5.32'>
        33. The disclosure shall include:
		<ol class="slds-list--ordered">
        <li>a quantification of the <b>anticipated financial effects</b> in monetary terms before considering water and marine resources-related actions or where not possible without undue cost or effort, qualitative information. For <b>financial effects</b> arising from opportunities, a quantification is not required if it would result in disclosure that does not meet the qualitative characteristics of information (see ESRS 1 Appendix B Qualitative characteristics of information);</li>
        <li>a description of the effects considered, the impacts and dependencies to which they relate, and the time horizons in which they are likely to materialise; and</li>
        <li>the critical assumptions used to quantify the anticipated financial effects, as well as the sources and level of uncertainty attached to those assumptions.</li>
		</ol>
		<br>
        </div>
		</div>
		</details>
    </div>
	</details>
	
	
	<details>
        <summary>Application Requirements</summary>
    <div>
        <details>
            <summary> E3-1 </summary>
        <div id='divE3-1AR'>
		AR 16. The <b>policies</b> described under this Disclosure Requirement may be integrated in broader environmental or sustainability policies covering different subtopics.<br><br>
        AR 17. When disclosing information under paragraph&nbsp;<a class="tooltip-wrap">9
            <div class="tooltip-content">
			The undertaking shall disclose its policies adopted to manage its material impacts, risks and opportunities related to water and marine resources.
            </div> 
        </a>, the undertaking may disclose whether its <b>policies</b>:
		<ol class="slds-list--ordered">
           <li>prevent further deterioration and protects and enhances the status of water bodies and aquatic <b>ecosystems</b>;</li>
           <li>promote sustainable water use based on a long-term protection of available water resources;</li>
           <li>aim at enhanced protection and improvement of the aquatic environment;</li>
           <li>promote a good environmental status of marine water; and</li>
           <li>promote reduction of <b>water withdrawals</b> and <b>water discharges</b>.</li>
		</ol>   
		<br>
		
        AR 18. The undertaking may also disclose information about <b>policies</b> which:
		<ol class="slds-list--ordered">
           <li>contribute to good ecological and chemical quality of <b>surface water</b> bodies and good chemical quality and quantity of groundwater bodies, in order to protect human health, water supply, natural <b>ecosystems</b> and biodiversity, the good environmental status of marine waters and the protection of the resource base upon which marine related activities depend;</li>
           <li>minimise material <b>impacts</b> and <b>risks</b> and implement mitigation measures that aim to maintain the value and functionality of priority services and to increase resource efficiency on own operations; and</li>
           <li>avoid impacts on <b>affected communities</b>.</li>
		</ol>   
		<br>
	    </div>
		</details>
		
		<details>
            <summary> E3-2 </summary>
        <div id='divE3-2AR'>
		AR 19. When disclosing information required under paragraph&nbsp;<a class="tooltip-wrap">15
            <div class="tooltip-content">
			The undertaking shall disclose its water and marine resources-related actions and the resources allocated to their implementation.
            </div> 
        </a>, the undertaking shall consider the <b>actions</b>, or action plans, contributing to address the material impacts, risks and opportunities identified. Useful guidance is provided by the Alliance for Water Stewardship (AWS).<br><br>
        AR 20. Considering that water and <b>marine resources</b> are shared resources which may require collective <b>actions</b>, or action plans, involving other <b>stakeholders</b>, the undertaking may provide information on those specific collective actions, including information on other parties (competitors, <b>suppliers</b>, retailers, customers, other business partners, local communities and authorities, government agencies…) and specific information on the project, its specific contribution, its sponsors and other participants.<br><br>
        AR 21. When providing information on capital expenditures, the undertaking may consider expenditures related, for example, to stormwater drain rehabilitation, pipelines, or machinery used to manufacture new low water-use products.<br><br>
		</div>
		</details>

		<details>
            <summary> E3-3 </summary>
        <div id='divE3-3AR'>
		AR 22. If the undertaking refers to <b>ecological thresholds</b> when setting <b>targets</b>, it may refer to the guidance provided by the Science-Based Targets Initiative for Nature (SBTN) in its interim guidance (Initial Guidance for Business, September 2020). It may also refer to any other guidance with a scientifically acknowledged methodology that enables the setting of science-based targets by identifying ecological thresholds and, if applicable, organisation-specific allocations. Ecological thresholds can be local, national and/or global.<br><br>
        AR 23. The undertaking may provide <b>targets</b> relating to:
		<ol class="slds-list--ordered">
           <li>the reduction of <b>water withdrawals</b>; and</li>
           <li>the reduction of <b>water discharges</b>.</li>
		</ol>
	   <br>
	   
        AR 24. If the undertaking provides <b>targets</b> on withdrawals, it may include <b>water withdrawal</b> from polluted <b>soils</b> and aquifers, water withdrawn and treated for <b>remediation</b> purposes.<br><br>
        AR 25. If the undertaking provides <b>targets</b> on <b>discharges</b>, it may include <b>water discharges</b> to <b>groundwater</b> such as reinjection to aquifers, or water returning to a groundwater source via a soakaway or a swale.<br><br>
        AR 26. The <b>targets</b> may cover its own operations and/or its upstream and downstream value chain.<br><br>
        AR 27. The undertaking may specify whether the <b>target</b> addresses shortcomings related to the Substantial Contribution criteria for Water and Marine Resources as defined in the Commission delegated acts adopted pursuant to Article 12(2) of Regulation (EU) 2020/852. Where the Do No Significant Harm (DNSH) criteria for Water and Marine Resources as defined in delegated acts adopted pursuant to Article 10(3), Article 11(3), Article 13(2), Article 14(2), and Article 15(2) of Regulation (EU) 2020/852 are not met, the undertaking may specify whether the target addresses shortcomings related those DNSH criteria.<br><br>
		</div>
		</details>

		<details>
            <summary> E3-4 </summary>
        <div id='divE3-4AR'>
		AR 28. The undertaking may operate in various <b>areas at water risk</b>. When disclosing information under paragraph&nbsp;<a class="tooltip-wrap">28(b)
            <div class="tooltip-content">
			total water consumption in m<sup>3</sup> in areas at material water risk, including <b>areas of high-water stress</b>;
            </div> 
        </a>, the undertaking shall include such information only for those areas that have been identified as material in accordance with ESRS2 IRO-1 and ESRS2 SBM-3.<br><br>
        AR 29. When disclosing contextual information on water consumption performance required by paragraph&nbsp;<a class="tooltip-wrap">26
            <div class="tooltip-content">
			The undertaking shall disclose information on its water consumption performance related to its material impacts, risks and opportunities.
            </div> 
        </a>, the undertaking shall explain the calculation methodologies and more specifically the share of the measure obtained from direct measurement, from sampling and extrapolation, or from best estimates.<br><br>
        AR 30. The undertaking may provide information on other breakdowns (i.e., per sector or segments).<br><br>
        AR 31. When disclosing information required by paragraph&nbsp;<a class="tooltip-wrap">29
            <div class="tooltip-content">
			The undertaking shall provide information on its water intensity: total water consumption in its own operations in m<spu>3</spu> per million EUR net revenue
            </div> 
        </a>, the undertaking may provide additional intensity ratios based on other denominators.<br><br>
        AR 32. The undertaking may also provide information on its <b>water withdrawals</b> and <b>water discharges</b>.<br><br>
		</div>
		</details>
        
		<details>
            <summary> E3-5 </summary>
        <div id='divE3-5AR'>
		AR 33. The undertaking may include an assessment of its related products and services at risk over the short-, medium- and long-term, explaining how these are defined, how financial amounts are estimated, and which critical assumptions are made.<br><br>
        AR 34. The quantification of the <b>anticipated financial effects</b> in monetary terms under paragraph&nbsp;<a class="tooltip-wrap">33(a)&nbsp;
            <div class="tooltip-content-top">
			A quantification of the potential financial effects in monetary terms or where impracticable, qualitative information. For financial effects arising from opportunities, a quantification is not required if it would result in disclosure that does not meet the qualitative characteristics of information (see [draft] ESRS 1 Appendix C Qualitative characteristics of information);
            </div> 
        </a>may be a single amount or a range.<br><br>
		</div>
		</details>
