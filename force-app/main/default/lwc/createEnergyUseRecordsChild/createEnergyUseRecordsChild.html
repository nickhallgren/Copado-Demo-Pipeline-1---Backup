<template>
  <lightning-accordion allow-multiple-sections-open active-section-name={showSectionfinal}>
    <lightning-accordion-section name={fuelTypeDetails.FuelTypeAccordionLabel}
      label={fuelTypeDetails.FuelTypeAccordionLabel}>
      <div style="border: 1px ridge; border-radius: 15px">
        <!-- ROW 1 -->
        <div class="slds-grid slds-gutters">
          <div class="slds-col slds-size_1-of-2 slds-p-top_medium">
            <lightning-combobox name="fuelTypeOption"
              label={fuelTypeDetails.ApplicabilityPicklistLabel}
              value={applicabilityValue}
              placeholder="Select"
              options={applicabilityOptions}
              onchange={handleApplicabilityChange}
              class="validate slds-p-left_medium"
              required>
            </lightning-combobox>
          </div>
          <template if:false={disableAll}>
            <div class="slds-col slds-size_1-of-2 slds-p-top_medium">
              <lightning-input type="text"
                name="energyName"
                class="validate"
                label={label.NZC_Energy_Use_Name}
                onchange={handleNameChange}
                required>
              </lightning-input>
            </div>
          </template>
        </div>
        <template if:false={disableAll}>
          <!-- ROW 2 -->
          <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-2 slds-p-top_medium">
              <lightning-input
                max="9999999999999998"
                type="number"
                name="input1"
                step=".01"
                label={label.NZC_Fuel_Consumption}
                oncommit={handleQuantityChange}
                class="validate slds-p-left_medium"
                required>
              </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-top_medium">
              <lightning-combobox
                name="UOM"
                label={label.NZC_Consumption_Unit}
                value={UOM_Value}
                placeholder="Select"
                options={uom_Options}
                onchange={handleUOMChange}
                class="validate"
                required>
              </lightning-combobox>
            </div>
          </div>
          <!-- ROW 3 -->
          <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-3 slds-p-top_medium">
              <lightning-combobox
                name="Month"
                label={label.NZC_Month_Label}
                value={monthSelected}
                placeholder="Select"
                options={month_Options}
                onchange={handleMonthChange}
                class="slds-p-left_medium validate"
                required>
              </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-3 slds-p-top_medium">
              <lightning-input
                type="date"
                name="startDate"
                class="validate"
                label={label.NZC_Start_Date}
                value={startDateValue}
                onchange={handleStartDateChange}
                required>
              </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3 slds-p-top_medium">
              <lightning-input
                type="date"
                name="endDate"
                class="slds-p-right_medium validate"
                label={label.NZC_End_Date}
                value={endDateValue}
                min={startDateValue}
                onchange={handleEndDateChange}
                required>
              </lightning-input>
            </div>
          </div>
          <!-- ROW 4 -->
          <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_2-of-3 slds-p-top_medium slds-p-bottom_medium">
              <lightning-textarea
                name="comments"
                class="validate slds-p-left_medium"
                label={label.NZC_Comments}
                onchange={handleCommentChange}>
              </lightning-textarea>
            </div>
            <div class="slds-col slds-size_1-of-3 slds-p-top_medium slds-p-bottom_medium">
              <lightning-file-upload
                label={label.NZC_Attach_Receipt}
                name="fileUploader"
                accept={acceptedFormats}
                record-id={createdEnergyUseRecordId}
                multiple
                required
                onuploadfinished={handleTopFileUpload}
                class="slds-p-right_medium">
              </lightning-file-upload>
              <p if:true={fileUploadedName}>{fileUploadedName}</p>
              <p if:true={showFileError} style="color: red">
                {label.NZC_File_Error_Msg}
              </p>
            </div>
          </div>
          <!-- Renewable Section -->
          <template lwc:if={enableRenewablePart}>
            <div class="slds-grid slds-gutters">
              <div class="slds-col slds-size_1-of-3 slds-p-top_medium">
                <lightning-input
                  type="checkbox"
                  class="slds-p-left_medium validate"
                  label={label.NZC_Renewable_Not_Applicable}
                  name="notApplicable"
                  onchange={handleRenewableCheckboxChange}>
                </lightning-input>
              </div>
              <div class="slds-col slds-size_2-of-3"></div>
            </div>
            <div class="slds-grid slds-gutters">
              <div class="slds-col slds-size_1-of-3 slds-p-top_medium slds-p-bottom_medium">
                <lightning-input
                  type="number"
                  class="validate slds-p-left_medium renEnergy"
                  name="input1"
                  step=".01"
                  label={label.NZC_Allocated_Renewable_Energy}
                  oncommit={handleAllocatedEnergyChange}
                  disabled={disableForRenComponents}
                  required>
                </lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-3 slds-p-top_medium slds-p-bottom_medium">
                <lightning-combobox
                  name="Ren_Energy_Type"
                  class="validate"
                  label={label.NZC_Renewable_Energy_Type}
                  value={ren_Energy_Type_Value}
                  placeholder="Select"
                  options={ren_Energy_Type_Options}
                  onchange={handleRenEnergyTypeChange}
                  disabled={disableForRenComponents}
                  required>
                </lightning-combobox>
              </div>
              <div class="slds-col slds-size_1-of-3 slds-p-top_medium slds-p-bottom_medium">
                <lightning-file-upload
                  label={label.NZC_Attach_Receipt_for_Renewable}
                  name="fileUploader"
                  accept={acceptedFormats}
                  record-id={recordId}
                  disabled={disableForRenComponents}
                  onuploadfinished={handleRenewableFileUpload}
                  multiple
                  class="slds-p-right_medium"
                  required>
                </lightning-file-upload>
                <p if:true={renFileUploadedName}>{renFileUploadedName}</p>
                <p if:true={showRenFileError} style="color: red">
                  {label.NZC_File_Error_Msg}
                </p>
              </div>
            </div>
          </template>
        </template>
        <!-- To Be Estimated Section -->
        <template if:false={disableForToBeEstimated}>
          <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-3 slds-p-top_medium slds-p-bottom_medium">
              <lightning-combobox
                name="Month"
                label={label.NZC_Month_Label}
                value={monthSelected}
                placeholder="Select"
                options={month_Options}
                onchange={handleMonthChange}
                class="slds-p-left_medium validate"
                required>
              </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-3 slds-p-top_medium">
              <lightning-input
                type="date"
                name="startDate"
                class="slds-p-right_medium validate"
                value={startDateValue}
                label={label.NZC_Start_Date}
                onchange={handleStartDateChange}
                required>
              </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-3 slds-p-top_medium">
              <lightning-input
                type="date"
                name="endDate"
                class="slds-p-right_medium validate"
                label={label.NZC_End_Date}
                value={endDateValue}
                min={startDateValue}
                onchange={handleEndDateChange}
                required>
              </lightning-input>
            </div>
          </div>
          <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_3-of-3 slds-p-top_medium slds-p-bottom_medium">
              <lightning-textarea
                name="comments"
                class="validate"
                label={label.NZC_Comments}
                onchange={handleCommentChange}>
              </lightning-textarea>
            </div>
          </div>
        </template>
      </div>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
