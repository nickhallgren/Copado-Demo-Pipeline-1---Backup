    <details>
        <summary>Objective</summary>
        <div>
		1. The objective of this Standard is to specify disclosure requirements which will enable users of the undertaking’s <b>sustainability statements</b> to understand the undertaking’s strategy and approach, processes and procedures as well as its performance in respect of business conduct.<br><br>
		2. This Standard focusses on the following matters, collectively referred to in this Standard as ‘business conduct or business conduct matters’:
		<ol class="slds-list--ordered">
			<li>business ethics and <b>corporate culture</b>, including anti-<b>corruption</b> and anti-<b>bribery</b>, the protection of whistleblowers, and animal welfare;</li>
			<li>the management of relationships with <b>suppliers</b>, including payment practices, especially with regard to late payment to small and medium-sized undertakings.</li>
			<li>activities and commitments of the undertaking related to exerting its political influence, including its <b>lobbying activities</b>;</li>
		</ol>
		<br>
        </div>
    </details>

    <details>
        <summary>Disclosure Requirements</summary>
    <div>
        <details>
            <summary> G1-1 </summary>
			<div id="divG1-1">
			7. <b>The undertaking shall disclose its policies with respect to business conduct matters and how it fosters its corporate culture.</b><br><br>

			8. The objective of this Disclosure Requirement is to enable an understanding of the extent to which the undertaking has policies that address the identification, assessment, management and/or <b>remediation</b> of its material <b>impacts</b>, <b>risks</b> and <b>opportunities</b> related to business conduct matters. It also aims to provide an understanding of the undertaking’s approach to <b>corporate culture</b>.<br><br>

			9. The disclosures required under paragraph 7 shall include how the undertaking establishes, develops, promotes and evaluates its <b>corporate culture</b>.<br><br>

			10. The disclosures in paragraph 7 shall cover the following aspects related to the undertaking’s policies on business conduct matters:
			<ol class="slds-list--ordered">
				<li> a description of the mechanisms for identifying, reporting and investigating concerns about unlawful behaviour or behaviour in contradiction of its code of conduct or similar internal rules; and whether it accommodates reporting from internal and/or external <b>stakeholders</b>;</li>
				<li> where the undertaking has no policies on anti-<b>corruption</b> or anti-<b>bribery</b> consistent with the United Nations Convention against Corruption<span class="tooltip-wrap"><sup>127</sup>
					<div class="tooltip-left">
					This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts as set out by indicator #15 in Table III of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosures rules on sustainable investments (“Lack of anti-corruption and anti-bribery policies”).
					</div> 
				</span>, it shall state this and whether it has plans to implement them and the timetable for implementation;</li>
				<li> how the undertaking protects whistleblowers, including:</li>
					<ol class="slds-is-nested">
					<li> details on the establishment of internal whistleblower reporting channels, including whether the undertaking provides for information and training to its own workers and information about the designation and training of staff receiving reports; and</li>
					<li> measures to protect against retaliation its own workers who are whistleblowers in accordance with the applicable law transposing Directive (EU) 2019/1937 of the European Parliament and of the Council<span class="tooltip-wrap"><sup>128</sup>
					<div class="tooltip-content">
						Directive (EU) 2019/1937 of the European Parliament and of the Council of 23 October 2019 on the protection of persons who report breaches of Union law (OJ L 305, 26.11.2019, p. 17). 
					</div> 
				</span>
					</li>
					</ol>
				<li> where the undertaking has no policies on the protection of whistle-blowers<span class="tooltip-wrap"><sup>129</sup>
					<div class="tooltip-content">
						This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts as set out by indicator #6 in Table III of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosures rules on sustainable investments (“Insufficient whistleblower protection”).
					</div> 
				</span>, it shall state this and whether it has plans to implement them and the timetable for implementation;</li>
				<li> beyond the procedures to follow-up on reports by whistleblowers in accordance with the applicable law transposing Directive (EU) 2019/1937, whether the undertaking has procedures to investigate business conduct <b>incidents</b>, including incidents of <b>corruption</b> and <b>bribery</b>, promptly, independently and objectively;</li>
				<li> where applicable, whether the undertaking has in place policies with respect to animal welfare;</li>
				<li> the undertaking’s <b>policy</b> for <b>training</b> within the organisation on business conduct, including target audience, frequency and depth of coverage; and</li>
				<li> the functions within the undertaking that are most at risk in respect of <b>corruption</b> and <b>bribery</b></li>
			</ol>
		11. Undertakings that are subject to legal requirements under national law transposing Directive (EU) 2019/1937, or to equivalent legal requirements with regard to the protection of whistle-blowers, may comply with the disclosure specified in paragraph 10 (d) by stating that they are subject to those legal requirements.<br>		
			<br>
			</div>
		</details>
		
		<details>
            <summary> G1-2 </summary>
			<div id="divG1-2">
			12. <b>The undertaking shall provide information about the management of its relationships with its suppliers and its impacts on its supply chain.</b><br><br>

			13. The objective of this Disclosure Requirement is to provide an understanding of the undertaking’s management of its procurement process including fair behaviour with <b>suppliers</b>.<br><br>

			14. The undertaking shall provide a description of its <b>policy</b> to prevent late payments, specifically to SMEs.<br><br>

			15. The disclosure required under paragraph 12 shall include the following information:
				<ol class="slds-list--ordered">
				<li> the undertaking’s approach to its relationships with its <b>suppliers</b>, taking account of risks to the undertaking related to its <b>supply chain</b> and of <b>impacts</b> on <b>sustainability matters</b>; and</li>
				<li> whether and how it takes into account social and environmental criteria for the selection of its suppliers.</li>
				</ol>
				<br>
			</div>
		</details>
		
		<details>
            <summary> G1-3 </summary>
			<div id="divG1-3">
			16. <b>The undertaking shall provide information about its system to prevent and detect, investigate, and respond to allegations or incidents relating to corruption and bribery including the related training.</b><br><br>

			17. The objective of this Disclosure Requirement is to provide transparency on the key procedures of the undertaking to prevent, detect, and address allegations about <b>corruption</b> and <b>bribery</b>.Thisincludes the training provided to own workers and/or information provided internally or to <b>suppliers</b>.<br><br>

			18. The disclosure required under paragraph 16 shall include the following information:
			<ol class="slds-list--ordered">
				<li> a description of the procedures in place to prevent, detect, and address allegations or <b>incidents</b> of <b>corruption</b> and <b>bribery</b>;</li>
				<li> whether the investigators or investigating committee are separate from the chain of management involved in the matter; and</li>
				<li> the process, if any, to report outcomes to the <b>administrative, management and supervisory bodies</b>.</li>
			</ol>
			<br>
			
			19. Where the undertaking has no such procedures in place, it shall disclose this fact and, where applicable, its plans to adopt them.<br><br>

			20. The disclosures required by paragraph 16 shall include information about how the undertaking communicates its policies to those for whom they are relevant to ensure that the <b>policy</b> is accessible and that they understand its implications.<br><br>

			21. The disclosure required by paragraph 16 shall include information about the following with respect to training:
				<ol class="slds-list--ordered">
				<li> the nature, scope and depth of anti-<b>corruption</b> and anti-<b>bribery</b> training programmes offered or required by the undertaking;</li>
				<li> the percentage of functions-at-risk covered by training programmes; and</li>
				<li> the extent to which training is given to members of the administrative, management and supervisory bodies.</li>
				</ol>
				<br>
			</div>
		</details>
		
		<details>
            <summary> G1-4 </summary>
			<div id="divG1-4">
			22. <b>The undertaking shall provide information on incidents of corruption or briberyduring the reporting period.</b><br><br>

			23. The objective of this Disclosure Requirement is to provide transparency on the incidents relating to <b>corruption</b> or <b>bribery</b> during the reporting period and the related outcomes.<br><br>

			24. The undertaking shall disclose:
			<ol class="slds-list--ordered">
				<li> the number of convictions and the amount of fines for violation of anti-corruption and anti-bribery laws<span class="tooltip-wrap"><sup>130</sup>
					<div class="tooltip-content">
					This information supports the information needs of: financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts set out in indicator #17 of Table III of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosures rules on sustainable investments (“Number of convictions and amount of fines for violation of anti-corruption and anti-bribery laws”); and benchmark administrators to disclose ESG factors subject to Regulation (EU) 2020/1816 as set out by indicator “Numbers of convictions and amount of fines for violations of anti-corruption and anti-bribery laws” in section 1 and 2 of Annex II
					</div> 
				</span>; and</li>
				<li> any actions taken to address breaches in procedures and standards of anti-corruption and anti-bribery<span class="tooltip-wrap"><sup>131</sup>
					<div class="tooltip-content">
						This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from an additional indicator related to principal adverse impacts set out in in indicator #16 of Table III of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosures rules on sustainable investments (“Cases of insufficient action taken to address breaches of standards of anti-corruption and anti-bribery”).
					</div> 
				</span>;</li>
			</ol>
			<br>
			
			25. The undertaking shall disclose 
              <ol class="slds-list--ordered">
				  <li>the total number and nature of <b>confirmed incidents</b> of corruption or bribery;</li>
				  <li>the number of <b>confirmed incidents</b> in which own workers were dismissed or disciplined for corruption or bribery-related incidents;</li>
				  <li>the number of <b>confirmed incidents</b> relating to contracts with business partners that were terminated or not renewed due to violations related to corruption or bribery; and</li>
				  <li>details of public legal cases regarding <b>corruption</b> or <b>bribery</b> brought against the undertaking and its own workers during the reporting period and the outcomes of such cases. This includes cases that were initiated in previous years where the outcome was only established in the current reporting period.</li>
			   </ol>
			   <br>

			26. The disclosures required shall include <b>incidents</b> involving actors in its <b>value chain</b> only where the undertaking or its <b>employees</b> are directly involved.<br><br>
			</div>
			</details>
			
			<details>
            <summary> G1-5 </summary>
			<div id="divG1-5">
			27. <b>The undertaking shall provide information on the activities and commitments related to exerting its political influence, including its lobbying activities related to its material impacts, risks and opportunities.</b><br><br>

			28. The objective of this Disclosure Requirement is to provide transparency on the undertaking’s activities and commitments related to exerting its political influence with political contributions, including the types and purpose of <b>lobbying activities</b>.<br><br>

			29. The disclosure required by paragraph 27 shall include:
			<ol class="slds-list--ordered">
				<li> if applicable, the representative(s) responsible in the <b>administrative, management and supervisory bodies</b> for the oversight of these activities;</li>
				<li> for financial or in-kind political contributions:</li>
				<ol class="slds-is-nested">
					<li> the total monetary value of financial and in-kind political contributions made directly and indirectly by the undertaking aggregated by country or geographical area where relevant, as well as type of recipient/beneficiary; and</li>
					<li> where appropriate, how the monetary value of in-kind contributions is estimated.</li>
				</ol>
				<li> the main topics covered by its <b>lobbying activities</b> and the undertaking’s main positions on these in brief. This shall include explanations on how this interacts with its material impacts, risks and opportunities identified in its <b>materiality</b> assessment per ESRS 2; and</li>
				<li> if the undertaking is registered in the EU Transparency Register or in an equivalent transparency register in a Member State, the name of any such register and its identification number in the register.</li>
			</ol>
			<br>
			30. The disclosure shall also include information about the appointment of any members of the <b>administrative, management and supervisory bodies</b> who held a comparable position in public administration (including regulators) in the 2 years preceding such appointment in the current reporting period.<br><br>
			</div>
			</details>
			
			<details>
            <summary> G1-6 </summary>
			<div id="divG1-6">
			31. <b>The undertaking shall provide information on its payment practices, especially with respect to late payments to small and medium enterprises (SMEs).</b><br><br>

			32. The objective of this Disclosure Requirement is to provide insights on the contractual payment terms and on its performance with regard to payment, especially as to how these impact SMEs and specifically with respect to late payments to SMEs.<br><br>

			33. The disclosure under paragraph 31 shall include:
			<ol class="slds-list--ordered">
				<li> the average time the undertaking takes to pay an invoice from the date when the contractual or statutory term of payment starts to be calculated, in number of days;</li>
				<li> a description of the undertaking’s standard payment terms in number of days by main category of <b>suppliers</b> and the percentage of its payments aligned with these standard terms;</li>
				<li> the number of legal proceedings currently outstanding for late payments; and</li>
				<li> complementary information necessary to provide sufficient context. If the undertaking has used representative sampling to calculate the information required under point (a), it shall state that fact and briefly describe the methodology used.</li>
			</ol>
			<br>
			</div>
			</details>
	</div>	
	</details>

				<li> how the members of the undertaking’s administrative, management and supervisory bodies provide direction to promote a corporate culture; and</li>

			AR 2. For purposes of this standard, management of relationships with the undertaking’s <b>suppliers</b> may include the following:
			<ol class="slds-list--ordered">
				<li> how the undertaking’s practices, including activities to avoid or minimise the impacts of disruptions to its <b>supply chain</b>, support its strategy and risk management;</li>
				<li> training of the undertaking’s procurement/supply chain workforce on engagement and dialogue with <b>suppliers</b> as well as incentives of its procurement workforce including whether such incentives refer toprice, quality or sustainability factors;</li>
				<li> the screening and evaluation of social and environmental performance of suppliers;</li>
				<li> the inclusion of locally based suppliers in its supply chain and/or suppliers with certification;</li>
				<li> how the undertaking’s practices deal with vulnerable suppliers;</li>
				<li> the undertaking’s <b>targets</b> and <b>actions</b> with regard to communication and management of relationships with suppliers; and</li>
				<li> how the outcomes of these practices are evaluated, including supplier visits, audits or surveys.</li>
			</ol>
			<br>
			AR 3. 'Vulnerable suppliers’ includes <b>suppliers</b> that are exposed to significant economic, environmental and/or social risks.<br><br>
			</div>
		</details>

			AR 5. Disclosures may include details about the risk assessments and/or mapping, as well as monitoring programmes and/or internal control procedures performed by the undertaking to detect <b>corruption</b> and <b>bribery</b>.<br><br>

			AR 6. The undertaking’s policies on <b>corruption</b> and <b>bribery</b> may be relevant to specific groups of people, either because they are expected to implement them (for example, the undertaking’s <b>employees</b>, contractors and <b>suppliers</b>), or because they have a direct interest in their implementation (for example, <b>value chain</b> workers, investors). The undertaking may disclose the communication tools and channels (e.g., flyers, newsletters, dedicated websites, social media, face to face interactions, unions and/or workers representatives) to communicate policies to such groups. This may also include the identification and/or removal of potential barriers to dissemination, such as through translation into relevant languages or the use of graphic depictions.<br><br>

			AR 7. The undertaking may disclose an analysis of its training activities by, for example, region of training or category of <b>own workforce</b> where its programmes differ significantly based on such factors and such information would be useful to users.<br><br>

            <summary> G1-5 </summary>
			<div id='divG1-5AR'>
			AR 9. For purposes of this Standard ‘political contribution’ means financial or in-kind support provided directly to political parties, their elected representatives or persons seeking political office. Financial contributions can include donations, loans, sponsorships, advance payments for services, or the purchase of tickets for fundraising events and other similar practices. In-kind contributions can include advertising, use of facilities, design and printing, donation of equipment, provision of board membership, employment or consultancy work for elected politicians or candidates for office.<br><br>

			AR 10. 'Indirect political contribution’ refers to those political contributions made through an intermediary organisation such as a lobbyist or charity, or support given to an organisation such as a think tank or trade association linked to or supporting particular political parties or causes.<br><br>

			AR 11. When determining ‘comparable position’ in this standard, the undertaking shall consider various factors, including level of responsibility and scope of activities undertaken.<br><br>

			AR 12. The undertaking may provide the following information on its financial or in-kind contributions with regard to its lobbying expenses:<br>
			<ol class="slds-list--ordered">
				<li> the total monetary amount of such internal and external expenses; and</li>
				<li> the total amount paid for membership to lobbying associations.</li>
			</ol>
			<br>
            AR 13. If the undertaking is legally obliged to be a member of a chamber of commerce or other organisation that represents its interests, it may disclose that this is the case.<br><br>
			AR 14. In meeting the requirement in paragraph&nbsp;<a class="tooltip-wrap">29 (c)&nbsp;
				<div class="tooltip-content">
				the main topics covered by its <b>lobbying activities</b> and the undertaking’s main positions on these in brief. This shall include explanations on how this interacts with its material impacts, risks and opportunities identified in its <b>materiality</b> assessment per ESRS 2; and
				</div> 
			</a>the undertaking shall consider the alignment between its public statements on its material impacts, risks and opportunities and its <b>lobbying activities</b>.<br><br>
