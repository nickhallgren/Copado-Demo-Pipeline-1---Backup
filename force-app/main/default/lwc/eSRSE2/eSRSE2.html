        <summary>Objective</summary>
        <div>
            1. The objective of this Standard is to specify Disclosure Requirements which will enable users of the <b>sustainability statements</b> to understand:
            <ol class="slds-list--ordered">
				<li>how the undertaking affects <b>pollution</b> of air, water and <b>soil</b>, in terms of material positive and negative actual or potential <b>impacts</b>;</li>
				<li>any <b>actions</b> taken, and the result of such actions, to prevent or mitigate actual or potential material negative impacts, and to address <b>risks</b> and <b>opportunities</b>;</li>
				<li>the plans and capacity of the undertaking to adapt its <b>strategy</b> and <b>business model</b> in line with the transition to a sustainable economy and with the need to prevent, control and eliminate of pollution. This is to create a toxic-free environment with zero pollution also in support of the EU Action Plan “Towards a Zero Pollution for Air, Water and Soil”; </li>
				<li>the nature, type and extent of the undertaking’s material risks and opportunities related to the undertaking’s pollution-related impacts and <b>dependencies</b>, as well as the prevention, control, elimination or reduction of pollution, including where this results from the application of regulations, and how the undertaking manages this; and</li>
				<li>the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of material risks and opportunities arising from the undertaking’s pollution-related impacts and dependencies.</li>
            </ol>
			<br>
			2. This Standard sets out Disclosure Requirements related to the following <b>sustainability matters</b>: <b>pollution</b> of air, water, <b>soil</b>, <b>substances of concern</b>, including <b>substances of very high concern</b>.<br><br>
            3. “<b>Pollution</b> of air” refers to the undertaking’s <b>emissions</b> into air (both indoor and outdoor), and prevention, control and reduction of such emissions.<br><br>
            4. “<b>Pollution</b> of water” refers to the undertaking’s <b>emissions</b> to water, and prevention, control and reduction of such emissions.<br><br>
            5. “<b>Pollution of soil</b>” refers to the undertaking’s <b>emissions</b> into soil and the prevention, control and reduction of such emissions.<br><br>
            6. With regard to “<b>substances of concern</b>”, this standard covers the undertaking’s production, use and/or distribution and commercialisation of substances of concern, including <b>substances of very high concern</b>. Disclosure Requirements on substances of concern aim at providing users with an understanding of actual or potential impacts related to such substances, also taking account of possible restrictions on their use and/or distribution and commercialisation.<br><br>
        </div>
    </details>

            <summary> E2-1 </summary>
        <div id='divE2-1'>
		12. The undertaking shall describe its policies adopted to manage its material impacts, risks and opportunities related to pollution prevention and control.<br><br>
        13. The objective of this Disclosure Requirement is to enable an understanding of the extent to which the undertaking has <b>policies</b> that address the identification, assessment, management and/or <b>remediation</b> of material pollution-related <b>impacts, risks</b> and <b>opportunities</b>.<br><br>
        14. The disclosure required by paragraph&nbsp;<a class="tooltip-wrap">12&nbsp;
             <div class="tooltip-content">
           The undertaking shall describe its policies adopted to manage its material impacts, risks and opportunities related to pollution prevention and control.    
            </div> </a> shall contain the information on the policies the undertaking has in place to manage its material <b>impacts, risks</b> and <b>opportunities</b> related to <b>pollution</b> in accordance with ESRS 2 MDR-P Policies adopted to manage material sustainability matters.<br><br>
        15. The undertaking shall indicate, with regard to its own operations and its upstream and donwstream <b>value chain</b>, whether and how its <b>policies</b> address the following areas where material:
        <ol class="slds-list--ordered">
        <li>mitigating negative <b>impacts</b> related to <b>pollution</b> of air, water and <b>soil</b> including prevention and control;</li>
        <li>substituting and minimising the use of <b>substances of concern</b>, and phasing out <b>substances of very high concern</b>, in particular for non-essential societal use and in <b>consumer</b> products; and</li>
        <li>avoiding <b>incidents</b> and emergency situations, and if and when they occur, controlling and limiting their impact on people and the environment.</li>
        </ol>
		<br>
		</div>
		</details>

        <details>
            <summary> E2-2 </summary>
        <div id='divE2-2'>
		16. The undertaking shall disclose its pollution-related actions and the resources allocated to their implementation.<br><br>
        17. The objective of this Disclosure Requirement is to enable an understanding of the key actions taken and planned to achieve the <b>pollution</b>-related <b>policy</b> objectives and <b>targets</b>.<br><br>
		18. The description of the pollution-related action plans and resources shall contain the information prescribed in ESRS 2 MDR-A Actions and resources in relation to material sustainability matters.<br><br>
        19. In addition to ESRS 2 MDR-A, the undertaking may specify to which layer in the following mitigation hierarchy an action and resources can be allocated to:
		<ol class="slds-list--ordered">
        <li>avoid <b>pollution</b> including any phase out of materials or compounds that have a negative impact (prevention of pollution at source);</li>
        <li>reduce pollution, including: any phase-out of materials or compounds meeting enforcement requirements such as<b> Best Available Techniques (BAT)</b> requirements or meeting the <b>Do No Significant Harm</b> criteria for pollution prevention and control according to the EU Taxonomy Regulation and its Delegated Acts (minimisation of pollution); and</li>
        <li>restore, regenerate and transform <b>ecosystems</b> where pollution has occurred (control of the impacts both from regular activities and <b>incidents</b>).</li>
		</ol>
		<br>
		</div>
		</details>
	
        <details>
            <summary> E2-3 </summary>
        <div id='divE2-3'>
		20. The undertaking shall disclose the pollution-related targets it has set.<br><br>
        21. The objective of this Disclosure Requirement is to enable an understanding of the <b>targets</b> the undertaking has set to support its <b>pollution</b>-related <b>policies</b> and to address its material pollution-related <b>impacts, risks</b> and <b>opportunities</b>.<br><br>
        22. The description of <b>targets</b> shall contain the information requirements defined in ESRS 2 MDR-T Tracking effectiveness of policies and actions through targets.<br><br>
        23. The disclosure required by paragraph&nbsp;<a class="tooltip-wrap">20&nbsp;
            <div class="tooltip-content">
            The undertaking shall disclose the pollution-related targets it has set.
            </div> 
            </a> shall indicate whether and how its <b>targets</b> relate to the prevention and control of:
		<ol class="slds-list--ordered">
        <li>air pollutants and respective <b>specific loads</b>;</li>
        <li><b>emissions</b> to water and respective specific loads;</li>
        <li><b>pollution</b> to <b>soil</b> and respective specific loads; and</li>
        <li><b>substances of concern</b> and <b>substances of very high concern</b>.</li>
		</ol>
		<br>
        24. In addition to ESRS 2 MDR-T, the undertaking may specify whether <b>ecological thresholds</b> (e.g., the <b>biosphere integrity</b>, stratospheric ozone-depletion, atmospheric aerosol loading, soil depletion, ocean acidification) and entity-specific allocations were taken into consideration when setting targets. If so, the undertaking may specify:
		<ol class="slds-list--ordered">
        <li>the <b>ecological thresholds</b> identified, and the methodology used to identify such thresholds;</li>
        <li>whether or not the thresholds are entity-specific and if so, how they were determined; and</li>
        <li>how responsibility for respecting identified ecological thresholds is allocated in the undertaking.</li>
		</ol>
		<br>
        25. The undertaking shall specify as part of the contextual information, whether the <b>targets</b> that it has set and presented are mandatory (required by legislation) or voluntary.<br><br>
		</div>
		</details>
	
        <details>

		26. <b>The undertaking shall disclose the pollutants that it emits through its own operations, as well as the microplastics it generates or uses.</b><br><br>
        27. The objective of this Disclosure Requirement is to provide an understanding of the <b>emissions</b> that the undertaking generates to air, water and <b>soil</b> in its own operations, and of its generation and use of microplastics.<br><br>
        28. The undertaking shall disclose the amounts of:
		<ol class="slds-list--ordered">
        <li>each pollutant listed in Annex II of Regulation (EC) No 166/2006 of the European Parliament and of the Council<a class="tooltip-wrap"><sup>64</sup>
            <div class="tooltip-left">
            Regulation (EC) No 166/2006 of the European Parliament and of the Council of 18 January 2006 concerning the establishment of a European Pollutant Release and Transfer Register and amending Council Directives 91/689/EEC and 96/61/EC (OJ L 033 4.2.2006, p. 1)
            </div> 
            </a>(European Pollutant Release and Transfer Register “E-PRTR Regulation”)emitted to air, water and soil, with the exception of emissions of GHGs which are disclosed in accordance with ESRS E1 Climate Change<a class="tooltip-wrap"><sup>65</sup>
            <div class="tooltip-left">
            This information supports the information needs of financial market participants subject to Regulation (EU) 2019/2088 because it is derived from: (a) an additional indicator related to principal adverse impacts as set out by indicator #2 in Table II of Annex I of Commission Delegated Regulation (EU) 2022/1288 with regard to disclosure rules on sustainable investments (“Emissions of air pollutants”); (b) indicator #8 in Table I of Annex I (“Emissions to water); (c) indicator #1 in Table II of Annex I ( “Emissions of inorganic pollutants”); and (d) indicator #3 in Table II of Annex I (“Emissions of ozone- depleting substances”)
            </div> 
        </a>;</li>
        <li>microplastics generated or used by the undertaking.</li>
		</ol>
		<br>
        29. The amounts referred in paragraph 28 shall be consolidated amounts including the emissions from those facilities over which the undertaking has financial control and those over which it has operational control. The consolidation shall include only the emissions from facilities for which the applicable threshold value specified in Annex II of Regulation (EC) No 166/2006 is exceeded.<br><br>
        30. The undertaking shall put its disclosure into context and describe:
		<ol class="slds-list--ordered">
        <li>the changes over time,</li>
        <li>the measurement methodologies; and</li>
        <li>the process(es) to collect data for <b>pollution</b>-related accounting and reporting, including the type of data needed and the information sources.</li>
		</ol>
		<br>
        31. When an inferior methodology compared to direct measurement of <b>emissions</b> is chosen to quantify emissions, the reasons for choosing this inferior methodology shall be outlined by the undertaking. If the undertaking uses estimates, it shall disclose the standard, sectoral study or sources which form the basis of its estimates, as well as the possible degree of uncertainty and the range of estimates reflecting the measurement uncertainty.<br><br>
		</div>
		</details>
	
        <details>
            <summary> E2-5 </summary>
        <div id='divE2-5'>
		32. <b>The undertaking shall disclose information on the production, use, distribution, commercialisation and import/export of substances of concern and substances of very high concern on their own, in mixtures or in articles</b>.<br><br>
        33. The objective of this Disclosure Requirement is to enable an understanding of the impact of the undertaking on health and the environment through <b>substances of concern</b> and through <b>substances of very high concern</b> on their own. It is also to enable an understanding of the undertaking’s material risks and <b>opportunities</b>, including exposure towards those substances and risks arising from changes in regulations.<br><br>
        34. The disclosure required by paragraph&nbsp;<a class="tooltip-wrap">32&nbsp;
             <div class="tooltip-content">
           The undertaking shall disclose information on the production, use, distribution, commercialisation and import/export of substances of concern and substances of very high concern, on their own, in mixtures or in articles.
            </div> </a> shall include the total amounts of <b>substances of concern</b> that are generated or used during the production or that are procured, and the total amounts of substances of concern that leave its facilities as emissions, as products, or as part of products or services split into main hazard classes of substances of concern.<br><br>
        35. The undertaking shall present separately information related to <b>substances of very high concern</b>.<br><br>
		</div>
		</details>
	
        <details>
            <summary> E2-6 </summary>
        <div id='divE2-6'>
		36. <b>The undertaking shall disclose anticipated financial effects of material pollution-related risks and opportunities.</b><br><br>
        37. The information required by paragraph&nbsp;<a class="tooltip-wrap">36&nbsp;
             <div class="tooltip-content">
           The undertaking shall disclose anticipated financial effects of material pollution-related risks and opportunities.
            </div> </a> is in addition to the information on current financial effects on the undertaking’s, financial position, financial performance and cash flows for the reporting period required under ESRS 2 SBM-3 para 48 (d).<br><br>
        38. The objective of this Disclosure Requirement is to provide an understanding of:
		<ol class="slds-list--ordered">
        <li><b>anticipated financial effects</b> due to material risks arising from <b>pollution</b>-related impacts and <b>dependencies</b> and how these risks have (or could reasonably be expected to have) a material influence on the undertaking’s , financial position financial performance and cash flows, over the short-, medium- and long-term.</li>
        <li><b>anticipated financial effects</b> due to material <b>opportunities</b> related to <b>pollution</b> prevention and control.</li>
		</ol>
		<br>
        39. The disclosure shall include:<br>
        <ol class="slds-list--ordered">
            <li>a quantification of the <b>anticipated financial effects</b> in monetary terms before considering pollution-related actions, or where not possible without undue cost or effort, qualitative information. For <b>financial effects</b> arising from <b>opportunities</b>, a quantification is not required if it would result in disclosure that does not meet the qualitative characteristics of information (see ESRS 1 Appendix B Qualitative characteristics of information);</li>
            <li>a description of the effects considered, the related impacts and the time horizons in which they are likely to materialise; and</li>
            <li>the critical assumptions used to quantify the <b>anticipated financial effects</b>, as well as the sources and level of uncertainty of those assumptions.</li>
        </ol>
		
        40. The information provided under paragraph 38(a) shall include:
		<ol class="slds-list--ordered">
        <li>the share of net revenue made with products and services that are or that contain <b>substances of concern</b> and the share of net revenue made with products and services that are or that contain <b>substances of very high concern</b>;</li>
        <li>the operating and capital expenditures inccurred in the reporting period in conjunction with major <b>incidents</b> and <b>deposits</b>;</li>
        <li>the provisions for environmental protection and <b>remediation</b> costs, e.g., for rehabilitating contaminated <b>sites</b>, recultivating landfills, removal of environmental contamination at existing production or storage sites and similar measures.</li>
		</ol>
		<br>
		
        41. The undertaking shall disclose any relevant contextual information including a description of material <b>incidents</b> and <b>deposits</b> whereby <b>pollution</b> had negative impacts on the environment and/or is expected to have negative effects on the undertaking’s financial cash flows, financial position and financial performance with short-, medium- and long-term time horizons.<br><br>
		</div>
		</details>
	</div>

           <li>how it is or may be affected by the <b>targets</b> and measures of the EU Action Plan and the revision of existing directives (e.g., the Industrial Emissions Directive);</li>

        AR 14. When considering resources, examples of operational expenditures could be investments in research and development to innovate and develop safe and sustainable alternatives to the use of substances of concern or to decrease <b>emissions</b> in a production process.<br><br>

		AR 16. If the undertaking refers to <b>ecological thresholds</b> when setting <b>targets</b>, it may referto the guidance provided by the Science-Based Targets Initiative for Nature (SBTN) in its interim guidance (Initial Guidance for Business, September 2020), or any other guidance with a scientifically acknowledged methodology that allows setting of science-based targets by identifying ecological thresholds and, if applicable, entity-specific allocations. Ecological thresholds can be local, national and/or global.<br><br>

        AR 18. Where relevant to support the <b>policies</b> it has adopted, the undertaking may provide information on the <b>targets</b> set at <b>site</b> level.<br><br>
        AR 19. The <b>targets</b> may cover the undertaking’s own operations and/or the value chain.<br><br>
		</div>

		<details>

        <div id='divE2-4AR'>
        AR 20. The information to be provided on microplastics under paragraph&nbsp;<a class="tooltip-wrap">28(b)&nbsp;
            <div class="tooltip-content">
            Microplastics generated or used by the undertaking.
            </div> 
        </a>shall include microplastics that have been generated or used during production processes or that are procured, and that leave its facilities as emissions, as products, or as part of products or services. Microplastics may be unintentionally produced when larger pieces of plastics like car tyres or synthetic textiles wear and tear or may be deliberately manufactured and added to products for specific purposes (e.g., exfoliating beads in facial or body scrubs).<br><br>

        AR 23. When providing contextual information on the emissions, the undertaking may consider:
		<ol class="slds-list--ordered">
           <li>the local air quality indices (AQI) for the area where the undertaking’s air <b>pollution</b> occurs;</li>
           <li>the degree of urbanisation (DEGURBA)<span class="tooltip-wrap"><sup>66</sup> &nbsp;

            </div>

           <li>the undertaking’s percentage of the total <b>emissions</b> of <b>pollutants</b> to water and <b>soil</b> occurring in areas at water risk, inculding areas of high-water stress.</li>

        <b>Methodologies</b><br><br>
        AR 26. When providing information on <b>pollutants</b>, the undertaking shall consider approaches for quantification in the following order of priority:
		<ol class="slds-list--ordered">
           <li>direct measurement of emissions, effluents or other <b>pollution</b> through the use of recognised continuous monitoring systems (e.g., AMS Automated Measuring Systems);</li>
           <li>periodic measurements;</li>
           <li>calculation based on <b>site</b>-specific data;</li>
           <li>calculation based on published pollution factors; and</li>
           <li>estimation.</li>
		</ol>
		<br>
        AR 27. Regarding the disclosure of methodologies required by paragraph&nbsp;<a class="tooltip-wrap">30
            <div class="tooltip-content-top">
            The undertaking shall put its disclosure into context and describe:
		    <ol class="slds-list--ordered">
            <li>the changes over time,</li>
            <li>the measurement methodologies; and</li>
            <li>the process(es) to collect data for <b>pollution</b>-related accounting and reporting, including the type of data needed and the information sources.</li>
		    </ol>
            </div> 
        </a>, the undertaking shall consider:
		<ol class="slds-list--ordered">
           <li>whether its monitoring is carried out in accordance with EU <b>BREF</b> Standards or another relevant reference benchmark; and</li>
           <li>whether and how the calibration tests of the AMS were undertaken and the verification of periodic measurement by independent labs were ensured.</li>
		</ol>
