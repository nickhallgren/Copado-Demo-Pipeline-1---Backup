        <summary>Objective</summary>
        <div>
		1. This ESRS sets out the disclosure requirements that apply to all undertakings regardless of their sector of activity (i.e., sector agnostic) and apply across sustainability topics (i.e., cross-cutting). This ESRS covers the reporting areas defined in ESRS 1 General requirements section 1.2 Cross-Cutting Standards and reporting areas.<br><br>

		2. In the preparation of disclosures under this Standard, the undertaking shall apply the Disclosure Requirements (including their datapoints) set in topical ESRS, as listed in Appendix C of this Standard Disclosure/Application Requirements in topical ESRS that are applicable jointly with ESRS 2 General Disclosures. The undertaking shall apply the requirements listed in Appendix C:			<ol class="slds-list--ordered">
				<li> in all instances for the requirements in topical standards related to Disclosure Requirement IRO-1 Description of the processes to identify and assess material <b>impacts</b>, <b>risks</b> and <b>opportunities</b>; and</li>
				<li> for all other requirements listed in appendix C, only if the sustainability topic is material based on the undertaking’s <b>materiality</b> assessment (see ESRS 1 chapter 3 Double materiality as the basis for sustainability disclosures).</li>
			</ol>
		<br>
        </div>

            <summary> BP-1 </summary>
			<div id='divBP-1'>
			3. <b>The undertaking shall disclose the general basis for preparation of its sustainability statements.</b><br><br>

			4. The objective of this Disclosure Requirement is to provide an understanding of how the undertaking prepares its <b>sustainability statements</b>, including the scope of consolidation, the upstream and downstream <b>value chain</b> information and, where relevant, whether the undertaking has used any of the options for omitting information referred to in points d) and e) in the following paragraph.<br><br>

			5. The undertaking shall disclose the following information:
			<ol class="slds-list--ordered">
				<li> whether the <b>sustainability statements</b> have been prepared on a consolidated or individual basis;</li>
				<li> for consolidated sustainability statements:</li>
					<ol class="slds-is-nested">
					<li> a confirmation that the scope of consolidation is the same as for the financial statements, or, where applicable, a declaration that the reporting undertaking is not required to draw-up financial statements or that the reporting undertaking is preparing consolidated sustainability reporting pursuant to Article 48i of Directive 2013/34/EU; and</li>
					<li> where applicable, an indication of which subsidiary undertakings included in the consolidation are exempted from individual or consolidated sustainability reporting pursuant to Articles 19a(9) or 29a(8) of Directive 2013/34/EU;</li>
					</ol>
				<li> to what extent the sustainability statements cover the undertaking’s upstream and downstream <b>value chain</b> (see ESRS 1 section 5.1 Reporting undertaking and value chain);</li>
				<li> whether the undertaking has used the option to omit a specific piece of information corresponding to intellectual property, know-how or the results of innovation (see ESRS1 section 7.7 Classified and sensitive information and information on intellectual property, know-how or results of innovation); and</li>
				<li> for undertakings based in an EU member state that allows for the exemption from disclosure of impending developments or matters in the course of negotiation, as provided for in articles 19a(3) and 29a(3) of Directive 2013/34/EU, whether the undertaking has used that exemption.</li>
			</ol>
			<br>
			</div>
		</details>
		
		<details>
            <summary> BP-2 </summary>
			<div id='divBP-2'>
				6. <b>The undertaking shall provide disclosures in relation to specific circumstances.</b><br><br>
				7. The objective of this Disclosure Requirement is to provide an understanding of the effect of these specific circumstances on the preparation of the <b>sustainability statements</b>.<br><br>
				8. The undertaking may report this information alongside the disclosures to which they refer.<br><br>

				<b>Time horizons</b><br>
				9. When the undertaking has deviated from the medium- or long-term time horizons defined by ESRS 1 section 6.4 Definition of short-, medium- and long-term for reporting purposes, it shall describe:
				<ol class="slds-list--ordered">
					<li> its definitions of medium- or long-term time horizons; and</li>
					<li> the reasons for applying those definitions.</li>
				</ol>
				<br>
				<b>Value chain estimation</b><br><br>
				10. When <b>metrics</b> include upstream and/or downstream <b>value chain</b> data estimated using indirect sources, such as sector-average data or other proxies, the undertaking shall:
				<ol class="slds-list--ordered">
					<li> identify the metrics;</li>
					<li> describe the basis for preparation;</li>
				    <li> describe the resulting level of accuracy; and</li>
					<li>where applicable, describe the planned <b>actions</b> to improve the accuracy in the future (see ESRS 1 chapter 5 Value chain).</li>
				</ol>
				<br>
				<b>Sources of estimation and outcome uncertainty</b><br><br>
				11. In accordance with ESRS 1 section 7.2 Sources of estimation and outcome uncertainty, the undertaking shall:
				<ol class="slds-list--ordered">
					<li> identify the quantitative <b>metrics</b> and monetary amounts it has disclosed that are subject to a high level of measurement uncertainty;</li>
					<li> in relation to each quantitative metric and monetary amount identified:</li>
					<ol class="slds-is-nested">
					    <li> disclose information about the sources of measurement uncertainty (for example, the dependence of the amount on the outcome of a future event, on a measurement technique or on the availability and quality of data from the entity’s upstream and/or downstream value chain); and</li>
						<li> disclose the assumptions, approximations and judgements the entity has made in measuring it.</li>	
					</ol>
				</ol>
				12. When disclosing forward-looking information, the undertaking may indicate that it considers such information to be uncertain.
				<br>
				
				<b>Changes in preparation or presentation of sustainability information</b><br><br>
				13. When changes in the preparation and presentation of sustainability information occur compared to the previous reporting period(s), (see ESRS 1 section 7.4 Changes in preparation or presentation in sustainability information), the undertaking shall:
				<ol class="slds-list--ordered">
					<li> explain the changes and the reasons for them, including why the replaced metric provides more useful information;</li>
					<li> disclose revised comparative figures, unless it is impracticable to do so. When it is impracticable to adjust comparative information for one or more prior periods, the undertaking shall disclose that fact; and</li>
					<li> disclose the difference between the figure disclosed in the preceding period and the revised comparative figure.</li>
				</ol>
				<br>
				<b>Reporting errors in prior periods</b><br><br>
				14. When the undertaking identifies material prior period errors (see ESRS 1 section 7.5 Reporting errors in prior periods), it shall disclose:
				<ol class="slds-list--ordered">
					<li> the nature of the prior period material error;</li>
					<li> to the extent practicable, the correction for each prior period included in the sustainability statement; and</li>
					<li> if correction of the error is not practicable, the circumstances that led to the existence of that condition.</li>
				</ol>
				<br>
				<b>Disclosures stemming from local legislations or generally accepted sustainability reporting pronouncements</b><br><br>
				15. When the undertaking includes in its <b>sustainability statement</b> information stemming from other legislation which requires the undertaking to disclose sustainability information or from generally accepted sustainability reporting standards and frameworks (see ESRS 1 section 8.2 Content and structure of the sustainability statement), in addition to the information prescribed by ESRS, it shall disclose this fact. In case of partial application of other reporting standards or frameworks, the undertaking shall provide a precise reference to the paragraphs of the standard or framework applied.<br><br>

				<b>Incorporation by reference</b><br><br>
				16. When the undertaking incorporates information by reference (see ESRS 1 section 9.1 Incorporation by reference), it shall disclose a list of the disclosure requirements of ESRS, or the specific datapoints mandated by a Disclosure Requirement, that have been incorporated by reference.<br><br>
			
			    <b>Use of phase-In provisions in accordance with Appendix C of ESRS 1</b><br><br>
				17. If an undertaking or group not exceeding on its balance sheet date the average number of 750 employees during the financial year decides to omit the information required by ESRS E4, ESRS S1, ESRS S2, ESRS S3 or ESRS S4 in accordance with Appendix C of ESRS 1, it shall nevertheless disclose whether the sustainability topics covered respectively by ESRS E4, ESRS S1, ESRS S2, ESRS S3 and ESRS S4 have been assessed to be material as a result of the undertaking’s materiality assessment. In addition, if one or more of these topics has been assessed to be material, the undertaking shall, for each material topic:
				<ol class="slds-list--ordered">
					<li>disclose the list of matters (i.e. topic, sub-topic or sub-sub-topic) in AR 16 ESRS 1 Appendix A that are assessed to be material and briefly describe how the undertaking’s <b>business model</b> and strategy take account of the impacts of the undertaking related to those matters. The undertaking may identify the matter at the level of topic, sub-topic or sub-sub-topic;</li>
					<li>briefly describe any time-bound <b>targets</b> it has set related to the matters in question, the progress it has made towards achieving those targets, and whether its targets related to <b>biodiversity</b> and <b>ecosystems</b> are based on conclusive scientific evidence;</li>
					<li>briefly describe its <b>policies</b> in relation to the matters in question;</li>
					<li>briefly describe <b>actions</b> it has taken to identify, monitor, prevent, mitigate, remediate or bring an end to actual or potential adverse impacts related to the matters in question, and the result of such actions; and</li>
					<li>disclose <b>metrics</b> relevant to the matters in question.</li>
				</ol>
				<br>
			</div>
		</details>

					<li> representation of <b>employees</b> and other workers;</li>

				22. The undertaking shall disclose the following information about the roles and responsibilities of the <b>administrative, management and supervisory bodies</b>:

					<li> how each body’s or responsibilities for impacts, risks and opportunities are reflected in the undertaking’s terms of reference, board mandates and other related <b>policies</b>;</li>

				24. <b>The undertaking shall disclose how the administrative, management and supervisory bodies are informed about sustainability matters and how these matters were addressed during the reporting period.</b><br><br>
				25. The objective of this Disclosure Requirement is to provide an understanding of how <b>administrative, management and supervisory bodies</b> are informed about <b>sustainability matters</b>, as well as what information and matters they addressed during the reporting period. This in turn allows an understanding of whether the members of these bodies were adequately informed and whether they were able to fulfil their roles.<br><br>

			43. <b>The undertaking shall disclose how the interests and views of its stakeholders are taken into account by the undertaking’s strategy and business model</b>.<br><br>
			44. The objective of this Disclosure Requirement is to provide an understanding of how <b>stakeholders</b>’ interests and views inform the undertaking’s strategy and <b>business model</b>.<br><br>
			45. The undertaking shall disclose a summarised description of:
			<ol class="slds-list--ordered">
				<li> its stakeholder engagement, including:</li>
					<ol class="slds-is-nested">
					<li>the undertaking’s key <b>stakeholder</b>;</li>
					<li>whether engagement with them occurs and for which categories of stakeholders;</li>
					<li>how it is organised;</li>
					<li>its purpose; and</li>
					<li>how its outcome is taken into account by the undertaking;</li>
					</ol>
				<li> the undertaking’s understanding of the interests and views of its key <b>stakeholders</b> as they relate to the undertaking’s strategy and <b>business model</b>, to the extent that these were analysed during the undertaking’s sustainability due diligence process(es) and/or <b>materiality</b> assessment process (see Disclosure Requirement IRO-1 of this Standard);</li>
				<li>where applicable, amendments to its strategy and/or business model, including:
					<ol class="slds-is-nested">
					<li>how the undertaking has amended or expects to amend its strategy and/or business model to address the interests and views of its stakeholders;</li>
					<li>any further steps that are being planned and in what timeline; and</li>
					<li>whether these steps are likely to modify the relationship with and views of stakeholders; and</li>
					</ol>
				</li>
				<li> whether and how the <b>administrative, management and supervisory bodies</b> are informed about the views and interests of affected <b>stakeholders</b> with regard to the undertaking’s sustainabilityrelated impacts.</li>
			</ol>
			<br>
			</div>
		</details>
		
		<details>
            <summary> SBM-3 </summary>
			<div id='divSBM-3'>
				46. <b>The undertaking shall disclose its material impacts, risks and opportunities and how they interact with its strategy and business model</b>.<br><br>
				47. The objective of this Disclosure Requirement is to provide an understanding of the material <b>impacts, risks</b> and <b>opportunities</b> as they result from the undertaking’s materiality assessment and how they originate from and trigger adaptation of the undertaking’s strategy and <b>business model</b> including its resources allocation. The information to be disclosed about the management of the undertaking’s material impacts, risks and opportunities is prescribed in topical ESRS and in sector-specific standards, which shall be applied in conjunction with the <b>Minimum Disclosure Requirements</b> on <b>policies, actions</b> and <b>targets</b> established in this standard.<br><br>
				48. The undertaking shall disclose:
					<ol class="slds-list--ordered">
				    <li> a brief description of its material <b>impacts, risks</b> and <b>opportunities</b> resulting from its materiality assessment (see Disclosure Requirement IRO-1 of this Standard), including a description of where in its business model, its own operations and its upstream and downstream <b>value chain</b> these material impacts, risks and opportunities are concentrated;</li>
					<li> the current and anticipated effects of its material impacts, risks and opportunities on its business model, value chain, strategy and decision-making, and how it has responded or plans to respond to these effects, including any changes it has made or plans to make to its strategy or business model as part of its <b>actions</b> to address particular material impacts or risks, or to pursue particular material opportunities;</li>
					<li>with reference to the undertaking’s material <b>impacts</b>:</li>
						<ol class="slds-is-nested">
						<li>how the undertaking’s material negative and positive impacts affect (or, in the case of potential impacts, are likely to affect) people or the environment;</li>
						<li>whether and how the impacts originate from or are connected to the undertaking's strategy and business model;</li>
						<li>the reasonably expected time horizons of the impacts; and </li>
						<li>. whether the undertaking is involved with the material impacts through its activities or because of its <b>business relationships</b>, describing the nature of the activities or business relationships concerned;</li>
						</ol>
					<li> the <b>current financial effects</b> of the undertaking’s material risks and opportunities on its financial position, financial performance and cash flows and the material risks and opportunities for which there is a significant risk of a material adjustment within the next annual reporting period to the carrying amounts of assets and liabilities reported in the related financial statements;</li>
					<li> the <b>anticipated financial effects</b> of the undertaking’s material risks and opportunities on its financial position, financial performance and cash flows over the short-, medium- and long-term, including the reasonably expected time horizons for those effects. This shall include how the undertaking expects its financial position, financial performance and cash flows to change over the short, medium- and long-term, given its strategy to manage risks and opportunities, taking into consideration:</li>
                        <ol class="slds-is-nested">
						<li> its investment and disposal plans (for example, capital expenditure, major acquisitions and divestments, joint ventures, business transformation, innovation, new business areas and asset retirements) including plans the undertaking is not contractually committed to; and</li>
						<li> its planned sources of funding to implement its strategy;</li>
                        </ol>
					<li> information about the resilience of the undertaking's strategy and business model regarding its capacity to address its material impacts and risks and to take advantage of its material opportunities. The undertaking shall disclose a qualitative and, when applicable, a quantitative analysis of the resilience, including how the analysis was conducted and the time horizons that were applied as defined in ESRS 1 (see ESRS 1 chapter 6 Time horizons). When providing quantitative information, the undertaking may disclose single amounts or ranges;</li>
					<li> changes to the material impacts, risks and opportunities compared to the previous reporting period; and</li>
					<li> a specification of those impacts, risks and opportunities that are covered by ESRS Disclosure Requirements as opposed to those covered by the undertaking using additional entity-specific disclosure.</li>
				</ol>
				<br>
				49. The undertaking may disclose the descriptive information required in paragraph 46 alongside the disclosures provided under the corresponding topical ESRS, in which case it shall still present a statement of its material <b>impacts, risks</b> and <b>opportunities</b> alongside its disclosures prepared under this chapter of ESRS 2.<br><br>
			</div>
		</details>
		
		<details>
            <summary> IRO-1 </summary>
			<div id='divIRO-1'>
				51. <b>The undertaking shall disclose its processes to identify its impacts, risks and opportunities and to assess which ones are material</b>.<br><br>
				52. The objective of this Disclosure Requirement is to provide an understanding of the process through which the undertaking identifies <b>impacts, risks</b> and <b>opportunities</b> and assesses their materiality, as the basis for determining the disclosures in its <b>sustainability statement</b> (see ESRS 1  chapter 3 and its related Application Requirements, which set out requirements and principles regarding the process to identify and assess material impacts, risks and opportunities based on the principle of double materiality). .<br><br>
				53. The undertaking shall disclose the following information:
				<ol class="slds-list--ordered">
					<li> a description of the methodologies and assumptions applied in the described processes;</li>
					<li> an overview of the process to identify, assess and prioritise the undertaking’s potential and actual <b>impacts</b> on people and the environment, informed by the undertaking’s due diligence process, including explanation of whether and how the process:</li>
					<ol class="slds-is-nested">
						<li> focusses on specific activities, business relationships, geographies or other factors that give rise to heightened risk of adverse impacts; </li>
						<li> considers the impacts with which the undertaking is involved through its own operations or as a result of its business relationships;</li>
						<li> includes consultation with affected <b>stakeholders</b> to understand how they may be impacted and with external experts;</li>
						<li> prioritises negative impacts based on their relative severity and likelihood, (see ESRS 1 section 3.4 Impact materiality) and, if applicable, positive impacts on their relative scale, scope and likelihood, and determines which sustainability matters are material for reporting purposes, including the qualitative or quantitative thresholds and other criteria used as prescribed by ESRS 1 section 3.4 Impact materiality;</li>
					</ol>
					<li> an overview of the process used to identify, assess and prioritise and monitor <b>risks</b> and <b>opportunities</b> that have or may have <b>financial effects</b>. The disclosure shall include:</li>
					<ol class="slds-is-nested">
						<li> how the undertaking has considered the connections of its impacts and dependencies with the risks and opportunities that may arise from those impacts and dependencies;</li>
						<li> how the undertaking assesses the likelihood, magnitude, and nature of effects of the identified risk and opportunities (such as the qualitative or quantitative thresholds and other criteria used as prescribed by ESRS 1 section 3.3 Financial materiality);</li>
						<li> how the undertaking prioritises sustainability-related risks relative to other types of risks, including its use of risk-assessment tools;</li>
					</ol>
					<li> a description of the decision-making process and the related internal control procedures;</li>
					<li> the extent to which and how the process to identify, assess and manage impacts and risks is integrated into the undertaking’s overall risk management process and used to evaluate the undertaking’s overall risk profile and risk management processes;</li>
					<li> the extent to which and how the process to identify, assess and manage opportunities is integrated into the undertaking’s overall management process where applicable; </li>
					<li> the input parameters it uses (for example, data sources, the scope of operations covered and the detail used in assumptions); and</li>
					<li> whether and how the process has changed compared to the prior reporting period, when the process was modified for the last time and future revision dates of the <b>materiality</b> assessment</li>
				</ol>
				<br>
			</div>
		</details>
		
		<details>
            <summary> IRO-2 </summary>
			<div id='divIRO-2'>
			54. <b>The undertaking shall report on the Disclosure Requirements complied with in its sustainability statements</b>.<br><br>
			
			55. The objective of this Disclosure Requirement is to provide an understanding of the Disclosure Requirements included in the undertaking’s sustainability statement and of the topics that have been omitted as not material, as a result of the <b>materiality</b> assessment.<br><br>
			
			56. The undertaking shall include a list of the Disclosure Requirements complied with in preparing the <b>sustainability statements</b>, following the outcome of the <b>materiality</b> assessment (see ESRS 1 chapter 3), including the page numbers and/or paragraphs where the related disclosures are located in the sustainability statements. This may be presented as a content index. The undertaking shall also include a table of all the datapoints that derive from other EU legislation as listed in Appendix B of this standard, indicating where they can be found in the sustainability statement and including those that the undertaking has assessed as not material, in which case the undertaking shall indicate “Not material” in the table in accordance with ESRS 1 paragraph<span class="tooltip-wrap"><sup>35</sup>&nbsp;
                <div class="tooltip-content">
				The objective of this Disclosure Requirement is to provide an understanding of the undertaking’s risk management and internal control processes in relation to sustainability reporting.
				</div> 
				</span>.<br><br>
			57. If the undertaking concludes that climate change is not material and therefore omits all disclosure requirements in ESRS E1 Climate change, it shall disclose a detailed explanation of the conclusions of its <b>materiality</b> assessment with regard to climate change (see ESRS 2 IRO- 2 Disclosure Requirements in ESRS covered by the undertaking’s sustainability statement), including a forward-looking analysis of the conditions that could lead the undertaking to conclude that climate change is material in the future.<br><br>
			58. If the undertaking concludes that a topic other than climate change is not material and therefore omits all the Disclosure Requirements in the corresponding topical ESRS, it may provide a brief explanation of the conclusions of its <b>materiality</b> assessment for that topic.<br><br>
			59. The undertaking shall provide an explanation of how it has determined the material information to be disclosed in relation to the <b>impacts, risks</b> and <b>opportunities</b> that it has assessed to be material, including the use of thresholds and/or how it has implemented the criteria in ESRS 1 section 3.2 Material matters and materiality of information.<br><br>
			
			<b>4.2 Minimum disclosure requirements on policies and actions</b><br><br>
			60. This section sets out <b>minimum disclosure requirements</b> to be included when the undertaking discloses information on its <b>policies</b> and <b>actions</b> to prevent, mitigate and remediate actual and potential material <b>impacts</b>, to address material <b>risks</b> and/or to pursue material <b>opportunities</b> (collectively, to “manage material <b>sustainability matters</b>”). They shall be applied together with the Disclosure Requirements, including Application Requirements, provided in the relevant and sector-specific ESRS. They shall also be applied when the undertaking prepares entity-specific disclosures.<br><br>
			
			61. The corresponding disclosures shall be located alongside disclosures prescribed by the relevant ESRS. When a single <b>policy</b> or same <b>actions</b> address several interconnected <b>sustainability matters</b>, the undertaking may disclose the required information in its reporting under one topical ESRS and cross reference to it in its reporting under other topical ESRS.<br><br>
			
			62. If the undertaking cannot disclose the information on <b>policies</b> and <b>actions</b> required under the relevant ESRS, because it has not adopted policies and/or actions with reference to the specific <b>sustainability matter</b> concerned, it shall disclose this to be the case, and provide reasons for not having adopted policies and/or actions. The undertaking may report a timeframe in which it aims to adopt them. <br><br>
			</div>
			</details>

		<details>
            <summary> MDR-P </summary>
			<div id='divDC-P'>
			63. The undertaking shall apply the <b>minimum disclosure requirements</b> defined in this provision when it discloses the <b>policies</b> it has in place with regard to each <b>sustainability matter</b> identified as material.<br><br>
			64. The objective of this <b>Minimum Disclosure Requirement</b> is to provide an understanding of the <b>policies</b> that the undertaking has in place to prevent, mitigate and remediate actual and potential <b>impacts</b>, to address <b>risks</b> and to pursue <b>opportunities</b>.<br><br>
			65. The undertaking shall disclose a <b>policies</b> adopted to manage material <b>sustainability matter</b>. The disclosure shall include the following information:
			<ol class="slds-list--ordered">
				<li> a description of the key contents of the <b>policy</b>, including its general objectives and which material <b>impacts, risks</b> or <b>opportunities</b> the policy is relate to and the process for monitoring;</li>
				<li> a description of the scope of the policy or of its exclusions, in terms of activities, upstream and/or downstream  <b>value chain</b>, geographies and if relevant, affected <b>stakeholder</b> groups;</li>
				<li> the most senior level in the undertaking’s organisation that is accountable for the implementation of the policy;</li>
				<li> a reference, if relevant, to the third-party standards or initiatives the undertaking commits to respect through the implementation of the policy;</li>
				<li> if relevant, a description of the consideration given to the interests of key <b>stakeholders</b> in setting the policy; and</li>
				<li> if relevant, whether and how the undertaking makes the policy available to potentially affected stakeholders, and stakeholders who need to help implement it.</li>
			</ol>
			<br>
			</div>
		</details>

		<details>
            <summary> MDR-A </summary>
			<div id='divDC-A'>
			66. The undertaking shall apply the requirements for the content of disclosures in this provision when it describes the <b>actions</b> through which it manages each material <b>sustainability matter</b> including action plans and resources allocated and/or planned. <br><br>
			67. The objective of this <b>Minimum Disclosure Requirement</b> is to provide an understanding of the key <b>actions</b> taken and/or planned to prevent, mitigate and <b>remediate</b> actual and potential <b>impacts</b>, and to address <b>risks</b> and <b>opportunities</b>, and where applicable achieve the objectives and <b>targets</b> of related <b>policies</b>.<br><br>
			68. Where the implementation of a <b>policy</b> requires <b>actions</b>, or a comprehensive action plan, to achieve its objectives, as well as when actions are implemented without a specific policy, the undertaking shall disclose the following information:
			<ol class="slds-list--ordered">
				<li> the list of key actions taken in the reporting year and planned for the future, their expected outcomes and, where relevant, how their implementation contributes to the achievement of policy objectives and <b>targets</b>;</li>
				<li> the scope of the key actions (i.e., coverage in terms of activities, upstream and/or downstream <b>value chain</b>, geographies and, where applicable, affected <b>stakeholder</b> groups);</li>
				<li> the time horizons under which the undertaking intends to complete each key action;</li>
				<li> if applicable, key actions taken (along with results) to provide for and cooperate in or support the provision of <b>remedy</b> for those harmed by actual material impacts;</li>
				<li> if applicable, quantitative and qualitative information regarding the progress of actions or action plans disclosed in prior periods.</li>
			</ol>
			<br>
			69. Where the implementation of an action plan requires significant operational expenditures (Opex) and/or capital expenditures (Capex) the undertaking shall:
			<ol class="slds-list--ordered">
				<li> describe the type of current and future financial and other resources allocated to the action plan, including if applicable, the relevant terms of sustainable finance instruments, such as green bonds, social bonds and green loans, the environmental or social objectives, and whether the ability to implement the actions or action plan depends on specific preconditions, e.g., granting of financial support or public policy and market developments;</li>
				<li> provide the amount of current financial resources and explain how they relate to the most relevant amounts presented in the financial statements; and</li>
				<li> provide the amount of future financial resources.</li>
			</ol>
			<br>
			</div>
		</details>

		<details>
            <summary> MDR-M </summary>
			<div id='divDC-M'>
			73. The undertaking shall apply the requirements for the content of disclosures in this provision when it discloses on the <b>metrics</b> it has in place with regard to each material <b>sustainability matter</b>.<br><br>
			74. The objective of this <b>Minimum Disclosure Requirement</b> is to provide an understanding of the <b>metrics</b> the undertaking uses to track the effectiveness of its <b>actions</b> to manage material <b>sustainability matters</b>.<br><br>
			75. The undertaking shall disclose any <b>metrics</b> that it uses to evaluate performance and effectiveness, in relation to a material <b>impact, risk</b> or <b>opportunity</b>.<br><br>
			76. <b>Metrics</b> shall include those defined in ESRS, as well as metrics identified on an entity-specific basis, whether taken from other sources or developed by the undertaking itself.<br><br>
			77. For each <b>metric</b>, the undertaking shall:
			<ol class="slds-list--ordered">
				<li> disclose the methodologies and significant assumptions behind the metric, including the limitations of the methodologies used;</li>
				<li> disclose whether the measurement of the metric is validated by an external body other than the assurance provider and, if so, which body; </li>
				<li> label and define the metric using meaningful, clear and precise names and descriptions;</li>
				<li> when currency is specified as the unit of measure, use the presentation currency of its financial statements</li>
			</ol>
			<br>
			</div>
		</details>

		<details>
            <summary> MDR-T </summary>
			<div id='divDC-T'>
			78. The undertaking shall apply the requirements for the content of disclosures in this provision when it discloses information about the <b>targets</b> it has set with regard to each material <b>sustainability matter</b>.<br><br>
			79. The objective of this <b>Minimum Disclosure Requirement</b> is to provide for each material <b>sustainability matter</b> an understanding of:
			<ol class="slds-list--ordered">
				<li> whether and how the undertaking tracks the effectiveness of its <b>actions</b> to address material <b>impacts, risks</b> and <b>opportunities</b>, including the <b>metrics</b> it uses to do so;</li>
				<li> measurable time-bound outcome-oriented <b>targets</b> set by the undertaking to meet the <b>policy</b>’s objectives, defined in terms of expected results for people, the environment or the undertaking regarding material impacts, risks and opportunities;</li>
				<li> the overall progress towards the adopted targets over time;</li>
				<li> in the case that the undertaking has not set measurable time-bound outcome-oriented targets, whether and how it nevertheless tracks the effectiveness of its actions to address material impacts, risks and opportunities and measures the progress in achieving its <b>policy</b> objectives; and </li>
				<li> whether and how <b>stakeholders</b> have been involved in target setting for each material sustainability matter.</li>
			</ol>
			<br>
			80. The undertaking shall disclose any measurable, outcome-oriented and time-bound <b>targets</b> on material <b>sustainability matters</b> it has set to assess progress. For each target, the disclosure shall include the following information:
			<ol class="slds-list--ordered">
				<li> a description of the relationship of the target to the <b>policy</b> objectives;</li>
				<li> the defined target level to be achieved, including, where applicable, whether the target is absolute or relative and in which unit it is measured;</li>
				<li> the scope of the target, including the undertaking’s activities and/or its upstream and/or downstream <b>value chain</b> where applicable and geographical boundaries;</li>
				<li> the baseline value and base year from which progress is measured;</li>
				<li> the period to which the target applies and if applicable, any milestones or interim targets;</li>
				<li> the methodologies and significant assumptions used to define targets, including where applicable, the selected <b>scenario</b>, data sources, alignment with national, EU or international policy goals and how the targets consider the wider context of sustainable development and/or local situation in which impacts take place;</li>
				<li> whether the undertaking’s targets related to environmental matters are based on conclusive scientific evidence;</li>
				<li> whether and how <b>stakeholders</b> have been involved in target setting for each material sustainability matter;</li>
				<li> any changes in targets and corresponding <b>metrics</b> or underlying measurement methodologies, significant assumptions, limitations, sources and processes to collect data adopted within the defined time horizon. This includes an explanation of the rationale for those changes and their effect on comparability (see Disclosure Requirement BP-2 Disclosures in relation to specific circumstances of this [draft] Standard); and</li>
				<li> the performance or overall progress against its disclosed targets, including information on how the target is monitored and reviewed, whether the progress is in line with what had been initially planned, and an analysis of trends or significant changes in the performance of the undertaking towards achieving the target.</li>
				</ol>
				<br>
			81. If the undertaking has not adopted any measurable outcome-oriented <b>targets</b>:
				<ol class="slds-list--ordered">
					<li> it may disclose whether such targets will be set and the timeframe for setting them, or the reasons why the undertaking does not plan to set such targets;</li>
					<li> it shall disclose whether it nevertheless tracks the effectiveness of its <b>policies</b> and <b>actions</b> in relation to the material sustainability-related <b>impact, risk</b> and <b>opportunity</b>, and if so:</li>
						<ol class="slds-is-nested">
						<li> any processes through which it does so;</li>
						<li> the defined level of ambition to be achieved and any qualitative or quantitative indicators it uses to evaluate progress, including the base period from which progress is measured.</li>
						</ol>
				</ol>
				<br>
			</div>
			</details>
	</div>	
	</details>

	<details>
        <summary>Application Requirements</summary>
    <div>
		<details>
            <summary> BP-1 </summary>
			<div id='divBP-1AR'>
			AR 1. When describing to what extent the <b>sustainability statements</b> cover the undertaking’s upstream and downstream <b>value chain</b> (see ESRS 1 section 5.1 Reporting undertaking and value chain), the undertaking may distinguish between:
			<ol class="slds-list--ordered">
				<li> the extent to which its <b>materiality</b> assessment of <b>impacts, risks</b> and <b>opportunities</b> extends to its upstream and/or downstream value chain;</li>
				<li> the extent to which its <b>policies, actions</b> and <b>targets</b> extend to its value chain; and</li>
				<li> the extent to which it includes upstream and/or downstream value chain data in disclosing on <b>metrics</b>.</li>
			</ol>
			<br>
			</div>
		</details>
		<details>
            <summary> BP-2 </summary>
			<div id='divBP-2AR'>
			AR 2. The undertaking may disclose whether it relies on any European standards approved by the European Standardisation System (ISO/IEC or CEN/CENELEC standards), as well as the extent to which data and processes that are used for sustainability reporting purposes have been verified by an external assurance provider and found to conform to the corresponding ISO/IEC or CEN/CENELEC standard.
			</div>
		</details>	
		<details>
            <summary> GOV-1 </summary>
			<div id='divGOV-1AR'>
			AR 3. In describing the roles and responsibilities of the <b>administrative, management and supervisory bodies</b> with regard to <b>sustainability matters</b>, the undertaking may specify:
			<ol class="slds-list--ordered">
				<li> the aspects of sustainability over which oversight is exercised, with regard to the environmental, social and governance matters the undertaking may be facing, including:</li>
				<ol class="slds-is-nested">
					<li> any assessment of and changes to sustainability-related aspects of the undertaking’s strategy and <b>business model</b>;</li>
					<li> the identification and assessment of material <b>risks, opportunities</b> and <b>impacts</b>;</li>
					<li> related <b>policies</b> and <b>targets</b>, action plans and dedicated resources; and</li>
					<li> sustainability reporting;</li>
				</ol>
				<li> the form such oversight takes for each of the above aspects: i.e., information, consultation or decision-making; and</li>
				<li> the way such oversight is organised and formalised, i.e., processes by which the administrative, management and supervisory bodies engage with these aspects of sustainability.</li>
			</ol>
			<br>

			AR 4. In describing the undertaking’s organisation of governance regarding <b>sustainability matters</b>, a description of complex governance structure may be complemented by their presentation in the form of a diagram.<br><br>

			AR 5. The description of the level of expertise or access to expertise of the <b>administrative, management and supervisory bodies</b> may be substantiated by illustrating the composition of the bodies, including members on whom these bodies rely for expertise to oversee <b>sustainability matters</b>, and how they leverage that expertise as a body. In the description, the undertaking shall consider how the expertise and skills are relevant to the undertaking’s material <b>impacts, risks</b> and <b>opportunities</b> and whether the bodies and/or its members have access to other sources of expertise, such as specific experts and <b>training</b> and other educational initiatives to update and develop sustainability-related expertise within these bodies.<br><br>
			</div>
		</details>
		
		<details>
            <summary> GOV-2 </summary>
			<div id='divGOV-2AR'>
			AR 6. Depending on the undertaking’s structure, the <b>administrative, management and supervisory bodies</b> may focus on overarching <b>targets</b>, while management focuses on the more detailed targets. In this case, the undertaking may disclose on how the governance bodies ensures that an appropriate mechanism for performance monitoring is in place.<br><br>
			</div>
		</details>
		
		<details>
            <summary> GOV-3 </summary>
			<div id='divGOV-3AR'>
			AR 7. For listed undertakings, this Disclosure Requirement should be consistent with the remuneration report prescribed in articles 9a and 9b of the Directive 2007/36/EC on the exercise of certain rights of shareholders in listed companies. Subject to the provisions of ESRS 1, paragraphs 119, 120 and 122, a listed undertaking may make a reference to its remuneration report..<br><br>
			</div>
		</details>
		
		<details>
            <summary> GOV-4 </summary>
			<div id='divGOV-4AR'>
			AR 8. The mapping required by paragraph&nbsp;<a class="tooltip-wrap">30&nbsp;
				<div class="tooltip-content">
				The undertaking shall disclose a mapping of the information provided in its sustainability statement about the due diligence process.
				</div> 
			</a>may be presented in the form of a table, cross-referencing the core elements of due diligence, for impacts on people and the environment, to the relevant disclosures in the undertaking’s <b>sustainability statements</b>, as set out below. <br><br>

			AR 9. The undertaking may include additional columns to the table below to clearly identify those disclosures that relate to impacts on people and/or the environment given that, in some cases, more than one disclosure may provide information about the same due diligence step.<br><br>

			AR 10. The main references in the international instruments of the UN Guiding Principles on Business and Human Rights and the OECD Guidelines for Multinational Enterprises to the core elements of the due diligence process are listed in ESRS 1 chapter 4.
			<br><br>
			<b>
			<table>
				<tr>
					<th><b>CORE ELEMENTS OF DUE DILIGENCE</b></th>
					<th><b>PARAGRAPHS IN THE SUSTAINABILITY STATEMENTS</b></th>
				</tr>
				
				<tr>
					<td><b>a) Embedding due diligence in governance, strategy and business model</b></td>

			AR 14. In preparing disclosures relating to its <b>business model</b> and <b>value chain</b>, the undertaking shall consider:
			<ol class="slds-list--ordered">
				<li> its key activities, resources, distribution channels and customer segments;</li>
				<li> its key <b>business relationships</b>, and their key characteristics,  including relationships with customers and <b>suppliers</b>;</li>
				<li> the cost structure and revenue of its business segments, in line with IFRS 8 disclosure requirements in the financial statements, where applicable;</li>
				<li> the potential <b>impacts, risks</b> and <b>opportunities</b> in its significant sector(s) and their possible relationship to its own <b>business model</b> or <b>value chain</b>.</li>

			AR 15. Contextual information may be particularly relevant for users of the undertaking’s sustainability reporting, to understand to what extent the reported disclosures include upstream and/or downstream <b>value chain</b> information. The description of the main features of the upstream and/or downstream value chain and where applicable the identification of key value chains should support an understanding of how the undertaking applies the requirements of ESRS 1 chapter 5 and the <b>materiality</b> assessment performed by the undertaking in line with ESRS 1 chapter 3. The description may provide a high-level overview of the key features of upstream and/or downstream value chain entities indicating their relative contribution to the undertaking’s performance and positions and explaining how they contribute to the value creation of the undertaking.<br><br>

			AR 16. The views and interests of <b>stakeholders</b> that are expressed as part of the undertaking’s engagement with stakeholders through its due diligence process may be relevant to one or more aspects of its strategy or business model. As such, they may affect the undertaking’s decisions regarding the future direction of the strategy or business model.<br><br>
			</div>
		</details>	
		
		<details>
            <summary> SBM-3 </summary>
			<div id='divSBM-3AR'>
			AR 17. When describing where in its upstream and/or downstream <b>value chain</b> material <b>impacts, risks</b> and <b>opportunities</b> are concentrated, the undertaking shall consider: geographical areas, facilities or types of assets, inputs, outputs and distribution channels.<br><br>

			AR 18. This disclosure may be expressed in terms of a single <b>impact, risk,</b> or <b>opportunity</b> or by aggregating groups of material impacts, risks and opportunities, when this provides more relevant information and does not obscure material information. <br><br>
			</div>
		</details>
		
		<details>
            <summary> IRO-2 </summary>
			<div id='divIRO-2AR'>
			AR 19. Notwithstanding the basis for the presentation of the information about <b>sustainability matters</b> included in ESRS 1 chapter 8 Structure of sustainability statements, the undertaking may disclose the list of the Disclosure Requirements complied with in preparing the <b>sustainability statements</b> (see paragraph&nbsp;<a class="tooltip-wrap">54
				<div class="tooltip-left">
				The undertaking shall report on the Disclosure Requirements complied with in its sustainability statements.
				</div> 
				</a>) in the general information part or in other parts of the sustainability statement as it deems appropriate. The undertaking may use a content index, i.e., a tabular list of the Disclosure Requirements included in the sustainability statements, with the indication of where they are located (page/paragraphs). <br><br>
			</div>
		</details>
		
		<details>
            <summary> MDR-P </summary>
			<div id='divDC-PAR'>
			AR 20. Due to the interdependency between impacts on people and the environment, <b>risks</b> and <b>opportunities</b>, a single <b>policy</b> may apply to several material <b>sustainability matters</b>, including matters addressed by more than one topical ESRS. For example, if a single policy covers both an environmental matter and a social matter, the undertaking may report on the policy in the environmental section of its <b>sustainability statements</b>. In this case, it should include in the social section is a cross-reference to the environmental section where the policy is reported. Equally a policy may be reported in the social section with a cross-reference to it in the environmental section.<br><br>

			AR 21. The description of the scope of the <b>policy</b> may explain which activities and/or segments of the undertaking’s own operations or upstream and downstream <b>value chain</b> it concerns. The description may also explain further boundaries relevant to the specific topic or the undertaking’s circumstances, which may include geographies, life cycles, etc. In certain cases, such as if the policy does not cover the full value chain, the undertaking may provide clear information regarding the extent of the value chain covered by the policy.<br><br>
			</div>
		</details>
		
		<details>
            <summary> MDR-A </summary>
			<div id='divDC-AAR'>
			AR 22. Key <b>actions</b> in the context of this <b>Minimum Disclosure Requirement</b> are those actions that materially contribute to achieving the undertakings objectives in addressing material <b>impacts, risks</b> and <b>opportunities</b>. For reasons of understandability, key actions may be aggregated where appropriate. <br><br>

			AR 23. Information on resource allocation may be presented in the form of a table and broken down between capital expenditures and operating expenditures, and across the relevant time horizons, and between resources applied in the current reporting year, and for the planned allocation of resources over specific time horizons.<br><br>
			</div>
		</details>
		
		<details>
            <summary> MDR-T </summary>
			<div id='divDC-TAR'>
			AR 24. When setting <b>targets</b> related to the prevention or mitigation of environmental impacts, the undertaking shall prioritise targets related to the reduction of the impacts in absolute terms rather than in relative terms. When targets address the prevention or mitigation of social impacts, they may be specified in terms of the effects on human rights, welfare or positive outcomes for affected <b>stakeholders</b>.<br><br>

			AR 25. The information on progress made towards achieving the <b>targets</b> may be presented in a comprehensive table, including information on the baseline and target value, milestones, and achieved performance over the prior periods.<br><br>

			AR 26. Where the undertaking describes progress in achieving the objectives of a <b>policy</b> in the absence of a measurable target, it may specify a baseline against which the progress is considered. For example, the undertaking may assess an increase of <b>wages</b> by a certain percentage for those below a fair wage; or may assess the quality of its relationships with local communities by reference to the proportion of issues raised by communities that were resolved to their satisfaction. The baseline and the assessment of the progress shall be related to the <b>impacts, risks</b> and <b>opportunities</b> which underpin the <b>materiality</b> of the matter addressed by the policy.<br><br>
			</div>
		</details>
