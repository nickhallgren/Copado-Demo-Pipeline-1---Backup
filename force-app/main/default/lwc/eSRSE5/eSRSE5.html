    <summary>Objective</summary>
         <div>
            1. The objective of this Standard is to specify Disclosure Requirements which will enable users of the <b>sustainability statement</b> to understand:
        <ol class="slds-list--ordered">
            <li>how the undertaking affects resource use, including resource efficiency, avoiding the depletion of resources and the sustainable sourcing and use of renewable resources (referred to in this Standard as “resource use and circular economy”) in terms of material positive and negative actual or potential <b>impacts</b>;</li>
            <li>any <b>actions</b> taken, and the result of such actions, to prevent or mitigate actual or potential negative impacts arising from resource use, including its measures to help decoupling its economic growth from the use of materials, and to address risks and opportunities;</li>
            <li>the plans and capacity of the undertaking to adapt its strategy and <b>business model</b> in line with <b>circular economy principles</b> including but not limited to minimising <b>waste</b>, maintaining the value of products, materials and other resources at their highest value and enhancing their efficient use in production and consumption;</li>
            <li>the nature, type and extent of the undertaking’s material risks and opportunities related to the undertaking’s impacts and <b>dependencies</b>, arising from resource use and circular economy, and how the undertaking manages them; and</li>
            <li>the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of material risks and opportunities arising from the undertaking’s impacts and dependencies on resource use and circular economy.</li>
        </ol>
        <br>
        2. This Standard sets out Disclosure Requirements related to “resource use” and “circular economy” and in particular on:
         <ol class="slds-list--ordered">
            <li><b>resource inflows</b> including the circularity of material resource inflows, considering renewable and non-renewable resources; and</li>
            <li><b>resource outflows</b> including information on products and materials; and</li>
            <li><b>waste</b>.</li>
            </ol>
           <br> 
        3. <b>Circular economy</b> means an economic system in which the value of products, materials and other resources in the economy is maintained for as long as possible, enhancing their efficient use in production and consumption, thereby reducing the environmental impact of their use, minimising <b>waste</b> and the release of hazardous <b>substances</b> at all stages of their life cycle, including through the application of the <b>waste hierarchy</b>. The goal is to maximise and maintain the value of the technical and biological resources, products and materials by creating a system that allows for <b>durability</b>, optimal use or re-use, refurbishment, remanufacturing, <b>recycling</b> and nutrient cycling.<br><br>
        4. This Standard builds on relevant existing EU legislative frameworks and <b>policies</b> including the EU Circular Economy Action Plan, Directive 2008/98/EC of the European Parliament and of the Council<span class="tooltip-wrap"><sup>90</sup>&nbsp;
            <div class="tooltip-content">
             Directive 2008/98/EC of the European Parliament and of the Council of 19 November 2008 on waste and repealing certain Directives (OJ L 312, 22.11.2008, p. 3).
			 </div> 
			</span> (Waste Framework Directive) and the EU industrial strategy.<br><br>
        5. To evaluate the transition from business as usual, meaning an economy in which finite resources are extracted to make products that are used and then thrown away (“take-makewaste”), to a circular economic system, this Standard relies on the identification of the physical flows of resources, materials and products used and generated by the undertaking through Disclosure Requirement E5-4 Resource inflows and Disclosure Requirement E5-5 Resource outflows.<br><br>
        
        <b>Interactions with other ESRS</b><br>

        6. Resource use is a major driver of other environmental impacts such as climate change, <b>pollution</b>, water and <b>marine resources</b> and biodiversity. A <b>circular economy</b> is a system that tends towards sustainable use of resources in extraction, processing, production, consumption and management of <b>waste</b>. Such system brings multiple environmental benefits, in particular, the reduction of material and energy consumption and <b>emissions</b> into the air (greenhouse gas emissions or other pollution), the limitation of <b>water withdrawals</b> and <b>discharges</b> and the <b>regeneration</b> of nature limiting the impacton biodiversity.<br><br>
        7. To provide a comprehensive overview of which aspects of other environmental matters could be material to resource use and circular economy, relevant disclosure requirements are covered in other environmental ESRS as follows:
        <ol class="slds-list--ordered">
         <li>ESRS E1 Climate change, which addresses, in particular, GHG <b>emissions</b> and energy resources (energy consumption);</li>
         <li>ESRS E2 Pollution, which addresses, in particular, emissions to water, air and <b>soil</b> as well as <b>substances of concern</b>;</li>
         <li>ESRS E3 Water and marine resources, which addresses, in particular, water resource (water consumption) and marine resources; and</li>
         <li>ESRS E4 Biodiversity and ecosystems, which addresses, in particular,ecosystems and species and raw materials.</li>
        </ol><br>
        8. The undertaking’s impacts related to resource use and circular economy, in particular impacts related to <b>waste</b>, can affect people and communities. Material negative impacts on <b>affected communities</b> from resource use and <b>circular economy</b> attributable to theundertaking are covered in ESRS S3 Affected communities. The efficient and circular use of resources also benefits competitiveness and economic wellbeing.<br><br>
        9. This Standard should be read in conjunction with ESRS 1 General requirementsand ESRS 2 General disclosures.<br><br>
