<template>
    <template if:true={isFormLoadingComplete}>
        <template if:true={showForm}>
            <lightning-card title={label.NZC_LWC_Card_Title} style="position: relative">
                <!-- <div if:true={showSpinner}>
                    <lightning-spinner variant="brand" class="slds-is-fixed"
                        alternative-text="Loading"></lightning-spinner>
                </div> -->
                <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                    <template for:each={dataFromApex} for:item="element">
                        <lightning-accordion-section key={element.scopeLabel} name={element.scopeLabel}
                            label={element.scopeLabel}>
                            <template for:each={element.fuelTypesList} for:item="singleType">
                                <c-create-energy-use-records-child-o-l-d key={singleType.uOMLabel} unique-stamp={uniquestamp}
                                    declaration-accept={declarationaccepted} record-id-from-parent={recordIdInParent}
                                    fuel-type-details={singleType} onrecordcreate={handleChildRecordCreation}></c-create-energy-use-records-child-o-l-d>
                            </template>
                        </lightning-accordion-section>
                    </template>
                </lightning-accordion>
                <div class="slds-m-around_medium slds-p-left_small">
                    <lightning-input type="checkbox" class="" label={label.NZC_Declaration_Message} name="declaration"
                        onchange={handleDeclarationChange}></lightning-input>
                </div>
                <div class="slds-m-around_medium slds-p-left_small slds-p-top_medium">
                    <lightning-button variant="brand" label={label.NZC_Submit} onclick={handleSubmit}
                        disabled={checkdeclaration}></lightning-button>
                </div>
            </lightning-card>
        </template>

        <template if:true={showSuccessMessage}>
            <lightning-card class="cardColor">
                <div class="slds-m-around_medium slds-align_absolute-center">
                    <lightning-formatted-text value={label.NZC_Success_Message}
                        style="color: #265e20; font-size: 14px;">
                    </lightning-formatted-text>
                </div>
            </lightning-card>
        </template>

        <template if:false={approvedEmissionFactorsFound}>
            <lightning-card class="cardColor">
                <div class="slds-m-around_medium slds-align_absolute-center">
                    <lightning-formatted-text value={label.NZC_Emission_Factor_Not_Approved_Error_Message} style="color: #fa0000; font-size: 14px;">
                    </lightning-formatted-text>
                </div>
            </lightning-card>
        </template>
    </template>
    <template if:true={showSpinner}>
        <lightning-card class="cardColor">
            <div class="slds-m-around_medium">
                <lightning-spinner variant="brand" class="slds-is-fixed" alternative-text="Loading"></lightning-spinner>
            </div>
        </lightning-card>
    </template>
</template>
