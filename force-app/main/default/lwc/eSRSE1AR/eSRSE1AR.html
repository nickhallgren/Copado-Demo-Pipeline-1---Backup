        AR 32. When preparing the information on energy consumption required under paragraph&nbsp;<a class="tooltip-wrap">35
            <div class="tooltip-content">
              <b>The undertaking shall provide information on its energy consumption and mix</b>.
            </div></a>, the undertaking shall:
		<ol class="slds-list--ordered">
            <li>only report energy consumed from processes owned or controlled by the undertaking applying the same perimeter applied for reporting GHG Scopes 1 and 2 emissions;</li>
            <li>exclude feedstocks and fuels that are not combusted for energy purposes. The undertaking that consumes fuel as feedstocks can disclose information on this consumption separately from the required disclosures;</li>
            <li>ensure all quantitative energy-related information is reported in either Mega-Watt-hours (MWh) in Lower Heating Value or net calorific value. If raw data of energy-related information is only available in energy units other than MWh (such as Giga-Joules (GJ) or British Thermal Units (Btu)), in volume units (such as cubic feet or gallons) or in mass units (such as kilograms or pounds), they shall be converted to MWh using suitable conversion factors (see for example Annex II of the Fifth Assessment IPCC report). Conversion factors for fuels shall be made transparent and applied in a consistent manner;</li>
            <li>ensure all quantitative energy-related information is reported as final energy consumption, referring to the amount of energy the undertaking actually consumes using for example the table in Annex IV of Directive 2012/27 of the European Parliament and of the Council<sup>55</sup>&nbsp;
           <div class="tooltip-content">
            Directive 2012/27/EU of the European Parliament and of the Council of 25 October 2012 on energy efficiency, amending Directives 2009/125/EC and 2010/30/EU and repealing Directives 2004/8/EC and 2006/32/EC (OJ L 315, 14.11.2012, p. 1).
            </div>on energy efficiency;</li>
            <li>avoid double counting fuel consumption when disclosing self-generated energy consumption. If the undertaking generates electricity from either a non-renewable or renewable fuel source and then consumes the generated electricity, the energy consumption shall be counted only once under fuel consumption;</li>
            <li>not offset energy consumption even if on<b>site</b> generated energy is sold to and used by a third party;</li>
            <li>not count energy that is sourced from within the organisational boundary under “purchased or acquired” energy;</li>
            <li>account for steam, heat or cooling received as “waste energy” from a third party’s industrial processes under “purchased or acquired” energy;</li>
            <li>account for renewable hydrogen<span class="tooltip-wrap"><sup>56</sup>&nbsp;<div class="tooltip-content">

        <li>the numerator and denominator shall only consist of the proportion of the total final energy consumption (in the numerator) and net revenue (in the denominator) that are attributable to activities in <b>high climate impact sectors</b>. In effect, there should be consistency in the scope of both the numerator and denominator;</li>

        AR 39. When preparing the information for reporting GHG <b>emissions</b> as required by paragraph&nbsp;<a class="tooltip-wrap">44
            <div class="tooltip-content">
              44. The undertaking shall disclose  in metric tonnes of CO2eq its:
		<ol class="slds-list--ordered">
        <li><b>gross Scope 1 GHG emissions</b>;</li>
        <li><b>gross Scope 2 GHG emissions</b>;</li>
        <li><b>gross Scope 3 GHG emissions; and</b></li>
        <li><b>total GHG emissions.</b></li>
		</ol>
            </div> </a>, the undertaking shall:
		<ol class="slds-list--ordered">
        <li>consider the principles, requirements and guidance provided by the GHG Protocol Corporate Standard (version 2004). The undertaking may consider Commission Recommendation (EU) 2021/227958 or the requirements stipulated by EN ISO 14064-1:2018. If the undertaking already applies the GHG accounting methodology of ISO 14064- 1: 2018, it shall nevertheless comply with the requirements of this standard (e.g., regarding reporting boundaries and the disclosure of market-based Scope 2 GHG emissions);</li>
        <li>disclose the methodologies, significant assumptions and emissions factors used to calculate or measure GHG emissions accompanied by the reasons why they were chosen, and provide a reference or link to any calculation tools used;</li>
        <li>include emissions of CO2, CH4, N2O, HFCs, PFCs, SF6, and NF3. Additional GHG may be considered when significant; and</li>
        <li>use the most recent <b>Global Warming Potential (GWP)</b> values published by the IPCC based on a 100-year time horizon to calculate CO2eq emissions of non-CO2 gases.</li>
		</ol><br>

        AR 40. When preparing the information for reporting GHG emissions from its associates, joint ventures, unconsolidated subsidiaries (investment entities) and contractual arrangements as required by paragraph 50, the undertaking shall consolidate 100% of the GHG emissions of the entities it operationally controls. In practice, this happens when the undertakings holds the license - or permit - to operate the assets from these associates, joint ventures, unconsolidated subsidiaries (investment entities) and contractual arrangements. When the undertaking has a contractually defined part-time operational control, it shall consolidate 100% the GHG emitted during the time of its operational control.<br><br>
        AR 41. In line with ESRS 1 chapter 3.7, the undertaking shall disaggregate information on its GHG emissions as appropriate. For example, the undertaking may disaggregate its Scope 1, 2, 3, or total GHG <b>emissions</b> by country, operating segments, economic activity, subsidiary, GHG category (CO2, CH4, N2O, HFCs, PFCs, SF6, NF3, and other GHG considered by the undertaking) or source type (stationary combustion, mobile combustion, process emissions and fugitive emissions).<br><br>
        AR 42. An undertaking might have a different reporting period from some or all of the entities in its value chain. In such circumstances, the undertaking is permitted to measure its GHG emissions in accordance with paragraph 44 using information for reporting periods that are different from its own reporting period if that information is obtained from entities in its value chain with reporting periods that are different from the undertaking’s reporting period, on the condition that:<br>

        AR 45. When preparing the information on gross Scope 2 GHG emissions required under paragraph&nbsp;<a class="tooltip-wrap">49

        <li>include <b>purchased or acquired electricity, steam, heat, and cooling</b> consumed by the undertaking;</li>

    <b><i>GHG removals and storage in own operations and the upstream and downstream value chain</i></b><br><br>

    AR 56. In addition to their GHG emission inventories, undertakings shall provide transparency on how and to what extent they either enhance natural sinks or apply technical solutions to remove GHGs from the atmosphere in their own operations and upstream and downstream value chain. While there are no generally accepted concepts and methodologies for accounting for GHG removals, this Standard aims to increase transparency on the undertaking’s efforts to remove GHGs from the atmosphere (paragraphs&nbsp;<a class="tooltip-wrap">56(a)&nbsp;
        <div class="tooltip-content">GHG removals and storage in metric tonnes of CO2eq resulting from projects it may have developed in its own operations, or contributed to in its upstream and downstream value chain; and
        </div></a>and&nbsp;<a class="tooltip-wrap">58&nbsp;
        <div class="tooltip-content">The disclosure on GHG removals and storage required by paragraph 56(a) shall include, if applicable:
              <ol class="slds-list--ordered">
              <li>the total amount of GHG removals and storage in metric tonnes of CO2eq disaggregated and separately disclosed for the amount related to the undertaking’s own operations and its upstream and downstream value chain, and broken down by removal activity; and </li>
              <li>the calculation assumptions, methodologies and frameworks applied by the undertaking.</li>
              </ol>
        </div> 
      </a>. The GHG removals outside the <b>value chain</b> that the undertaking supports through the purchase of <b>carbon credits</b> are to be disclosed separately as required by paragraphs&nbsp;<a class="tooltip-wrap">56(b)&nbsp;
        <div class="tooltip-content">The amount of GHG emission reductions or removals from climate change mitigation projects outside its value chain it has financed or intends through any purchase of carbon credits.
        </div></a>and&nbsp;<a class="tooltip-wrap">59
        <div class="tooltip-content">
           The disclosure on carbon credits required by paragraph 56(b) shall include, if applicable:
              <ol class="slds-list--ordered">
              <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq that are verified against recognised quality standards and cancelled in the reporting period; and</li>
              <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq planned to be cancelled in the future based on existing contractual agreements or not.</li>
              </ol>
        </div></a>.<br><br>

    AR 57. When disclosing the information on <b>GHG removals and storage</b> from the undertaking’s own operations and its  upstream and donwstream <b>value chain</b> required under paragraphs&nbsp;<a class="tooltip-wrap">56(a)&nbsp;
        <div class="tooltip-content">GHG removals and storage in metric tonnes of CO2eq resulting from projects it may have developed in its own operations, or contributed to in its upstream and downstream value chain; and
        </div> </a>and&nbsp;<a class="tooltip-wrap">58&nbsp;
        <div class="tooltip-content">
           The disclosure on GHG removals and storage required by paragraph 56(a) shall include, if applicable:
              <ol class="slds-list--ordered">
              <li>the total amount of GHG removals and storage in metric tonnes of CO2eq disaggregated and separately disclosed for the amount related to the undertaking’s own operations and its upstream and downstream value chain, and broken down by removal activity; and </li>
              <li>the calculation assumptions, methodologies and frameworks applied by the undertaking.</li>
              </ol>
        </div></a>, for each removal and storage activity, the undertaking shall describe:
	<ol class="slds-list--ordered">
        <li>the GHGs concerned;</li>
        <li>whether removal and storage are biogenic or from <b>land use change</b> (e.g., afforestation, reforestation, forest restoration, urban tree planting, agroforestry, building <b>soil</b> carbon, etc.), technological (e.g., direct air capture), or hybrid (e.g., bioenergy with CO2 capture and storage) and technological details about the removal, the type of storage and, if applicable, the transport of removed GHGs;</li>
        <li>if applicable, a brief explanation of whether the activity qualifies as a nature-based solution; and</li>
        <li>how the risk of non-permanence is managed, including determining and monitoring leakage and reversal events, as appropriate.</li>
	</ol><br>

    <i>Calculation guidance</i>
	<br><br>

    AR 58. When preparing the information on <b>GHG removals and storage</b> from the undertaking’s own operations and its upstream and donwstream <b>value chain</b> required under paragraphs&nbsp;<a class="tooltip-wrap">56(a)&nbsp;
        <div class="tooltip-content">GHG removals and storage in metric tonnes of CO2eq resulting from projects it may have developed in its own operations, or contributed to in its upstream and downstream value chain; and
        </div></a>and&nbsp;<a class="tooltip-wrap">58&nbsp;
        <div class="tooltip-content">The disclosure on GHG removals and storage required by paragraph 56(a) shall include, if applicable:
              <ol class="slds-list--ordered">
              <li>the total amount of GHG removals and storage in metric tonnes of CO2eq disaggregated and separately disclosed for the amount related to the undertaking’s own operations and its upstream and downstream value chain, and broken down by removal activity; and </li>
              <li>the calculation assumptions, methodologies and frameworks applied by the undertaking.</li>
              </ol></div></a>, the undertaking shall:
	<ol class="slds-list--ordered">
        <li>consider, as far as applicable, the GHG Protocol Corporate Standard (version 2004), Product Standard (version 2011), Agriculture Guidance (version 2014), Land use, <b>land use change</b>, and forestry Guidance for GHG project accounting (version 2006);</li>
        <li>apply consensus methods on accounting for GHG removals as soon as they are available, notably the EU regulatory framework for the certification of CO2 removals;</li>
        <li>if applicable, explain the role of removals for its <b>climate change mitigation policy</b>;</li>
        <li>include removals from operations that it owns or controls, or contributes to and that have not been sold to another party through carbon credits;</li>
        <li>if applicable, mark those GHG removal activities in own operations or the value chain that have been converted into carbon credits and sold on to other parties on the voluntary market;</li>
		<li>account for the GHG <b>emissions</b> associated with a removal activity, including transport and storage, under Disclosure Requirement E1-6 (Scopes 1, 2 or 3). To increase transparency on the efficiency of a removal activity, the undertaking may disclose the GHG emissions associated with this activity (e.g., GHG emissions from electricity consumption of direct air capture technologies) alongside, but separately from, the amount of removed GHG emissions;</li>
        <li>in case of a reversal, account for the respective GHG emissions as an offset for the removals in the reporting period;</li>
        <li>use the most recent <b>GWP</b> values published by the IPCC based on a 100-year time horizon to calculate CO2eq emissions of non-CO2 gases and describe the assumptions made, methodologies and frameworks applied for calculation of the amount of GHG removals; and</li>
        <li>consider <b>nature-based solutions</b>.</li>
	</ol><br>

    AR 59. The undertaking shall disaggregate and separately disclose the GHG removals that occur in its own operations and those that occur in its upstream and downstream value chain. GHG removal activities in the upstream and downstream <b>value chain</b> shall include those that the undertaking is actively supporting, for example, through a cooperation project with a <b>supplier</b>. The undertaking is not expected to include any GHG removals that may occur in its upstream and downstream value chain that it is not aware of.<br><br>

    <b><i>GHG mitigation projects financed through carbon credits</i></b><br><br>

    AR 61. Financing GHG <b>emission reduction</b> projects outside the undertaking’s <b>value chain</b> through purchasing <b>carbon credits</b> that fulfil high-quality standards can be a useful contribution towards mitigating climate change. This Standard requires the undertaking to disclose whether it uses <b>carbon credits</b> separately from the GHG <b>emissions</b> (paragraphs&nbsp;<a class="tooltip-wrap">56(b)&nbsp;
        <div class="tooltip-content">The amount of GHG emission reductions or removals from climate change mitigation projects outside its value chain it has financed or intends to finance through any purchase of carbon credits.
        </div></a>and&nbsp;<a class="tooltip-wrap">59<div class="tooltip-content">
           The disclosure on carbon credits required by paragraph 56(b) shall include, if applicable:
              <ol class="slds-list--ordered">
              <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq that are verified against recognised quality standards and cancelled in the reporting period; and</li>
              <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq planned to be cancelled in the future based on existing contractual agreements or not.</li>
              </ol>
        </div></a>) and GHG <b>emission reduction targets</b> (Disclosure Requirement E1-4). It also requires the undertaking to show the extent of use and which quality criteria it uses for those carbon credits.<br><br>

    AR 62. When disclosing the information on <b>carbon credits</b> required under paragraphs&nbsp;<a class="tooltip-wrap">56(b)&nbsp;
        <div class="tooltip-content">The amount of GHG emission reductions or removals from climate change mitigation projects outside its value chain it has financed or intends to finance through any purchase of carbon credits.
        </div></a>and&nbsp; <a class="tooltip-wrap">59<div class="tooltip-content">
           The disclosure on carbon credits required by paragraph 56(b) shall include, if applicable:
              <ol class="slds-list--ordered">
              <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq that are verified against recognised quality standards and cancelled in the reporting period; and</li>
              <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq planned to be cancelled in the future based on existing contractual agreements or not.</li>
              </ol></div></a>, the undertaking shall c disclose the following disaggregation as applicable::
	  <ol class="slds-list--ordered">
        <li>the share (percentage of volume) of reduction projects and removal projects;</li>
        <li>for carbon credits from removal projects, an explanation whether they are from biogenic or technological sinks;</li>
		<li>the share (percentage of volume) for each recognised quality standard;</li>
        <li>the share (percentage of volume) issued from projects in the EU; and</li>
        <li>the share (percentage of volume) that qualifies as a corresponding adjustment under Article. 6 of the Paris Agreement.</li>
	  </ol><br>

    <i>Calculation guidance</i><br><br>
    
        AR 63. When preparing the information on <b>carbon credits</b> required under paragraphs&nbsp;<a class="tooltip-wrap">56(b)&nbsp;
            <div class="tooltip-content">The amount of GHG emission reductions or removals from climate change mitigation projects outside its value chain it has financed or intends to finance through any purchase of carbon credits.
            </div></a>and&nbsp;<a class="tooltip-wrap">59
            <div class="tooltip-content">The disclosure on carbon credits required by paragraph 56(b) shall include, if applicable:
              <ol class="slds-list--ordered">
              <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq that are verified against recognised quality standards and cancelled in the reporting period; and</li>
              <li>the total amount of carbon credits outside the undertaking’s value chain in metric tonnes of CO2eq planned to be cancelled in the future based on existing contractual agreements or not.</li>
              </ol></div></a>, the undertaking shall:
		<ol class="slds-list--ordered">
        <li>Consider <b>recognised quality standards</b>;</li>
        <li>if applicable, explain the role of carbon credits in its <b>climate change mitigation policy</b>;</li>
        <li>not include carbon credits issued from GHG <b>emission reduction</b> projects within its <b>value chain</b> as the respective GHG emission reductions shall already be disclosed under Disclosure Requirement E1-6 (Scope 2 or Scope 3) at the time they occur (i.e., double counting is avoided);</li>

        <li>not disclose carbon credits as a means to reach the GHG emission reduction targets disclosed under Disclosure Requirement E1-4; and</li>
        <li>calculate the amount of carbon credits to be cancelled in the future, as the sum of carbon credits in metric tonnes of CO2eq over the duration of existing contractual agreements.</li>

    <b>Anticipated financial effects from material physical and transition risks</b><br><br>

    AR 67. Material climate-related <b>physical risks</b> and <b>transition risks</b> may affect the undertaking’s financial position (e.g., owned assets, financially-controlled leased assets, and liabilities), performance (e.g., potential future increase/decrease in net revenue and costs due to business interruptions, increased supply prices resulting in potential margin erosions), and cash flows. The low probability, high severity and long-term time horizons of some climate-related physical risk exposures and the uncertainty arising from the transition to a sustainable economy mean that there will be associated material <b>anticipated financial effects</b> that are outside the scope of the requirements of existing accounting standards.<br><br>

    AR 68. Currently, there is no commonly accepted methodology to assess or measure how material <b>physical risks</b> and <b>transition risks</b> may affect the undertaking’s future financial position and performance and cash flows. Therefore, the disclosure of the financial effects (as required by paragraphs&nbsp;<a class="tooltip-wrap">64
        <div class="tooltip-content">
        The undertaking shall disclose its:
		<ol class="slds-list--ordered">
        <li>anticipated financial effects from material physical risks;</li>
        <li>anticipated financial effects from material transition risks; and</li>
        <li>potential to benefit from material climate-related opportunities.</li>
		</ol>
        </div></a>, <a class="tooltip-wrap">66&nbsp;
    <div class="tooltip-content">
    The disclosure of anticipated financial effects from material physical risks required by paragraph 64(a) shall include<sup>48</sup>:
    <ol class="slds-list--ordered">
    <li>the monetary amount and proportion (percentage) of assets at material physical risk over the short-, medium- and long-term before considering climate change adaptation actions; with the monetary amounts of these assets disaggregated by acute and chronic physical risk <sup>49</sup>;</li>
    <li>the proportion of assets at material physical risk addressed by the climate change adaptation actions; </li>
    <li>the location of significant assets at material physical risk<sup>50</sup>; and</li>
    <li>the monetary amount and proportion (percentage) of net revenue from its business activities at material physical risk over the short-, medium- and long-term.</li>
    </ol>
    </div></a>and <a class="tooltip-wrap">67&nbsp;
    <div class="tooltip-left">
    The disclosure of anticipated financial effects from material transition risk required by paragraph 64(b) shall include:
    <ol class="slds-list--ordered">
    <li>the monetary amount and proportion (percentage) of assets at material transition risk over the short-, medium- and long-term before considering climate mitigation actions; </li>
    <li>the proportion of assets at material transition risk addressed by the climate change mitigation actions;</li>
    <li>a breakdown of the carrying value of the undertaking’s real estate assets by energy-efficiency classes<sup>51</sup>;</li>
    <li>liabilities that may have to be recognised in financial statements over the short-, medium- and long-term; and</li>
    <li>the monetary amount and proportion (percentage) of net revenue from its business activities at material transition risk over the short-, medium- and long-term including, where relevant, the net revenue from the undertaking’s customers operating in coal, oil and gas-related activities.</li>
    </ol>
    </div></a>will depend on the undertaking’s internal methodology and the exercise of significant judgement in determining the inputs, and assumptions needed to quantify their <b>anticipated financial effects</b>.<br><br>
