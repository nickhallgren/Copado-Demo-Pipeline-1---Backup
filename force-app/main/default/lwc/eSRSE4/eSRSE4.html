        <summary>Objective</summary>
        <div>
           1. The objective of this Standard is to specify Disclosure Requirements which will enable users of the <b>sustainability statements</b> to understand:
		   <ol class="slds-list--ordered">
				<li>how the undertaking affects <b>biodiversity</b> and <b>ecosystems</b>, in terms of material positive and negative, actual and potential impacts, including the extent to which it contributes to the drivers of biodiversity and ecosystem loss and degradation;</li>
				<li>any <b>actions</b> taken, and the result of such actions, to prevent or mitigate material negative actual or potential impacts and to protect and restore biodiversity and ecosystem  loss and degradation; and</li>
				<li>the plans and capacity of the undertaking to adapt its strategy and <b>business model</b> in line with: 
				<ol class="slds-is-nested">
				<li>respecting <b>planetary boundaries</b> related to <b>biosphere integrity</b> and <b>landsystem change</b>;</li>
				<li>the vision of the Kunming-Montreal Global Biodiversity Framework and its relevant goals and <b>targets</b>;</li>
				<li>relevant aspects of the EU Biodiversity Strategy for 2030<span class="tooltip-wrap"><sup>77</sup>&nbsp;
                <div class="tooltip-content">
                EU Biodiversity Strategy for 2030- Bringing nature back into our lives, COM/2020/380 final.
                </div> 
            </span>.</li>
				<li>Directive 2009/147/EC of the European Parliament and of the Council and Council Directive 92/43/EEC (EU Birds and Habitats Directives)<span class="tooltip-wrap"><sup>78</sup>&nbsp;
                <div class="tooltip-left">
                Directive 2009/147/EC of the European Parliament and of the Council of 30 November 2009 on the conservation of wild birds (OJ L 20, 26.1.2010, p. 7) and Council Directive 92/43/EEC of 21 May 1992 on the conservation of natural habitats and of wild fauna and flora (OJ L 206, 22.7.1992, p. 7)
                </div> 
            </span>; and</li>
				<li>Directive 2008/56/EC of the European Parliament and of the Council (Marine Strategy Framework Directive<span class="tooltip-wrap"><sup>79</sup>&nbsp;
                <div class="tooltip-content">
                Directive 2008/56/EC of the European Parliament and of the Council of 17 June 2008 establishing a framework for community action in the field of marine environmental policy (Marine Strategy Framework Directive) (OJ L 164, 25.6.2008, p. 19). 
                </div> 
            </span>;</li>
				</ol></li>
				<li>the nature, type and extent of the undertaking’s material risks, dependencies and opportunities related to biodiversity and ecosystems, and how the undertaking manages them; and</li>
				<li>the <b>financial effects</b> on the undertaking over the short-, medium- and long-term of material risks and opportunities arising from the undertaking’s impacts and dependencies on biodiversity and ecosystems.</li>
			</ol>
			<br>
			2. This Standard sets out Disclosure Requirements related to the undertaking’s relationship to terrestrial, <b>freshwater</b> and marine <b>habitats, ecosystems</b> and populations of related fauna and flora species, including diversity within species, between species and of ecosystems and their interrelation with <b>indigenous people</b> and other affected communities.<br><br>
			3. The terms “<b>biodiversity</b>” and <b>“biological diversity</b>" refer to the variability among living organisms from all sources including, inter alia, terrestrial, <b>freshwater</b>, marine and other aquatic <b>ecosystems</b> and the ecological complexes of which they are part. <br><br>
        </div>
    </details>

		11. <b>The undertaking shall disclose how its biodiversity and ecosystem impacts, dependencies, risks and opportunities originate from and trigger adaptation of its strategy and business model.</b><br><br>
        12. The objective of this Disclosure Requirement is to enable an understanding of the resilience of the undertaking’s strategy and <b>business model</b> in relation to <b>biodiversity</b> and ecosystems, and of the compatibility of the undertaking’s strategy and business model with regard to relevant local, national and global public policy <b>targets</b> related to biodiversity and ecosystems.<br><br>
        13. The undertaking shall describe the resilience of its strategy and <b>business model</b> in relation to <b>biodiversity</b> and <b>ecosystems</b>. The description shall include:
			<ol class="slds-list--ordered">
			<li>an assessment of the resilience of the current business model and strategy to biodiversity and ecosystems-related physical, transition and systemic risks;</li>
			<li>the scope of the resilience analysis in relation to the undertaking’s own operations and its upstream and downstream value chain and in relation to the risks considered in that analysis;</li>
			<li>the key assumptions made;</li>
			<li>the time horizons used;</li>
			<li>the results of the resilience analysis; and</li>
			<li>the involvement of stakeholders, including, where appropriate, holders of indigenous and local knowledge.</li>
			</ol>
			<br>
		14. If information specified in this disclosure requirement is disclosed by the undertaking as part of the information required under ESRS 2 SBM-3, the undertaking may refer to the information it has disclosed under ESRS 2 SBM-3.<br><br>
		15. The undertaking may disclose its <b>transition plan</b> to improve and, ultimately, achieve alignment of its <b>business model</b> and strategy with the vision of the Kunming-Montreal Global Biodiversity Framework and its relevant goals and targets, the EU Biodiversity Strategy for 2030, and with respecting <b>planetary boundaries</b> related to biosphere integrity and <b>land-system change</b>. 
		<br>

        26. The objective of this Disclosure Requirement is to enable an understanding of the key <b>actions</b> taken and planned that significantly contribute to the achievement of <b>biodiversity</b> and <b>ecosystems</b>-related <b>policy</b> objectives and <b>targets</b>.<br><br>

        29. <b>The undertaking shall describe the biodiversity and ecosystem-related targets it has set</b>.<br><br>
        30. The objective of this Disclosure Requirement is to allow an understanding of the <b>targets</b> the undertaking has adopted to support its <b>biodiversity</b> and <b>ecosystems policies</b> and address its material related <b>impacts, dependencies, risks</b> and <b>opportunities</b>.<br><br>

		<ol class="slds-list--ordered">

        <ol class="slds-is-nested">

          <li>whether or not the thresholds are entity-specific and if so, how they were determined; and</li>
          <li>how responsibility for respecting identified ecological thresholds is allocated in the undertaking.</li>

		<li>the geographical scope of the targets, if relevant;</li>
		<li>whether or not the undertaking used biodiversity offsets in setting its targets; and</li>
		<li>to which of the layers of the mitigation hierarchy the target can be allocated (i.e., avoidance, minimisation, restoration and rehabilitation, compensation or offsets).</li>

		37. For datapoints specified in paragraphs 38 to 41, the undertaking shall consider its own operations.<br><br>
		38. If the undertaking has concluded that it directly contributes to the <b>impact drivers</b> of <b>land-use change, freshwater</b>-use change and/or sea-use change, it shall report relevant <b>metrics</b>. The undertaking may disclose metrics that measure:
			<ol class="slds-list--ordered">

			</li>

        42. <b>The undertaking shall disclose its potential financial effects of material biodiversity- and ecosystem-related risks and opportunities</b>.<br><br>
        43.The information required by paragraph 42 is in addition to the information on current financial effects on the entity’s financial position, financial performance and cash flows for the reporting period required under ESRS 2 SBM-3 para 48 (d). <br><br>
		44. The objective of this Disclosure Requirement is to provide an understanding of:
		<ol class="slds-list--ordered">
        <li><b>anticipated financial effects</b> due to material risks arising from biodiversity- and ecosystem-related impacts and <b>dependencies</b> and how these risks have (or could reasonably be expected to have) a material influence on the undertaking’s financial position, financial performance and cash flows over the short-, medium- and long-term; and</li>
        <li>anticipated financial effects due to material opportunities related to biodiversity- and ecosystem.</li>
		</ol>
		<br>
		
        45. The disclosure shall include:
		<ol class="slds-list--ordered">
        <li>a quantification of the <b>anticipated financial effects</b> in monetary terms before considering <b>biodiversity</b> and <b>ecosystems</b>-related actions or where not possible without undue cost or effort, qualitative information. For <b>financial effects</b> arising from material opportunities, a quantification is not required if it would result in disclosure that does not meet the qualitative characteristics of information (see ESRS 1 Appendix B Qualitative characteristics of information). The quantification of the anticipated financial effects in monetary terms may be a single amount or a range;</li>
		<li>a description of the effects considered, the impacts and <b>dependencies</b> to which they relate and the time horizons in which they are likely to materialise; and</li>
		<li>the critical assumptions used to quantify the anticipated financial effects as well as the sources and the levelof uncertainty of those assumptions.</li>
		</ol>
		<br>

		AR 1. If disclosing a transition plan, the undertaking may:
			<ol class="slds-list--ordered">
			<li>explain how it will adjust its strategy and <b>business model</b> to improve and, ultimately, achieve alignment with relevant local, national and global public policy goals and <b>targets</b> related to <b>biodiversity</b> and <b>ecosystems</b> including the vision of the KunmingMontreal Global Biodiversity Framework and its relevant goals and targets, the EU Biodiversity Strategy for 2030, and Directive 2009/147/EC Council Directive 92/43/EEC (the EU Birds and Habitats Directives) and, as appropriate, <b>planetary boundaries</b> related to biosphere integrity and <b>land-system change</b>;</li>
			<li>include information about its own operations and also explain how it is responding to material impacts in its upstream and downstream value chain identified in its materiality assessment in accordance with ESRS 2 IRO-1 Description of the processes to identify and assess material impacts, risks and opportunities;</li>
			<li>explain how its strategy interacts with its transition plan;</li>
			<li>explain how it contributes to addressing biodiversity and ecosystem impact drivers and its possible mitigation actions following the mitigation hierarchy and the main path-dependencies and locked-in assets and resources (e.g., plants, raw materials) that are associated with biodiversity and ecosystems change;</li>
			<li>explain and quantify its investments and funding supporting the implementation of its transition plan, with a reference to the key performance indicators of taxonomyaligned CapEx, and where relevant the CapEx plans, that the undertaking discloses in accordance with Commission Delegated Regulation (EU) 2021/2178;</li>
			<li>if it has economic activities that are covered by delegated regulations on biodiversity under the Taxonomy Regulation, explain any objective or plans (CapEX, CapEx plans) that it has for aligning its economic activities (revenues, CapEx) with the criteria established in those delegated regulations;</li>
			<li>explain how biodiversity offsets are used as part of the transition plan, and if so, where the offsets are planned to be used, the extent of use in relation to the overall transition plan, and whether the mitigation hierarchy was considered;</li>
			<li>explain how the process of implementing and updating the transition plan is managed;</li>
			<li>explain how it measures progress, namely indicate the metrics and methodologies it uses for that purpose;</li>
			<li>indicate whether the administrative, management and supervisory bodies have approved the transition plan; and</li>
			<li>indicate current challenges and limitations to draft a plan in relation to areas of significant impact and how the company is addressing those challenges.</li>
			</ol>
			<br>

			<ol class="slds-list--ordered">

            <li>The risk and use of chemical pesticides is reduced by 50%, and the use of more hazardous pesticides is reduced by 50%.</li>
            <li>At least 25% of agricultural land is under organic farming management, and the uptake of agro-ecological practices is significantly increased.</li>
            <li>Three billion additional trees are planted in the EU, in full respect of ecological principles.</li>
            <li>Significant progress in the <b>remediation</b> of contaminated <b>soil sites</b>.</li>

            <li>The losses of nutrients from fertilisers are reduced by 50%, resulting in the reduction of the use of fertilisers by at least 20%.</li>
            <li>The negative impacts on sensitive species and habitats, including on the seabed through fishing and extraction activities, are substantially reduced to achieve good environmental status.</li>
            </ol>

			<ol class="slds-list--ordered">
			<li>SDG 2 - End hunger, achieve food security and improved nutrition and promote sustainable agriculture;</li>
			<li>SDG 6 - Ensure availability and sustainable management of water and sanitationfor all;</li>

			<li>the <b>free, prior and informed consent</b> for access to genetic resources.</li>
			</ol>
		<br><br>
		AR 16. The undertaking may also explain how its <b>policy</b> enables it to:
			<ol class="slds-list--ordered">
			<li>avoid negative impacts on <b>biodiversity</b> and <b>ecosystems</b> in its own operations and related upstream and downstream <b>value chain</b>;</li>
			<li>reduce and minimise its negative impacts on biodiversity and ecosystems in its operations and throughout the upstream and downstream value chain that cannot be avoided;</li>
			<li>restore and rehabilitate degraded ecosystems or restore cleared ecosystems following exposure to impacts that cannot be completely avoided and/or minimised; and</li>
			<li>mitigate its contribution to material <b>biodiversity loss</b> drivers.</li>
			</ol>
			<br>
		
		AR 17. When disclosing its <b>policies</b>, if referring to third-party standards of conduct, the undertaking may disclose whether the standard used:
			<ol class="slds-list--ordered">
			<li>is objective and achievable based on a scientific approach to identifying issues, and realistic in assessing how these issues can be addressed on the ground under a variety of practical circumstances;</li>
			<li>is developed or maintained through a process of ongoing consultation with <b>stakeholders</b> with balanced input from all relevant stakeholder groups, including producers, traders, processors, financiers, local people and communities, <b>indigenous peoples</b>, and civil society organisations representing <b>consumer</b>, environmental and social interests, with no group holding undue authority or veto power over the content;</li>
			<li>encourages a step-wise approach and continuous improvement, both in thestandard and its application of better management practices, and requires the establishment of meaningful <b>targets</b> and specific milestones to indicate progress against principles and criteria over time;</li>
			<li>is verifiable through independent certifying or verifying bodies, which have defined and rigorous assessment procedures that avoid conflicts of interest, and are compliant with ISO guidance on accreditation and verification procedures or Article 5(2) of Regulation (EC) No 765/2008; and</li>
			<li>conforms to the ISEAL Code of Good Practice.</li>
			</ol>
			<br>
	    </div>
        </details>
		
		<details>
            <summary> E4-3 </summary>
        <div id='divE4-3AR'>
		AR 18. The undertaking may relate significant monetary amounts of CapEx and OpEx required to implement the actions taken or planned to:
			<ol class="slds-list--ordered">
			<li>the relevant line items or notes in the financial statements;</li>
			<li>the key performance indicators required under article 8 of Regulation (EU) 2020/852 and under Commission Delegated Regulation (EU) 2021/2178; and</li>
			<li>if applicable, the CapEx plan required by Commission Delegated Regulation (EU) 2021/2178.</li>
			</ol>
			<br>
	    AR 19. The undertaking may disclose whether it considers an “avoidance” action plan, which prevents damaging <b>actions</b> before they take place. Avoidance often involves a decision to deviate from the business-as-usual project development path. An example of avoidance is altering the <b>biodiversity</b> and ecosystem footprint of a project to avoid destruction of natural <b>habitat</b> on the <b>site</b> and/or establishing set-asides where priority biodiversity values are present and will be conserved. At a minimum, avoidance should be considered where there are biodiversity and ecosystem-related values that are in one of the following categories: particularly vulnerable and irreplaceable, of particular concern to <b>stakeholders</b>, or where a cautious approach is warranted due to uncertainty about impact assessment or about the efficacy of management measures. The three main types of avoidance are defined below:
			<ol class="slds-list--ordered">
			<li>avoidance through Site Selection (Locate the entire project away from areas recognised for important biodiversity values);</li>
			<li>avoidance through Project Design (Configure infrastructure to preserve areas at the project site with important biodiversity values); and</li>
			<li>avoidance through Scheduling (Time project activities to account for patterns of species behaviour (e.g., breeding, migration) or ecosystem functions (e.g., river dynamics).</li>
			</ol>
		<br>
		AR 20. With regard to key <b>actions</b>, the undertaking may disclose:
             <ol class="slds-list--ordered">
             <li>a list of key <b>stakeholders</b> involved (e.g., competitors, suppliers, retailers, other business partners, affected communities and authorities, government agencies) and how they are involved, mentioning key stakeholders negatively or positively impacted by actions and how they are impacted, including impacts or benefits created for affected communities, smallholders' <b>indigenous people</b> or other persons in vulnerable groups;</li>
             <li>where applicable, an explanation on the need for appropriate consultations and the need to respect the decisions of affected communities;</li>
             <li>a brief assessment whether the key actions may induce significant negative sustainability <b>impacts</b>;</li>
             <li>an explanation whether the key action is intended to be a one-time initiative or systematic practice;</li>
             <li>an explanation on whether the key action plan is carried out only by the undertaking, using the undertaking’s resources, or whether it is part of a wider initiative to which the undertaking significantly contributes. If the key action plan is part of a wider initiative, the undertaking may provide more information on the project, its sponsors and other participants.</li>
             <li>a description of how the action(s) to contribute to systemwide change, notably to alter the drivers of biodiversity and ecosystem change, e.g., through technological, economic, institutional, and social factors and changes in underlying values and behaviours;</li>
		</ol>
		<br><br>
         AR 21. In the context of this Disclosure Requirement, “local and indigenous knowledge” refer to the understandings, skills and philosophies developed by societies with long histories of interaction with their natural surroundings. For rural and <b>indigenous peoples</b>, local knowledge informs decision-making about fundamental aspects of day-to-day life.<br><br>
	    </div>
        </details>

        AR 26. Measurable <b>targets</b> related to <b>biodiversity</b> and <b>ecosystems</b> may be expressed as:
		<ol class="slds-list--ordered">
           <li>size and location of all <b>habitat</b> areas protected or restored, whether directly or indirectly controlled by the undertaking, and whether the success of the restoration measure was or is approved by independent external professionals;</li>
           <li>recreated surfaces (environments in which management initiatives are implemented so as to create a habitat on a <b>site</b> where it did not exist initially); or</li>
           <li>number or percentage of projects / sites whose ecological integrity was improved (e.g., installation of fish passes, wildlife corridors).</li>

        <div id='divE4-5AR'>
		AR 27. When preparing the information required under this Disclosure Requirement, the undertaking shall consider and may describe:
			<ol class="slds-list--ordered">
			<li>the methodologies and <b>metrics</b> used and an explanation for why these methodologies and metrics are selected, as well as their assumptions, limitations and uncertainties, and any changes in methodologies madeover time and why they occurred;</li>
			<li>the scope of the metrics and methodologies, for example:
				<ol class="slds-is-nested">
				<li>undertaking, <b>site</b>, brand, commodity, corporate business unit, activity;</li>
				<li>aspects (as set out in paragraph AR 4) covered.</li>
				</ol></li>
			<li>the <b>biodiversity</b> components of the metrics: species specific, ecosystemspecific;</li>
			<li>the geographies covered by the methodology and an explanation of why any relevant geographies were omitted;</li>
			<li>how the metrics integrate <b>ecological thresholds</b> (e.g., the <b>biosphere integrity</b> and <b>land-system change, planetary boundaries</b>) and allocations;</li>
			<li>the frequency of monitoring, key metrics being monitored, and the baseline condition/value and baseline year/period, as well as the reference period;</li>
			<li>whether these metrics rely on primary data, secondary data, modelled data or on expert judgement, or a mixture of these;</li>
			<li>an indication of which action is measured and monitored via the metricsand how they relate to the achievement of <b>targets</b>;</li>
			<li>whether metrics are mandatory (required by legislation) or voluntary. If they are mandatory, the undertaking may indicate the relevant legislation; if voluntary, the undertaking may refer to any voluntary standard or procedure used; and</li>
			<li>whether the metrics are informed by or correspond to expectations or recommendations of relevant and authoritative national, EU-level or intergovernmental guidelines, <b>policies</b>, legislation or agreements, such as the Convention for Biological Diversity (CBD) or IPBES.</li>
			</ol>
			<br>
		AR 28. The undertaking shall disclose <b>metrics</b> that are verifiable and that are technically and scientifically robust considering the appropriate time scales geographies, and may disclose how its selected metrics correspond to those criteria. To ensure that the metric is relevant there should be a clear relationship between the indicator and the purpose of the measurement. Uncertainties should be reduced as far as possible. Data or mechanisms used should be supported by well-established organisations and updated over time. Robust modelleddata and expert judgment can be used where data gaps exist. The methodology shall be sufficiently detailed to allow for meaningful comparison of impacts and mitigation activities over time. Information gathering processes and definitions must be systematically applied. This enables a meaningful review of the undertaking’s performance over time and helps internal and peer comparison.<br><br>
		AR 29. If a metric corresponds to a target, the baseline for both shall be aligned. The <b>biodiversity</b> baseline is an essential component of the larger biodiversity and <b>ecosystems</b> management process. The baseline is necessary to inform impact assessment and management planning, as well as monitoring and adaptive management.<br><br>
		AR 30. Methodologies available to collect data and measure the undertakings’ impacts on <b>biodiversity</b> and <b>ecosystems</b> may be separated into three categories as follows:
			<ol class="slds-list--ordered">
			<li>primary data: collected in-situ using on the ground surveys;</li>
			<li>secondary data: including geospatial data layers that are overlaid with geographic location data of business activities.
				<ol class="slds-is-nested">
				<li>At the species level, data layers on the ranges of different species can be used to predict the species that may be present at different locations.This includes operation <b>sites</b> and sourcing locations. Different range layers will have different levels of accuracy depending on certain factors (e.g., whether species ranges have been refined based on availability of <b>habitat</b>). Information on the threat status of the species, and the activities that threaten them, can provide an indication of the likely contribution that business activities may be having on driving population trends and threat status</li>
				<li>At the ecosystem level, data layers reflecting change in the extent and condition of ecosystems can be applied, including levels of <b>habitat fragmentation</b> and connectivity.</li>
				</ol>
			</li>
			<li>modelled biodiversity state data: Model-based approaches are commonly used for measuring ecosystem level indicators (e.g., extent, condition, or function). Models quantify how the magnitude of different pressures affects the state of biodiversity. These are referred to as pressure-state relationships and are based on globally collected data. Modelling results are applied locally to estimate how undertakinglevel pressures will cause changes in ecosystem condition.An impact driver generally has three main characteristics: magnitude (e.g., amount of contaminant, noise intensity), spatial extent (e.g., area of land contaminated) and temporal extent (duration of persistence of contaminant).</li>
			</ol><br><br>
		AR 31. With regard to life cycle assessment for land-use, the undertaking may refer to the “Landuse related environmental indicators for Life Cycle Assessment” by the Joint Research Center.<br><br>
		AR 32. With regard to the introduction of invasive alien species, the undertaking may disclose the pathways and number of <b>invasive alien species</b> and the extent of surface covered by invasive alien species.<br><br>
		AR 33. With regard to metrics on the extent and condition of <b>ecosystems</b>, useful guidance can be found in the work of the United Nations System of Environmental Economic Accounting Ecosystem Accounting (UN SEEA EA).<br><br>
		AR 34. The undertaking may disclose in units of area (e.g., m2 or ha) on land-use using guidance provided by the Eco-Management and Audit Scheme (EMAS)<span class="tooltip-wrap"><sup>89</sup>
            <div class="tooltip-left">
			As proposed by Commission Regulation (EU) 2018/ 2026 of 19 December 2018 amending Annex IV to Regulation (EC) No 1221/2009 of the European Parliament and of the Council on the voluntary participation by organisations in a Community ecomanagement and audit scheme (EMAS) (OJ L 325, 20.12.2018, p. 18).
            </div></span>:
			<ol class="slds-list--ordered">
			<li>total use of land;</li>
			<li>total sealed area;</li>
			<li>total nature-oriented area on <b>site</b>; and</li>
			<li>total nature-oriented area off site.</li>
			</ol>
			<br>
		AR 35. The undertaking may disclose, for example, land cover change, which is the physical representation of the drivers “habitat modification” and “industrial and domestic activities”, i.e., the man-made or natural change of the physical properties of the earth’s surface at a specific location.<br><br>
		AR 36. Land cover is a typical variable that can be assessed with earth observation data.<br><br>
        AR 37. When reporting on material impacts related to the <b>ecosystems</b>, the undertaking may, in addition to the extent and condition of ecosystems, also consider the functioning of ecosystems by using:
			<ol class="slds-list--ordered">
			<li>a metric that measures a process or function that the ecosystem completes, or that reflects the ability of the ecosystem to undertake that specific process or function: e.g. net primary productivity, which is a measure of plant productivity based on the rate at which energy is stored by plants and made available to other species in the ecosystem. It is a core process that occurs for ecosystems to function. It is related to many factors, such as species diversity, but does not measure these factors directly; or</li>
			<li>A metric that measures changes to the population of scientifically identified species under threat.</li>
			</ol><br>
		AR 38. At the ecosystem level, data layers reflecting change in the extent and condition of <b>ecosystems</b> may be applied, including levels of <b>habitat fragmentation</b> and connectivity.<br><br>
